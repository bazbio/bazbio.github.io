  // ── 초기화 ──
  let 그린부트_ = false;      // 스냅샷으로 이미 화면을 열었는가 (PLAN.md 2b)

  /* 관문과 GAS를 **동시에** 부른다 (ADR 0004 3-b).
   * 관문의 지난번 스냅샷이 0.2초쯤에 와서 화면을 즉시 열고, 1.5초 뒤 도착한 GAS 응답이
   * 조용히 덮는다. 덮어도 안전한 이유: renderMain은 폼 값·탭·선택한 칩을 건드리지 않는다
   * (renderWhoChips가 picked를 보존한다).
   * 낡음 예산을 정할 필요가 없는 구조다 — 낡은 것을 잠깐 보여주고 곧 진짜로 덮는다. */
  async function init(){
    show('vLoading');
    계측('init');
    스냅샷받기_();            // 기다리지 않는다. 먼저 온 쪽이 먼저 그린다
    try {
      DATA = await gs('웹_초기데이터', TOKEN);
      계측('GAS 초기데이터');
    } catch (e) {
      /* 스냅샷으로 이미 앱이 떠 있으면 로그인 화면으로 내쫓지 않는다 — 잠깐 끊긴 네트워크로
         쓰던 화면을 날리는 것이 더 나쁘다. 토큰이 죽은 경우라면 관문도 같은 규칙으로 401을
         내므로 스냅샷이 애초에 안 그려졌고, 그러면 여기서 로그인으로 간다.
         단 **인증 만료로 판명되면** 스냅샷이 떠 있어도 내쫓는다 — 관문이 먼저 응답한 좁은
         틈에 스냅샷이 그려졌을 수 있고, 권한을 잃은 사람에게 마지막 화면을 계속 보여 주면
         안 된다 (Codex 리뷰 2026-08-30). 네트워크 오류는 지금처럼 화면을 지킨다. */
      const 인증만료 = /세션이 만료|다시 로그인/.test(String(e && e.message || ''));
      if (!그린부트_ || 인증만료) {
        localStorage.removeItem('brg_token'); TOKEN = ''; DATA = null;
        show('vLogin');
        if (인증만료) toast('세션이 만료되었습니다. 다시 로그인해 주세요.');
      }
      return;
    }
    그리기_();
  }

  function 그리기_(){
    renderMain();
    show('vMain');
    계측('화면 그림');
    if (BOOT.d) { openDetail(BOOT.d); BOOT.d = null; }
  }

  /* 관문을 직접 부르는 유일한 자리. `gs()`는 GAS 디스패처 전용이라 다른 주소를 태울 수 없고,
     이 호출은 GAS 호출을 **대체**하는 게 아니라 나란히 나가는 것이라 그 안에 낄 자리가 없다. */
  function 스냅샷받기_(){
    /* 응답은 **이 요청을 보낸 토큰**에 묶인다. 그 사이 인증 만료로 내쫓겼거나(TOKEN='')
       다른 사람으로 재로그인했으면(TOKEN이 다른 값) 늦게 도착한 이 응답은 남의 화면이다 —
       DATA가 비었다는 이유로 그리면 안 된다 (Codex 2026-08-30, 두 번에 걸쳐 잡았다). */
    const 요청토큰 = TOKEN;
    fetch(GATE_URL + '/bridge-boot', {
      method: 'POST',
      // text/plain이라야 CORS 사전요청이 없다. 토큰 안의 한글은 본문이라 그대로 실린다
      // (헤더였다면 ASCII 제한에 걸린다 — 관문이 토큰을 본문으로 받는 이유가 그것이다)
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ 토큰: 요청토큰 }),
    }).then(r => r.ok ? r.json() : null)   // 404 = 아직 안 구워졌다. 오류가 아니다
      .then(r => {
        계측('스냅샷 도착');
        if (!r || !r.payload) return;
        if (TOKEN !== 요청토큰) return;    // 만료·로그아웃·재로그인 — 죽은 요청의 응답이다
        if (DATA) return;                  // GAS가 먼저 왔다 — 낡은 것으로 덮지 않는다
        // 모양이 어긋난 스냅샷은 아예 안 쓴다. 관문이 이중 인코딩된 문자열을 저장하면
        // 여기가 undefined로 터지는데, 아래 catch가 삼켜 조용히 느려지기만 한다
        if (!r.payload.me) throw new Error('스냅샷 모양이 아닙니다');
        DATA = 상태정규화(r.payload);
        // 그리다 실패하면 DATA를 되돌린다. 세워 둔 채 던지면 뒤에 온 GAS 응답이 「이미 그렸다」로
        // 착각할 여지가 생긴다
        try { 그리기_(); 그린부트_ = true; } catch (e) { DATA = null; throw e; }
      })
      .catch(e => console.warn('스냅샷 건너뜀:', e && e.message));
  }

  function renderMain(){
    const me = DATA.me;
    $('whoName').textContent = me.name + (me.title ? ' · ' + me.title : '');
    $('todayLabel').textContent = DATA.today;
    $('pageTitle').textContent = me.manage ? '업무지시' : '내 지시';
    $('mainTabs').classList.remove('hide');
    $('mainTabs').querySelector('[data-tab=new]').textContent = me.manage ? '새 지시' : '새 요청';
    $('formHead').textContent = me.manage ? '새 지시' : '새 요청 (대표님께)';
    $('whoLabel').textContent = me.manage ? '담당 임원' : '받는 사람';
    $('newTitle').placeholder = me.manage ? '지시 내용을 입력하세요' : '요청 내용을 입력하세요';
    $('btnNewSend').textContent = me.manage ? '지시 보내기' : '요청 보내기';
    $('newMeetWrap').classList.toggle('hide', !me.manage);   // 미팅 일시 지정은 대표/관리자만

    // 통계 타일
    const s = DATA.stats;
    // 컨펌 대기 — 대표에게는 「내가 컨펌할 것」, 임원에게는 「내가 보고해 둔 것」.
    // s.confirm이 없는 옛 부트 스냅샷은 0으로 받는다
    $('tiles').innerHTML =
      tile('진행 중', s.open, '') + tile('기한 임박', s.late, s.late ? 'bad' : '') +
      tile('컨펌 대기', s.confirm || 0, s.confirm ? 'warn' : '') + tile('막힘', s.stuck || 0, s.stuck ? 'bad' : '');

    // 막힌 곳 + 미팅 + 임원별 현황 + 목록 + 캘린더
    renderStuck();
    renderMeet();
    renderMembers();
    renderBoard();

    // 이미 쓰인 구분을 새 지시 폼의 후보로 — 같은 갈래를 사람마다 다른 말로 적으면 간트가 쪼개진다
    const cats = DATA.directives.map(d => d.cat).filter(c => c && c !== '미분류')
      .filter((c, i, a) => a.indexOf(c) === i).sort((a, b) => a.localeCompare(b, 'ko'));
    $('catList').innerHTML = cats.map(c => '<option value="' + esc(c) + '">').join('');

    // 지시 명의 — 관리자만, 01_구성원에 '대표' 역할이 있을 때
    const boss = DATA.boss;
    $('newAsWrap').classList.toggle('hide', !boss);
    if (boss) {
      $('newAsBoss').textContent = boss.name + ' 대표님 대신';
      $('newAsHint').textContent = boss.name + '님 명의로 발송되어 받는 분에게는 대표님 지시로 표시됩니다. '
        + boss.name + '님께는 대리 발송 알림 메일이 갑니다.';
    }

    renderWhoChips();
  }

  // 받는 사람 칩 — '대표님 대신' 모드에서는 대표님 본인을 빼고, 관리자 본인을 추가
  // (대표님이 관리자에게 지시하는 경우도 대리 등록할 수 있어야 하므로)
  function renderWhoChips(){
    const me = DATA.me;
    const asBoss = onBehalf();
    const picked = [...$('newWho').querySelectorAll('.chip.on')].map(c => c.dataset.name);
    const list = DATA.members.filter(m => !(asBoss && DATA.boss && m.name === DATA.boss.name));
    if (asBoss) list.push({ name: me.name, title: me.title });
    $('newWho').innerHTML = list.map(m =>
      '<button class="chip' + (picked.indexOf(m.name) >= 0 ? ' on' : '') + '" data-name="' + esc(m.name) + '">'
      + esc(m.name) + (m.title ? ' · ' + esc(m.title) : '') + '</button>').join('')
      || '<span class="empty">' + (me.manage ? '01_구성원 시트에 임원을 등록해 주세요' : '01_구성원 시트에 대표님이 등록되어 있어야 합니다') + '</span>';
    $('newWho').querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => c.classList.toggle('on')));
    if (!me.manage && list.length === 1) $('newWho').querySelector('.chip').classList.add('on');
    $('newAsHint').classList.toggle('hide', !asBoss);
    $('whoLabel').textContent = !me.manage ? '받는 사람' : (asBoss ? '담당 임원 · 대표님 명의로 발송' : '담당 임원');
  }
  const onBehalf = () => !!DATA.boss && segVal('newAsSeg') === 'boss';

  // 부문 칩 — 화면 전체에서 액센트 파랑 단일 톤으로 통일
  const deptChip = t => t ? '<span class="dept">' + esc(t) + '</span>' : '';

  // ── 미팅 요청 카드 (04_미팅) — 지시와 무관한 독립 요청 ──
  const MEETS = () => DATA.meetings || [];
  const meetPendingMine = () => MEETS().some(t => t.from === DATA.me.name && (t.status === '대기' || t.status === '역제안'));
  // 미래 확정 여부 — whenIso 'yyyy-MM-dd HH:mm'
  const meetUpcoming = t => t.status === '확정' && t.whenIso && new Date(t.whenIso.replace(' ', 'T')) >= new Date();

  /* 막힌 곳 — 「지금 어디가 막혔는지」를 현황판 맨 위에 올린다.
     정렬은 **정체일수 내림차순**이다. 기한 초과 순으로 놓으면 매일 진행 중인 장기 건이 위로 오고
     한 달째 아무도 안 건드린 건이 아래로 밀린다 — 그게 지금까지의 화면이었다.
     임원에게는 「내 차례」와 「대표님 확인 대기」를 나눠 준다. 공이 어디 있는지가 임원에겐 전부다. */
  function renderStuck(){
    const me = DATA.me;
    const rows = (DATA.directives || []).filter(d => d.stuck)
      .sort((a, b) => (b.stallDays || 0) - (a.stallDays || 0));
    $('stuckHead').textContent = rows.length ? '막힌 곳 · ' + rows.length + '건' : '막힌 곳';
    if (!rows.length) { $('stuckList').innerHTML = '<div class="empty">막힌 곳이 없습니다</div>'; return; }

    let h = '';
    if (me.manage) h = rows.map(stuckItemHtml).join('');
    else {
      /* 공은 사유가 정한다. 마지막 글쓴이로 가르면 두 방향 다 틀린다 —
         내가 답한 뒤 세부업무가 지연되면 내 일인데 남의 일로 보이고,
         미처리 미팅 요청 뒤에 누가 코멘트를 달면 대표 확인 대기인데 내 차례로 보인다.
         '무진행'만은 사유가 공을 못 말해 주므로 그때만 마지막 글쓴이를 본다. */
      const 대표대기 = d => d.stuckWhy === '대표 확인 대기'
        || (d.stuckWhy === '무진행' && d.lastBy === me.name);
      const 내차례 = rows.filter(d => !대표대기(d));
      const 상대차례 = rows.filter(대표대기);
      if (내차례.length) h += '<div class="stuck-g">내 차례</div>' + 내차례.map(stuckItemHtml).join('');
      if (상대차례.length) h += '<div class="stuck-g">대표님 확인 대기</div>' + 상대차례.map(stuckItemHtml).join('');
    }
    $('stuckList').innerHTML = h;
    $('stuckList').querySelectorAll('.ditem').forEach(el =>
      el.addEventListener('click', () => openDetail(Number(el.dataset.id))));
  }

  function stuckItemHtml(d){
    const 상대 = d.owner === DATA.me.name ? d.who.join(', ') : d.owner;
    // '대표 확인 대기'는 사유와 설명이 같은 말이다 — 칩에 이미 있으므로 줄에서는 뺀다
    const 설명 = d.stuckText && d.stuckText !== d.stuckWhy ? ' · ' + d.stuckText : '';
    return '<button class="ditem" data-id="' + d.id + '">'
      + '<div class="txt"><b>' + esc(d.title) + '</b><span>' + esc(상대 + 설명) + '</span></div>'
      + '<div class="side"><span class="pill late">' + esc(d.stuckWhy) + '</span>'
      + '<i class="dday over">' + d.stallDays + '일</i></div></button>';
  }

  function renderMeet(){
    const me = DATA.me;
    const isCeo = me.role === '대표';
    const ceoName = DATA.ceo ? DATA.ceo.name : '';
    $('meetHead').textContent = isCeo ? '미팅 요청' : (ceoName ? ceoName + ' 대표님과 미팅' : '대표님과 미팅');

    // 진행 중(대기·역제안) 전부 + 다가오는 확정 미팅 + (요청자 본인) 최근 거절 1건
    const rows = MEETS().filter(t => t.status === '대기' || t.status === '역제안' || meetUpcoming(t));
    const lastRejected = MEETS().find(t => t.from === me.name && t.status === '거절');
    if (lastRejected && rows.indexOf(lastRejected) < 0) rows.push(lastRejected);

    $('meetList').innerHTML = rows.length ? rows.map(meetItemHtml).join('')
      : '<div class="empty">' + (isCeo ? '들어온 미팅 요청이 없습니다' : '요청한 미팅이 없습니다') + '</div>';
    $('meetList').querySelectorAll('.ditem').forEach(el =>
      el.addEventListener('click', () => openMeetSheet(Number(el.dataset.mid))));

    // 요청 버튼 — 대표는 받는 쪽이라 없음. 미처리 요청이 있으면 새 요청 대신 안내
    const pending = meetPendingMine();
    $('btnMeetNew').classList.toggle('hide', isCeo || pending);
    $('meetHint').classList.toggle('hide', isCeo || !pending);
    if (!isCeo && pending) $('meetHint').textContent = '처리 대기 중인 요청이 있습니다. 새 요청은 확정되거나 취소한 뒤 할 수 있습니다.';
  }

  function meetPill(t){
    if (t.status === '대기') return '<span class="pill wait">대기</span>';
    if (t.status === '역제안') return '<span class="pill meet">역제안</span>';
    if (t.status === '확정') return '<span class="pill done">확정</span>';
    return '<span class="pill gray">' + esc(t.status) + '</span>';
  }

  function meetItemHtml(t){
    const me = DATA.me;
    const mine = t.from === me.name;
    const sub = (me.manage && !mine ? t.from + ' · ' : '')
      + (t.status === '확정' ? t.when
        : t.status === '역제안' ? '역제안 ' + t.copt1 + ' / ' + t.copt2
        : t.status === '거절' ? (t.note || '이번에는 진행하지 않기로 함')
        : '후보 ' + t.opt1 + (t.opt2 ? ' / ' + t.opt2 : ''));
    return '<button class="ditem" data-mid="' + t.id + '">'
      + '<div class="txt"><b>' + esc(t.topic) + '</b><span>' + esc(sub) + '</span></div>'
      + '<div class="side">' + meetPill(t) + '</div></button>';
  }

  // 미팅 요청 폼 (임원·관리자) — prefill = { topic, ref } (후속 미팅용, 선택)
  window.openMeetForm = (prefill) => {
    const ceoName = DATA.ceo ? DATA.ceo.name + ' 대표님' : '대표님';
    const ref = prefill && prefill.ref ? prefill.ref : 0;
    let h = '<div class="grip"></div>'
      + '<div class="sheet-head"><h2>' + esc(ceoName) + '께 ' + (ref ? '후속 미팅 요청' : '미팅 요청') + '</h2><button class="close" onclick="closeSheet()">닫기</button></div>'
      + '<div class="card">'
      + '<div class="row-label">용건</div>'
      + '<textarea id="mtTopic" placeholder="논의할 내용을 입력하세요" rows="2">' + esc(prefill && prefill.topic ? prefill.topic : '') + '</textarea>'
      + '<div class="row-label">희망 일시 · 후보 1</div>' + dtPickHtml('mtO1')
      + '<div class="row-label">후보 2 (선택)</div>'
      + '<div class="seg" id="mtO2Seg"><button class="on" data-v="">없음</button><button data-v="set">후보 추가</button></div>'
      + '<div id="mtO2Box" class="hide">' + dtPickHtml('mtO2') + '</div>'
      + '<div class="hint">대표님이 후보 중 하나를 선택하면 캘린더 초대가 발송됩니다. 일정이 안 맞으면 다른 일정 2개가 역제안됩니다.</div>'
      + '<button class="btn-primary" id="mtSend">미팅 요청 보내기</button>'
      + '</div>';
    $('sheetBack').classList.remove('hide');
    $('sheetBody').innerHTML = h;
    segInit('mtO2Seg', btn => $('mtO2Box').classList.toggle('hide', btn.dataset.v !== 'set'));
    $('mtSend').addEventListener('click', async () => {
      const topic = $('mtTopic').value.trim();
      if (!topic) { toast('용건을 입력해 주세요'); return; }
      const opt1 = dtPickVal('mtO1');
      if (!opt1) { toast('희망 일시를 선택해 주세요'); return; }
      if (new Date(opt1) < new Date()) { toast('지나간 시각은 선택할 수 없습니다'); return; }
      let opt2 = '';
      if (segVal('mtO2Seg') === 'set') {
        opt2 = dtPickVal('mtO2');
        if (!opt2) { toast('후보 2 날짜를 선택하거나 \'없음\'으로 바꿔 주세요'); return; }
        if (opt2 === opt1) { toast('두 후보가 같은 시각입니다'); return; }
      }
      busy(true, '요청 전송 중...');
      try {
        await gs('웹_미팅요청등록', TOKEN, { topic, opt1, opt2, ref });
        toast('미팅 요청이 전송되었습니다. 대표님께 알림이 갑니다.');
        closeSheet();
        await refresh();
      } catch (e) { toast(e.message); }
      busy(false);
    });
  };

  // 미팅 요청 상세 — 요청자는 취소·역제안 선택, 대표(관리자 대리)는 확정·역제안·거절
  window.openMeetSheet = (id) => {
    const t = MEETS().find(x => x.id === id);
    if (!t) return;
    const me = DATA.me;
    const mine = t.from === me.name;
    const canProc = me.manage && !mine && (t.status === '대기' || t.status === '역제안');

    const org = t.ref ? MEETS().find(x => x.id === t.ref) : null;

    let h = '<div class="grip"></div>'
      + '<div class="sheet-head"><h2>' + esc(t.topic) + '</h2><button class="close" onclick="closeSheet()">닫기</button></div>'
      + '<div class="sheet-meta"><b>' + esc(t.from) + '</b> 요청 · ' + esc(t.ts.slice(0, 16)) + ' ' + meetPill(t)
      + (t.ref ? ' · <button class="chip" style="padding:2px 10px;font-size:11px" onclick="openMeetSheet(' + t.ref + ')">원본 미팅' + (org ? ' · ' + esc(org.topic.slice(0, 14)) : '') + '</button>' : '')
      + '</div>';

    h += '<div class="card"><h3>일정</h3>'
      + '<div class="optline"><span class="tag">후보 1</span>' + esc(t.opt1 || '-') + '</div>'
      + (t.opt2 ? '<div class="optline"><span class="tag">후보 2</span>' + esc(t.opt2) + '</div>' : '');
    if (t.copt1) h += '<div class="optline"><span class="tag">역제안 1</span>' + esc(t.copt1) + '</div>'
      + '<div class="optline"><span class="tag">역제안 2</span>' + esc(t.copt2) + '</div>';
    if (t.status === '확정') h += '<div class="tagline" style="margin-top:10px">미팅 확정 · ' + esc(t.when) + (t.by ? ' — ' + esc(t.by) + ' 확정' : '') + '</div>';
    if (t.status === '거절') h += '<div class="m-body" style="margin-top:10px;font-size:14px">' + esc(t.by ? t.by + '님이 ' : '') + '이번 요청은 진행하지 않기로 했습니다.' + (t.note ? '<br>' + esc(t.note) : '') + '</div>';
    if (t.note && t.status !== '거절') h += '<div class="hint">' + esc(t.note) + '</div>';
    h += '</div>';

    // 대표(또는 관리자 대리) 처리
    if (canProc && t.status === '대기') {
      h += '<div class="card"><h3>요청 처리' + (me.role === '관리자' ? ' <span style="font-weight:400">· 대표님 대신 처리 — 대표님께 알림 메일이 갑니다</span>' : '') + '</h3>'
        + '<div class="chips">'
        + '<button class="chip" onclick="meetPick(' + t.id + ',1)">후보 1로 확정</button>'
        + (t.opt2 ? '<button class="chip" onclick="meetPick(' + t.id + ',2)">후보 2로 확정</button>' : '')
        + '</div>'
        + '<div class="row-label">일정이 안 맞으면 · 역제안 옵션 2개</div>'
        + dtPickHtml('mcO1') + dtPickHtml('mcO2')
        + '<input type="text" id="mcNote" placeholder="메모 (선택)" style="margin-top:8px">'
        + '<button class="btn-quiet" id="mcSend" style="margin-top:12px">역제안 보내기</button>'
        + '<div class="row-label">진행하지 않기</div>'
        + '<input type="text" id="mrNote" placeholder="사유 (선택)">'
        + '<button class="chip danger" id="mrBtn" style="margin-top:8px">거절</button>'
        + '</div>';
    }
    if (canProc && t.status === '역제안') {
      h += '<div class="card"><h3>요청 처리</h3>'
        + '<div class="hint">' + esc(t.from) + '님이 역제안 옵션을 선택하면 확정됩니다.</div>'
        + '<div class="row-label">진행하지 않기</div>'
        + '<input type="text" id="mrNote" placeholder="사유 (선택)">'
        + '<button class="chip danger" id="mrBtn" style="margin-top:8px">거절</button>'
        + '</div>';
    }

    // 요청자 — 역제안 선택 · 취소
    if (mine && t.status === '역제안') {
      h += '<div class="card"><h3>역제안 일정 선택</h3>'
        + '<div class="chips">'
        + '<button class="chip" onclick="meetChoose(' + t.id + ',1)">옵션 1 · ' + esc(t.copt1) + '</button>'
        + '<button class="chip" onclick="meetChoose(' + t.id + ',2)">옵션 2 · ' + esc(t.copt2) + '</button>'
        + '</div><div class="hint">선택하면 바로 확정되고 캘린더 초대가 발송됩니다.</div></div>';
    }
    if (mine && (t.status === '대기' || t.status === '역제안')) {
      h += '<div class="card"><h3>요청 관리</h3><div class="chips">'
        + '<button class="chip danger" onclick="meetCancel(' + t.id + ', this)">요청 취소</button>'
        + '</div></div>';
    }

    // 후속 미팅 — 확정된 미팅에서 이어 잡기 (요청자는 후속 요청, 대표·관리자는 일시 직접 지정)
    if (t.status === '확정') {
      if (mine) {
        h += '<div class="card"><h3>후속 미팅</h3>'
          + (meetPendingMine()
            ? '<div class="hint">처리 대기 중인 미팅 요청이 있습니다. 확정되거나 취소한 뒤 후속 요청을 할 수 있습니다.</div>'
            : '<div class="chips"><button class="chip" onclick="meetFollowReq(' + t.id + ')">후속 미팅 요청</button></div>'
              + '<div class="hint">이 미팅에 이어지는 새 요청이 용건이 채워진 채로 열립니다.</div>')
          + '</div>';
      } else if (me.manage) {
        h += '<div class="card"><h3>후속 미팅 잡기' + (me.role === '관리자' ? ' <span style="font-weight:400">· 대표님 대신 확정</span>' : '') + '</h3>'
          + '<div class="row-label">일시</div>' + dtPickHtml('fuDt')
          + '<div class="row-label">용건</div>'
          + '<input type="text" id="fuTopic" value="' + esc(followTopic(t.topic)) + '">'
          + '<button class="btn-quiet" id="fuSend" style="margin-top:12px">후속 미팅 확정 (캘린더 초대)</button>'
          + '<div class="hint">' + esc(t.from) + '님과의 후속 미팅이 바로 확정되고 캘린더 초대가 발송됩니다.</div>'
          + '</div>';
      }
    }

    $('sheetBack').classList.remove('hide');
    $('sheetBody').innerHTML = h;

    const fuSend = $('fuSend');
    if (fuSend) fuSend.addEventListener('click', async () => {
      const when = dtPickVal('fuDt');
      if (!when) { toast('후속 미팅 일시를 선택해 주세요'); return; }
      if (new Date(when) < new Date()) { toast('지나간 시각으로 미팅을 지정할 수 없습니다'); return; }
      busy(true, '캘린더 등록 중...');
      try {
        const r = await gs('웹_후속미팅확정', TOKEN, { ref: t.id, when: when, topic: $('fuTopic').value.trim() });
        toast('후속 미팅 확정 · ' + r.when + ' 캘린더 초대가 발송되었습니다');
        closeSheet();
        await refresh();
      } catch (e) { toast(e.message); }
      busy(false);
    });

    const mcSend = $('mcSend');
    if (mcSend) mcSend.addEventListener('click', async () => {
      const copt1 = dtPickVal('mcO1'), copt2 = dtPickVal('mcO2');
      if (!copt1 || !copt2) { toast('역제안 옵션 2개를 모두 선택해 주세요'); return; }
      if (copt1 === copt2) { toast('두 옵션이 같은 시각입니다'); return; }
      busy(true, '역제안 전송 중...');
      try {
        await gs('웹_미팅요청처리', TOKEN, { id: t.id, action: 'counter', copt1, copt2, note: $('mcNote').value.trim() });
        toast('역제안이 전송되었습니다. ' + t.from + '님이 선택하면 확정됩니다.');
        closeSheet();
        await refresh();
      } catch (e) { toast(e.message); }
      busy(false);
    });
    const mrBtn = $('mrBtn');
    if (mrBtn) mrBtn.addEventListener('click', async () => {
      if (!mrBtn.dataset.arm) {
        mrBtn.dataset.arm = '1';
        mrBtn.textContent = '한 번 더 누르면 거절';
        setTimeout(() => { mrBtn.dataset.arm = ''; mrBtn.textContent = '거절'; }, 4000);
        return;
      }
      busy(true, '처리 중...');
      try {
        await gs('웹_미팅요청처리', TOKEN, { id: t.id, action: 'reject', note: $('mrNote').value.trim() });
        toast('거절 처리되었습니다. ' + t.from + '님께 알림이 갑니다.');
        closeSheet();
        await refresh();
      } catch (e) { toast(e.message); }
      busy(false);
    });
  };

  // 후속 용건 — 후속의 후속이어도 접두어는 한 번만
  const followTopic = topic => topic.indexOf('[후속]') === 0 ? topic : '[후속] ' + topic;

  // 확정 미팅에서 후속 요청 — 용건을 채운 요청 폼 열기
  window.meetFollowReq = (id) => {
    const t = MEETS().find(x => x.id === id);
    if (!t) return;
    openMeetForm({ topic: followTopic(t.topic), ref: t.id });
  };

  window.meetPick = async (id, choice) => {
    busy(true, '캘린더 등록 중...');
    try {
      const r = await gs('웹_미팅요청처리', TOKEN, { id, action: 'pick', choice });
      toast('미팅 확정 · ' + r.when + ' 캘린더 초대가 발송되었습니다');
      closeSheet();
      await refresh();
    } catch (e) { toast(e.message); }
    busy(false);
  };
  window.meetChoose = async (id, choice) => {
    busy(true, '미팅 확정 중...');
    try {
      const r = await gs('웹_미팅역제안선택', TOKEN, id, choice);
      toast('미팅 확정 · ' + r.when + ' 캘린더 초대가 발송되었습니다');
      closeSheet();
      await refresh();
    } catch (e) { toast(e.message); }
    busy(false);
  };
  window.meetCancel = async (id, btn) => {
    if (!btn.dataset.arm) {
      btn.dataset.arm = '1';
      btn.textContent = '한 번 더 누르면 취소';
      setTimeout(() => { btn.dataset.arm = ''; btn.textContent = '요청 취소'; }, 4000);
      return;
    }
    busy(true, '취소 중...');
    try {
      await gs('웹_미팅취소', TOKEN, id);
      toast('미팅 요청이 취소되었습니다');
      closeSheet();
      await refresh();
    } catch (e) { toast(e.message); }
    busy(false);
  };

  // 임원별 현황 (대표/관리자) — 곳간식 카드 그리드, 부문·이름 순 정렬
  function renderMembers(){
    const list = (DATA.byMember || []).slice().sort((a, b) =>
      (a.title || '').localeCompare(b.title || '', 'ko') || a.name.localeCompare(b.name, 'ko'));
    if (!list.length) { $('cardMembers').classList.add('hide'); return; }
    if (FILTER.member && !list.some(m => m.name === FILTER.member)) FILTER.member = '';
    $('cardMembers').classList.remove('hide');
    $('memRows').innerHTML = '<div class="mgrid">' + list.map(m => {
      const total = m.open + m.done30;
      const rate = total ? Math.round(m.done30 / total * 100) : 0;   // 최근 30일 처리율
      const nd = nextDueOf(m.name);
      return '<button class="mcard' + (FILTER.member === m.name ? ' on' : '') + '" data-name="' + esc(m.name) + '">'
        + deptChip(m.title)
        + '<b>' + esc(m.name) + '</b>'
        + '<div class="mbar"><i style="width:' + rate + '%"></i></div>'
        + (nd ? '<span class="mdue' + (nd.dday <= 1 ? ' near' : nd.dday <= 3 ? ' soon' : '') + '">'
            + '다음 기한 ' + esc(nd.dueKo) + ' · ' + nd.ddayLabel + '</span>'
          : '<span class="mdue">예정된 기한 없음</span>')
        + '<div class="mstats"><span>진행 ' + m.open + '</span>'
        + '<span class="' + (m.late ? 'bad' : '') + '">연체 ' + m.late + '</span>'
        + '<span class="ok">완료 ' + m.done30 + '</span></div></button>';
    }).join('') + '</div>';
    $('memRows').querySelectorAll('.mcard').forEach(el =>
      el.addEventListener('click', () => openMember(el.dataset.name)));
  }

  // 해당 임원의 진행 중 지시 가운데 가장 임박한 기한
  function nextDueOf(name){
    const list = DATA.directives.filter(d => d.who.indexOf(name) >= 0
      && isOpen(d.status) && d.dday != null);
    return list.length ? list.reduce((a, b) => (a.dday <= b.dday ? a : b)) : null;
  }

  // 임원 상세 시트 — 통계 + 진행 중 + 최근 완료
  function openMember(name){
    const m = (DATA.byMember || []).find(x => x.name === name);
    const mine = DATA.directives.filter(d => d.who.indexOf(name) >= 0);
    const open = mine.filter(d => isOpen(d.status))
      .sort((a, b) => (a.dday == null ? 999 : a.dday) - (b.dday == null ? 999 : b.dday));
    const done = mine.filter(d => d.status === '완료').slice(0, 5);

    let h = '<div class="grip"></div>'
      + '<div class="sheet-head"><h2>' + esc(name)
      + (m && m.title ? ' <span style="font-size:13px;font-weight:500;color:var(--sub)">' + esc(m.title) + '</span>' : '')
      + '</h2><button class="close" onclick="closeSheet()">닫기</button></div>'
      + '<div class="tiles" style="grid-template-columns:repeat(3,1fr)">'
      + tile('진행 중', m ? m.open : open.length, '')
      + tile('연체', m ? m.late : 0, m && m.late ? 'bad' : '')
      + tile('최근 30일 완료', m ? m.done30 : 0, 'ok')
      + '</div>'
      + '<div class="card"><h3>진행 중 · 기한 순</h3><div class="dlist">'
      + (open.length ? open.map(itemHtml).join('') : '<div class="empty">진행 중인 지시가 없습니다</div>')
      + '</div></div>'
      + '<div class="card"><h3>최근 완료</h3><div class="dlist">'
      + (done.length ? done.map(itemHtml).join('') : '<div class="empty">아직 없습니다</div>')
      + '</div></div>'
      + '<button class="btn-quiet" id="mbFilter" style="margin-top:12px">현황판에서 이 임원 지시만 보기</button>';

    $('sheetBack').classList.remove('hide');
    $('sheetBody').innerHTML = h;
    $('sheetBody').querySelectorAll('.ditem').forEach(el =>
      el.addEventListener('click', () => openDetail(Number(el.dataset.id))));
    $('mbFilter').addEventListener('click', () => {
      FILTER.member = name;
      renderMembers(); renderBoard();
      closeSheet();
      $('cardMembers').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // 지시 목록 (검색·필터 반영)
  function matchFilter(d){
    if (FILTER.member && d.who.indexOf(FILTER.member) < 0) return false;
    if (FILTER.type && (d.type || '일반') !== FILTER.type) return false;
    if (!FILTER.q) return true;
    const hay = (d.title + ' ' + (d.detail || '') + ' ' + d.owner + ' ' + d.who.join(' ') + ' ' + (d.cat || '')).toLowerCase();
    return hay.indexOf(FILTER.q) >= 0;
  }

  /* ── 본판 뷰 전환 (노션 판 2026-08-30) — 표가 기본, 간트·캘린더는 전환 뷰 ──
     뷰 선택만 기억한다(brg_view). 유형·검색 필터는 세션 한정 — 남겨 두면
     「업무가 사라졌다」로 읽히는 사고가 된다. */
  const VIEWS = { table: 'viewTable', gantt: 'viewGantt', cal: 'viewCal' };
  let VIEW = 'table';
  try { VIEW = localStorage.getItem('brg_view') || 'table'; } catch (e) {}
  if (!VIEWS[VIEW]) VIEW = 'table';

  function renderBoard(){
    Object.keys(VIEWS).forEach(v => $(VIEWS[v]).classList.toggle('hide', v !== VIEW));
    $('viewTabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.view === VIEW));
    // 임원 필터 표시는 뷰 공통이다 — 어느 뷰에서든 걸려 있으면 보이고 풀 수 있어야 한다
    $('listLabel').innerHTML = FILTER.member
      ? esc(FILTER.member) + ' 필터 <button class="chip" id="clearMf" style="padding:2px 10px;font-size:11px">해제</button>' : '';
    const clearMf = $('clearMf');
    if (clearMf) clearMf.addEventListener('click', () => { FILTER.member = ''; renderMembers(); renderBoard(); });
    if (VIEW === 'gantt') renderGantt();
    else if (VIEW === 'cal') renderCal();
    else renderTable();
  }

  /* 구분으로 묶는다 — '미분류'는 맨 아래 (이름 있는 갈래를 먼저 본다). 표·간트 공용 */
  function 갈래묶기_(rows){
    const 묶음 = {}, 갈래 = [];
    rows.forEach(d => {
      const k = d.cat || '미분류';
      if (!묶음[k]) { 묶음[k] = []; 갈래.push(k); }
      묶음[k].push(d);
    });
    갈래.sort((a, b) => (a === '미분류') - (b === '미분류') || a.localeCompare(b, 'ko'));
    return { 묶음: 묶음, 갈래: 갈래 };
  }

  // 저장된 상태 그대로의 배지 — 막힘 사유·미팅 칩(pillOf)과 달리 표는 상태만 말한다
  function 상태필(d){
    const cls = { '시작 전': 'todo', '진행 중': 'doing', '컨펌 대기': 'confirm', '완료': 'done', '보류': 'gray' }[d.status] || 'todo';
    return '<span class="pill ' + cls + '">' + esc(d.status) + '</span>';
  }

  /* D-day 신호등 (쇼츠 규칙): 7일 초과 🟢 · 3일 초과 🟠 · 그 이하·지남 🔴.
     일이 끝났거나(컨펌 대기·완료·보류) 기한이 없으면 안 찍는다.
     마일스톤이 지연된 업무는 상위 기한이 아무리 멀어도 🔴 — 병목 우선순위(세부 지연 > 상위 기한)와
     같은 말을 해야 초록불 옆에 「세부 지연」 칩이 뜨는 모순이 안 생긴다. */
  function 신호등(d){
    if (d.dday == null || (d.status !== '시작 전' && d.status !== '진행 중')) return '';
    const c = d.subLate ? 'r' : d.dday > 7 ? 'g' : d.dday > 3 ? 'o' : 'r';
    const 말 = c === 'g' ? '여유' : c === 'o' ? '주의' : '임박';
    return '<i class="tl ' + c + '" role="img" aria-label="' + 말 + '"></i>';
  }

  /* 업무 표 — 열린 업무는 전부, 완료는 최근 14일, 보류는 항상 (완료가 영영 쌓여
     화면을 밀어내는 문제는 간트 창 필터와 같은 취지로 여기서도 자른다) */
  function renderTable(){
    const rows = DATA.directives.filter(matchFilter).filter(d => {
      if (isOpen(d.status) || d.status === '보류') return true;
      const done = 날짜(d.done);
      return done ? (자정(new Date()) - done) / DAYMS <= 14 : true;
    });
    if (!rows.length) {
      $('tblWrap').innerHTML = '<div class="empty">'
        + ((FILTER.q || FILTER.member) ? '조건에 맞는 업무가 없습니다' : '아직 등록된 업무가 없습니다') + '</div>';
      return;
    }
    const 차례 = { '시작 전': 0, '진행 중': 0, '컨펌 대기': 1, '보류': 2, '완료': 3 };
    const { 묶음, 갈래 } = 갈래묶기_(rows);
    let h = '<div class="tbl-h"><span>업무</span><span>담당</span><span>상태</span><span>마감</span><span>마일스톤</span></div>';
    갈래.forEach(k => {
      h += '<div class="tbl-g"><i>' + esc(k) + '</i><em>' + 묶음[k].length + '건</em></div>';
      묶음[k].sort((a, b) =>
        (차례[a.status] || 0) - (차례[b.status] || 0)
        || (a.dday == null ? 999 : a.dday) - (b.dday == null ? 999 : b.dday)
        || b.id - a.id
      ).forEach(d => { h += 표줄(d); });
    });
    $('tblWrap').innerHTML = h;
    $('tblWrap').querySelectorAll('.tbl-r[data-id]').forEach(el =>
      el.addEventListener('click', () => openDetail(Number(el.dataset.id))));
  }

  function 표줄(d){
    const 담당 = d.who.join(', ') || d.owner;
    const 마감 = d.due
      ? 신호등(d) + '<span>' + 짧은날(d.due) + '</span>' + ddayBadge(d)
      : (d.doneKo ? '<span>완료 ' + esc(짧은날(d.done)) + '</span>' : '<span>—</span>');
    const ms = d.subN
      ? '<span class="msbar"><i style="width:' + Math.round(d.subDone / d.subN * 100) + '%"></i></span>' + d.subDone + '/' + d.subN
      : '—';
    return '<button class="tbl-r" data-id="' + d.id + '">'
      + '<b class="t-title">'
      + (d.type === 'KPI' ? '<span class="pill meet" style="margin-right:6px">KPI</span>' : '')
      + (d.pri === '긴급' ? '<span class="pill late" style="margin-right:6px">긴급</span>' : '')
      + esc(d.title) + '</b>'
      + '<span class="t-meta">'
      + '<span class="t-who">' + esc(담당) + '</span>'
      + '<span class="t-st">' + 상태필(d) + '</span>'
      + '<span class="t-due">' + 마감 + '</span>'
      + '<span class="t-ms">' + ms + '</span>'
      + '</span></button>';
  }

  /* ── 업무 일정 (간트) ──
     엑셀 Action Plan을 그대로 옮긴 표다. 구분으로 묶고, 업무 아래 세부업무를 들여 쓰고,
     오른쪽에 시작일~마감일 막대를 그린다. 창은 28일이고 ‹ ›로 2주씩 민다.
     상태(완료/지연/진행중)는 서버가 파생해 준다 — 여기서 다시 세지 않는다. */
  /* 하루 폭은 JS가 정해 `--gt-dw`로 내려보낸다 — CSS에 따로 적으면 막대 좌표와 칸이 어긋난다.
     좁은 화면에서 34px를 쓰면 4일치밖에 안 보여서, 폰에서는 칸을 좁힌다. */
  const GT_DAYS = 28, DAYMS = 86400000;
  const 하루폭 = () => (innerWidth < 700 ? 26 : 34);
  let GT_DW = 하루폭();
  let GT_FROM = null;                       // 창의 첫날 (자정)
  const 자정 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const 날짜 = s => (s ? 자정(new Date(s + 'T00:00:00')) : null);
  const 짧은날 = s => { const t = 날짜(s); return t ? (t.getMonth() + 1) + '/' + t.getDate() : ''; };

  function renderGantt(){
    const today = 자정(new Date());
    GT_DW = 하루폭();
    if (!GT_FROM) GT_FROM = new Date(today.getTime() - 7 * DAYMS);
    const 칸 = dt => Math.round((자정(dt) - GT_FROM) / DAYMS);   // 창 시작으로부터 며칠째
    const 끝 = new Date(GT_FROM.getTime() + (GT_DAYS - 1) * DAYMS);
    $('gtRange').textContent = 짧은날(iso(GT_FROM)) + ' – ' + 짧은날(iso(끝));

    /* 완료·보류는 **보이는 기간과 겹칠 때만** 남긴다. 안 그러면 몇 달 전에 끝난 업무가
       영영 쌓여 화면을 밀어낸다 (전에는 「완료·보류」 카드가 15건으로 잘랐다).
       진행 중인 업무는 기간이 창 밖이어도 늘 보인다 — 놓치면 안 되는 쪽이라서다. */
    const 줄들 = DATA.directives.filter(matchFilter).filter(d => {
      if (isOpen(d.status)) return true;
      const 폭 = 기간(d);
      // 날짜가 하나도 없으면 어느 창에서도 못 보게 된다 — 그런 업무는 늘 남긴다
      if (!폭) return true;
      return 폭.to >= GT_FROM && 폭.from <= 끝;
    });
    if (!줄들.length) {
      $('gtWrap').innerHTML = '<div class="empty">'
        + ((FILTER.q || FILTER.member) ? '조건에 맞는 업무가 없습니다'
          : DATA.directives.length ? '이 기간에 표시할 업무가 없습니다 — ‹ › 로 기간을 옮겨 보세요'
          : '아직 등록된 업무가 없습니다') + '</div>';
      return;
    }

    const { 묶음, 갈래 } = 갈래묶기_(줄들);

    let h = '<div class="gt" style="--gt-dw:' + GT_DW + 'px">' + 달머리(GT_FROM) + 날머리(GT_FROM, today);
    갈래.forEach(k => {
      h += '<div class="gt-grp"><i>' + esc(k) + '<em>' + 묶음[k].length + '건</em></i></div>';
      묶음[k].sort((a, b) => {
        const x = 첫날(a), y = 첫날(b);
        return (x ? x.getTime() : Infinity) - (y ? y.getTime() : Infinity) || b.id - a.id;
      }).forEach(d => { h += 지시줄(d, 칸, today); });
    });
    $('gtWrap').innerHTML = h + '</div>';
    $('gtWrap').querySelectorAll('.gt-row[data-id]').forEach(el =>
      el.addEventListener('click', () => openDetail(Number(el.dataset.id))));
  }

  const iso = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  const 세부들 = d => (DATA.subs || {})[d.id] || [];

  /** 그 업무가 차지하는 기간 — 정렬(첫날)과 창 겹침 판정에 같이 쓴다.
   *  세부업무의 날짜와 상위 기한을 통틀어 가장 이른 날 ~ 가장 늦은 날. 날짜가 하나도 없으면 null */
  function 기간(d){
    const 날들 = [];
    세부들(d).forEach(s => { [날짜(s.start), 날짜(s.due), 날짜(s.done)].forEach(x => { if (x) 날들.push(x); }); });
    // 완료일도 센다 — 기한 없이 끝난 업무는 이것 말고 일정 위에 놓을 자리가 없다
    [날짜(d.due), 날짜(d.done)].forEach(x => { if (x) 날들.push(x); });
    if (!날들.length) return null;
    const t = 날들.map(x => x.getTime());
    return { from: new Date(Math.min.apply(null, t)), to: new Date(Math.max.apply(null, t)) };
  }
  const 첫날 = d => { const p = 기간(d); return p ? p.from : null; };

  function 달머리(from){
    let h = '<div class="gt-mons">', i = 0;
    while (i < GT_DAYS) {
      const dt = new Date(from.getTime() + i * DAYMS);
      let n = 0;
      while (i + n < GT_DAYS && new Date(from.getTime() + (i + n) * DAYMS).getMonth() === dt.getMonth()) n++;
      h += '<div class="gt-mon" style="width:' + (n * GT_DW) + 'px">' + (dt.getMonth() + 1) + '월</div>';
      i += n;
    }
    return h + '</div>';
  }

  function 날머리(from, today){
    let h = '<div class="gt-row head"><div class="gt-lab"><b>업무 · 마일스톤</b><span>담당 · 기간</span></div><div class="gt-track">';
    for (let i = 0; i < GT_DAYS; i++) {
      const dt = new Date(from.getTime() + i * DAYMS);
      h += '<div class="gt-d' + 날칸(dt, today) + '">' + dt.getDate() + '</div>';
    }
    return h + '</div></div>';
  }

  const 날칸 = (dt, today) => (dt.getDay() === 0 || dt.getDay() === 6 ? ' we' : '')
    + (dt.getTime() === today.getTime() ? ' today' : '');

  /** 업무 한 줄 + 그 아래 세부업무 줄들. 업무 막대는 세부업무 전체를 감싼 요약이다 */
  function 지시줄(d, 칸, today){
    const subs = 세부들(d);
    // 컨펌 대기는 지연 판정보다 먼저다 — 보고를 마친 업무가 빨갛게 나오면 임원이 헛쫓긴다
    const 상태 = d.status === '완료' ? 'done' : d.status === '보류' ? 'hold'
      : d.status === '컨펌 대기' ? 'confirm'
      : (d.subLate || (d.dday != null && d.dday < 0)) ? 'late' : 'wait';
    const 기간 = subs.length ? 감싸기(subs) : null;
    const 요약 = [d.who.join(', ') || d.owner,
      d.dueKo ? '기한 ' + d.dueKo : d.doneKo ? '완료 ' + d.doneKo : '기한 없음',
      d.subN ? '마일스톤 ' + d.subDone + '/' + d.subN : ''].filter(Boolean).join(' · ');

    let h = '<button class="gt-row dir" data-id="' + d.id + '">'
      + '<div class="gt-lab"><b>' + esc(d.title) + '</b><span>' + esc(요약) + '</span></div>'
      + '<div class="gt-track">' + 바탕(today)
      // 기한이 없으면 완료일에 찍는다. 둘 다 없으면 막대도 점도 없이 라벨만 남는다
      + (기간 ? 막대(칸, 기간.from, 기간.to, 상태 + ' roll') : 점(칸, 날짜(d.due) || 날짜(d.done), 상태))
      + '</div></button>';

    subs.forEach(s => {
      const cls = s.status === '완료' ? 'done' : s.status === '지연' ? 'late' : 'wait';
      /* 날짜를 안 넣고 완료만 체크한 세부업무가 흔하다 — 기한이 없으면 완료일이 그 자리를 대신한다.
         안 그러면 그 줄은 라벨만 남고 일정 위에서 사라진다 (Codex 2026-08-30). */
      const 시작 = 날짜(s.start), 끝 = 날짜(s.due) || 날짜(s.done);
      const 누구 = [s.who.join(', '), s.vendor].filter(Boolean).join(' · ');
      const 끝말 = s.due ? '마감 ' : '완료 ';
      const 때 = 시작 && 끝 ? 짧은날(s.start) + '–' + 짧은날(s.due || s.done)
        : 끝 ? 끝말 + 짧은날(s.due || s.done) : 시작 ? 짧은날(s.start) + '–' : '';
      // 세부업무 줄도 누르면 부모 업무가 열린다 — 거기에 완료 체크·기한 변경이 있다
      h += '<button class="gt-row sub" data-id="' + d.id + '">'
        + '<div class="gt-lab"><b>' + esc(s.seq + '. ' + s.title) + '</b><span>'
        + esc([누구 || '담당 미지정', 때].filter(Boolean).join(' · ')) + '</span></div>'
        + '<div class="gt-track">' + 바탕(today)
        + (시작 && 끝 ? 막대(칸, 시작, 끝, cls)
          : 시작 ? 막대(칸, 시작, 시작, cls) : 점(칸, 끝, cls))
        + '</div></button>';
    });
    return h;
  }

  /** 세부업무 전체를 감싸는 기간 — 업무 줄의 요약 막대 */
  function 감싸기(subs){
    // 날짜 없이 완료만 체크한 세부업무는 완료일이 그 줄의 날짜다 — 요약 막대도 그걸 감싸야 한다
    const 시작들 = subs.map(s => 날짜(s.start) || 날짜(s.due) || 날짜(s.done)).filter(Boolean);
    const 끝들 = subs.map(s => 날짜(s.due) || 날짜(s.done) || 날짜(s.start)).filter(Boolean);
    if (!시작들.length || !끝들.length) return null;
    return {
      from: new Date(Math.min.apply(null, 시작들.map(x => x.getTime()))),
      to: new Date(Math.max.apply(null, 끝들.map(x => x.getTime()))),
    };
  }

  let 바탕캐시 = { key: '', html: '' };
  function 바탕(today){
    const key = iso(GT_FROM) + '|' + iso(today);
    if (바탕캐시.key !== key) {
      let h = '';
      for (let i = 0; i < GT_DAYS; i++) h += '<div class="gt-d' + 날칸(new Date(GT_FROM.getTime() + i * DAYMS), today) + '"></div>';
      바탕캐시 = { key: key, html: h };
    }
    return 바탕캐시.html;
  }

  /** 창 밖으로 나가는 막대는 잘라 그리고, 잘린 쪽 끝을 점선으로 표시한다.
   *  통째로 밖이면 빈 줄이 되므로 어느 쪽에 있는지 화살표를 남긴다 — 빈 칸은 「일정 없음」으로 읽힌다 */
  function 막대(칸, from, to, cls){
    const a = 칸(from), b = 칸(to);
    if (b < 0) return 바깥('l');
    if (a > GT_DAYS - 1) return 바깥('r');
    const 왼 = Math.max(a, 0), 오 = Math.min(b, GT_DAYS - 1);
    const 자름 = (a < 0 ? ' cutL' : '') + (b > GT_DAYS - 1 ? ' cutR' : '');
    return '<span class="gt-bar ' + cls + 자름 + '" style="left:' + (왼 * GT_DW + 2)
      + 'px;width:' + ((오 - 왼 + 1) * GT_DW - 4) + 'px"></span>';
  }

  /** 기간 없이 기한만 있는 줄 — 그날에 마름모 하나 */
  function 점(칸, dt, cls){
    if (!dt) return '';
    const i = 칸(dt);
    if (i < 0) return 바깥('l');
    if (i > GT_DAYS - 1) return 바깥('r');
    return '<span class="gt-dot ' + cls + '" style="left:' + (i * GT_DW) + 'px"></span>';
  }

  const 바깥 = 쪽 => '<span class="gt-edge ' + 쪽 + '" title="이 창 밖에 있습니다">'
    + (쪽 === 'l' ? '&#8249;' : '&#8250;') + '</span>';

  $('gtPrev').addEventListener('click', () => { GT_FROM = new Date(GT_FROM.getTime() - 14 * DAYMS); renderGantt(); });
  $('gtNext').addEventListener('click', () => { GT_FROM = new Date(GT_FROM.getTime() + 14 * DAYMS); renderGantt(); });

  /* 폰을 돌리면 하루 폭이 바뀐다 — 다시 그리지 않으면 막대의 인라인 좌표가 옛 폭 그대로라 칸과 어긋난다.
     폭이 실제로 달라졌을 때만 그린다 (스크롤·키보드가 올라와도 resize가 뜬다) */
  addEventListener('resize', () => { if (DATA && VIEW === 'gantt' && GT_DW !== 하루폭()) renderGantt(); });

  $('q').addEventListener('input', () => {
    FILTER.q = $('q').value.trim().toLowerCase();
    if (DATA) renderBoard();
  });

  segInit('viewTabs', btn => {
    VIEW = btn.dataset.view;
    try { localStorage.setItem('brg_view', VIEW); } catch (e) {}
    renderBoard();
  });

  $('typeChips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    FILTER.type = b.dataset.type;
    $('typeChips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    renderBoard();
  }));

  // ── 보고 일정 캘린더 — 진행 중인 지시의 기한을 월 단위로 표시 ──
  let CAL = null;   // 표시 중인 달 {y, m}
  function renderCal(){
    const today = new Date(); today.setHours(0, 0, 0, 0);
    if (!CAL) CAL = { y: today.getFullYear(), m: today.getMonth() };
    $('calTitle').textContent = CAL.y + '년 ' + (CAL.m + 1) + '월';

    const byDay = {};
    DATA.directives
      .filter(matchFilter)   // 검색·임원 필터가 뷰 셋에 똑같이 걸린다 (노션 판)
      .filter(d => d.due && (isOpen(d.status) || d.status === '완료'))
      .forEach(d => {
        const dt = new Date(d.due + 'T00:00:00');
        if (dt.getFullYear() === CAL.y && dt.getMonth() === CAL.m)
          (byDay[dt.getDate()] = byDay[dt.getDate()] || []).push(d);
      });
    // 진행 중을 먼저, 완료는 뒤로 (칸당 3건 표시 제한에서 진행 건이 밀리지 않게)
    Object.keys(byDay).forEach(k => byDay[k].sort((a, b) =>
      (a.status === '완료' ? 1 : 0) - (b.status === '완료' ? 1 : 0)));

    // 확정된 미팅 — 지시 기한과 구분되는 칩(초록)으로 함께 표시
    const meetByDay = {};
    MEETS().filter(t => t.status === '확정' && t.whenIso).forEach(t => {
      const dt = new Date(t.whenIso.replace(' ', 'T'));
      if (dt.getFullYear() === CAL.y && dt.getMonth() === CAL.m)
        (meetByDay[dt.getDate()] = meetByDay[dt.getDate()] || []).push(t);
    });
    Object.keys(meetByDay).forEach(k => meetByDay[k].sort((a, b) => a.whenIso < b.whenIso ? -1 : 1));

    const start = new Date(CAL.y, CAL.m, 1).getDay();
    const days = new Date(CAL.y, CAL.m + 1, 0).getDate();
    let h = ['일','월','화','수','목','금','토'].map((w, i) =>
      '<div class="cal-w' + (i === 0 ? ' sun' : '') + '">' + w + '</div>').join('');
    for (let i = 0; i < start; i++) h += '<div class="cal-d off"></div>';
    for (let day = 1; day <= days; day++) {
      const cur = new Date(CAL.y, CAL.m, day);
      const list = byDay[day] || [];
      const mlist = meetByDay[day] || [];
      // 시각이 정해진 미팅을 먼저, 남는 칸에 지시 기한 (합쳐서 3건 제한)
      const mshow = mlist.slice(0, 3);
      const dshow = list.slice(0, Math.max(0, 3 - mshow.length));
      const over = mlist.length + list.length - mshow.length - dshow.length;
      h += '<div class="cal-d' + (cur.getTime() === today.getTime() ? ' today' : '') + '">'
        + '<span class="n' + (cur.getDay() === 0 ? ' sun' : '') + '">' + day + '</span>'
        + mshow.map(t => {
            const label = t.whenIso.slice(11, 16) + ' ' + (DATA.me.manage ? t.from : '대표님 미팅');
            return '<button class="cal-i meet' + (cur < today ? ' past' : '') + '" data-mid="' + t.id + '"'
              + ' title="미팅 · ' + esc(t.topic) + ' · ' + esc(t.from) + '">' + esc(label) + '</button>';
          }).join('')
        + dshow.map(d => {
            // 대표/관리자는 담당 이름, 임원 본인 화면은 제목이 더 읽기 좋다
            const label = DATA.me.manage ? d.who.join(', ') : d.title;
            const done = d.status === '완료';
            return '<button class="cal-i' + (done ? ' done' : cur < today ? ' past' : '') + '" data-id="' + d.id + '"'
              + ' title="' + esc(d.title) + ' · ' + esc(d.who.join(', ')) + (done ? ' · 완료' : '') + '">' + esc(label) + '</button>';
          }).join('')
        + (over > 0 ? '<span class="cal-more">+' + over + '</span>' : '')
        + '</div>';
    }
    $('calGrid').innerHTML = h;
    $('calGrid').querySelectorAll('.cal-i').forEach(el =>
      el.addEventListener('click', () => el.dataset.mid
        ? openMeetSheet(Number(el.dataset.mid))
        : openDetail(Number(el.dataset.id))));
  }
  $('calPrev').addEventListener('click', () => { CAL.m--; if (CAL.m < 0) { CAL.m = 11; CAL.y--; } renderCal(); });
  $('calNext').addEventListener('click', () => { CAL.m++; if (CAL.m > 11) { CAL.m = 0; CAL.y++; } renderCal(); });

  const tile = (k, v, cls) => '<div class="tile ' + cls + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';

  function pillOf(d){
    if (d.status === '완료') return '<span class="pill done">완료</span>';
    if (d.status === '보류') return '<span class="pill gray">보류</span>';
    // 컨펌 대기는 미팅·기한 칩보다 먼저다 — 보고가 끝난 업무의 나머지 사정은 낡은 정보다
    if (d.status === '컨펌 대기') return '<span class="pill confirm">컨펌 대기</span>';
    // 역제안을 받은 쪽은 '미팅 요청'이 아니라 **고를 차례**다 — 막힌 곳 카드와 같은 말을 쓴다
    if (d.meetPending || d.duePending) return '<span class="pill meet">'
      + (d.meetChoose ? '일정 선택' : (d.meetPending ? '미팅 요청' : '기한 조정')) + '</span>';
    // 막힌 건은 '기한 임박'보다 사유가 쓸모 있다 (기한 임박 위에 둔다)
    if (d.stuck) return '<span class="pill late">' + esc(d.stuckWhy) + '</span>';
    if (d.dday != null && d.dday <= 1) return '<span class="pill late">기한 임박</span>';
    if (d.status === '진행 중') return '<span class="pill doing">진행 중</span>';
    return '<span class="pill todo">시작 전</span>';
  }

  // 진행 중인 지시의 남은 기한 배지 (D-3 · D-DAY · D+2) — 컨펌 대기는 일이 끝난 상태라 뺀다
  function ddayBadge(d){
    if (d.dday == null || (d.status !== '시작 전' && d.status !== '진행 중')) return '';
    const cls = d.dday < 0 ? 'over' : d.dday <= 1 ? 'near' : d.dday <= 3 ? 'soon' : '';
    return '<i class="dday ' + cls + '">' + d.ddayLabel + '</i>';
  }

  function itemHtml(d){
    const other = d.owner === DATA.me.name ? d.who.join(', ') : d.owner;
    const sub = (d.kind === '요청' ? '요청 · ' : '') + other + (d.by ? ' (' + d.by + ' 대리)' : '') +
      (d.dueKo ? ' · 기한 ' + d.dueKo : '') + (d.replyCount ? ' · 답변 ' + d.replyCount : '') +
      // 진행률 — 어느 단계까지 왔는지. 서버가 세어 준 값이라 화면이 다시 세지 않는다
      (d.subN ? ' · 마일스톤 ' + d.subDone + '/' + d.subN + (d.subLate ? ' (지연 ' + d.subLate + ')' : '') : '');
    return '<button class="ditem" data-id="' + d.id + '">' +
      '<div class="txt"><b>' + esc(d.title) + '</b><span>' + esc(sub) + '</span></div>' +
      '<div class="side">' + pillOf(d) + ddayBadge(d) + '</div></button>';
  }

  // ── 대표용 탭 ──
  $('mainTabs').querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    $('mainTabs').querySelectorAll('button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    $('tabBoard').classList.toggle('hide', btn.dataset.tab !== 'board');
    $('tabNew').classList.toggle('hide', btn.dataset.tab !== 'new');
  }));

  $('btnMeetNew').addEventListener('click', () => openMeetForm());

  segInit('newDueQuick', btn => $('newDue').classList.toggle('hide', btn.dataset.days !== ''));
  segInit('newPri');
  segInit('newType');
  segInit('newMeetSeg', btn => $('newMeetBox').classList.toggle('hide', btn.dataset.v !== 'set'));
  segInit('newAsSeg', () => renderWhoChips());
  $('newMeetBox').innerHTML = dtPickHtml('nMeet')
    + '<div class="hint">지시 등록과 동시에 미팅이 확정되고 담당 임원에게 캘린더 초대가 발송됩니다</div>';

  // ── 새 지시 첨부 ──
  let newDirFiles = [];
  $('nAddFile').addEventListener('click', () => $('nFileInput').click());
  $('nFileInput').addEventListener('change', async e => {
    for (const f of e.target.files) {
      if (f.size > 20 * 1024 * 1024) { toast(f.name + ' — 20MB 이하만 업로드할 수 있습니다'); continue; }
      const data = await fileToB64(f);
      newDirFiles.push({ name: f.name, mime: f.type, data });
    }
    e.target.value = '';
    renderNFileChips();
  });
  function renderNFileChips(){
    const box = $('nFiles');
    box.querySelectorAll('.file-chip').forEach(el => el.remove());
    newDirFiles.forEach((f, i) => {
      const el = document.createElement('span');
      el.className = 'file-chip';
      el.innerHTML = '<span>' + esc(f.name) + '</span><button class="x">&times;</button>';
      el.querySelector('.x').addEventListener('click', () => { newDirFiles.splice(i, 1); renderNFileChips(); });
      $('nAddFile').before(el);
    });
  }

  // ── 지시 등록 ──
  $('btnNewSend').addEventListener('click', async () => {
    const title = $('newTitle').value.trim();
    const who = [...$('newWho').querySelectorAll('.chip.on')].map(c => c.dataset.name);
    if (!title) { toast('내용을 입력해 주세요'); return; }
    if (!who.length) { toast('받는 사람을 선택해 주세요'); return; }
    let due = '';
    const quick = $('newDueQuick').querySelector('button.on').dataset.days;
    if (quick !== '') {
      const d = new Date(); d.setDate(d.getDate() + Number(quick));
      due = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    } else due = $('newDue').value;

    let meetAt = '';
    if (DATA.me.manage && segVal('newMeetSeg') === 'set') {
      meetAt = dtPickVal('nMeet');
      if (!meetAt) { toast('미팅 날짜를 선택해 주세요'); return; }
      if (new Date(meetAt) < new Date()) { toast('지나간 시각으로 미팅을 지정할 수 없습니다'); return; }
    }

    busy(true, newDirFiles.length ? '파일 업로드 중...' : '지시를 보내는 중...');
    try {
      const asBoss = onBehalf();
      await gs('웹_지시등록', TOKEN, { title, detail: $('newDetail').value.trim(), who, due, cat: $('newCat').value.trim(), type: segVal('newType'), pri: segVal('newPri'), files: newDirFiles, meetAt, onBehalf: asBoss });
      $('newTitle').value = ''; $('newDetail').value = ''; $('newCat').value = '';
      $('newType').querySelector('[data-v="일반"]').click();
      newDirFiles = []; renderNFileChips();
      $('newWho').querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
      $('nMeetD').value = '';
      $('newMeetSeg').querySelector('[data-v=""]').click();
      if (DATA.boss) $('newAsSeg').querySelector('[data-v=""]').click();
      const roles = who.map(n => (DATA.members.find(m => m.name === n) || {}).role);
      const isReq = !DATA.me.manage || roles.every(r => r === '대표');
      toast((asBoss ? DATA.boss.name + '님 명의로 지시가 전송되었습니다. 대표님께 알림 메일이 갑니다.'
        : isReq ? '요청이 전송되었습니다. 알림이 발송됩니다.'
        : who.length > 1 ? '임원별로 지시가 각각 전송되었습니다. (서로의 답변은 보이지 않습니다)'
        : '지시가 전송되었습니다. 담당 임원에게 알림이 발송됩니다.')
        + (meetAt ? ' 미팅 캘린더 초대도 발송되었습니다.' : ''));
      await refresh();
      $('mainTabs').querySelector('[data-tab=board]').click();
    } catch (e) { toast(e.message); }
    busy(false);
  });

  /* 쓰기 직후라면 서버가 이미 갱신분을 실어 보냈다 — 왕복을 안 낸다 (2026-08-19).
     없을 때만 예전처럼 물어보므로, 갱신을 안 얹는 옛 배포에 붙어도 그냥 돈다. */
  async function refresh(){
    if (갱신대기_) { DATA = 갱신대기_; 갱신대기_ = null; renderMain(); return; }
    try { DATA = await gs('웹_초기데이터', TOKEN); renderMain(); } catch (e) {}
  }

  // ── 상세 시트 ──
  async function openDetail(id){
    $('sheetBack').classList.remove('hide');

    /* 부트에 대화가 실려 있으면 왕복 없이 연다 (2026-08-19).
       `웹_초기데이터`가 어차피 시트에서 대화를 통째로 읽으므로 목록에 보이는 지시는 항상
       여기 걸린다. 모양도 같다 — 양쪽 다 dirDto_·convDto_를 거쳐 나온다.
       스냅샷으로 막 뜬 직후라면 잠깐 낡을 수 있는데, 옛 왕복도 「그 순간의 시트」를 보여줬을
       뿐이라 다르지 않다. GAS 응답이 도착하면 DATA가 갈리고 다음에 열 때 새것으로 그려진다. */
    const 캐시지시 = (DATA.directives || []).find(x => x.id === Number(id));
    const 캐시대화 = DATA.convs && DATA.convs[id];
    // subs는 없을 수 있다 — 옛 스냅샷(2026-08-29 이전)에는 이 키가 아예 없다
    if (캐시지시 && 캐시대화) { renderDetail(캐시지시, 캐시대화, (DATA.subs && DATA.subs[id]) || []); return; }

    $('sheetBody').innerHTML = '<div class="grip"></div><div class="loading-full"><div class="spin"></div></div>';
    let r;
    try { r = await gs('웹_지시상세', TOKEN, id); }
    catch (e) { toast(e.message); closeSheet(); return; }
    renderDetail(r.dir, r.convs, r.subs || []);
  }

  function closeSheet(){ $('sheetBack').classList.add('hide'); newFiles = []; }
  $('sheetBack').addEventListener('click', e => { if (e.target === $('sheetBack')) closeSheet(); });

  function renderDetail(d, convs, subs){
    LASTD = d;
    LASTS = subs || [];
    const me = DATA.me;
    const isAssignee = d.who.indexOf(me.name) >= 0;
    const openStatus = isOpen(d.status);

    let h = '<div class="grip"></div>'
      + '<div class="sheet-head"><h2>' + esc(d.title) + '</h2><button class="close" onclick="closeSheet()">닫기</button></div>'
      + '<div class="sheet-meta"><b>' + esc(d.owner) + '</b>' + (d.by ? ' <span class="proxy">' + esc(d.by) + ' 대리</span>' : '')
      + ' ' + (d.kind === '요청' ? '요청 · 받는 사람' : '지시 · 담당') + ' <b>' + esc(d.who.join(', ')) + '</b>'
      + (d.dueKo ? ' · 기한 <b>' + esc(d.dueKo) + '</b> ' + (openStatus ? '<span class="pill ' + (d.dday <= 1 ? 'late' : 'wait') + '">' + d.ddayLabel + '</span>' : '') : '')
      + ' · ' + esc(d.pri) + (d.type === 'KPI' ? ' · <b>KPI</b>' : '') + '</div>'
      + (d.detail ? '<div class="detail-body">' + esc(d.detail) + '</div>' : '');

    // 컨펌 줄 · 전달 줄 — 대표·관리자는 컨펌/반려, 담당은 보고 취소, 자기 업무는 대표님께 전달
    h += actionBarHtml(d, convs);

    // 마일스톤 — 어느 단계까지 왔고 어디서 밀렸는지
    h += subCardHtml(d, LASTS);

    // 스레드
    h += '<div class="thread">';
    if (!convs.length) h += '<div class="empty">아직 답변이 없습니다</div>';
    convs.forEach(c => {
      h += '<div class="msg"><div class="m-head"><b>' + esc(c.author) + '</b>'
        + typePill(c) + '<time>' + c.ts.slice(5, 16) + '</time></div>';
      if (c.type === '미팅 요청') {
        h += '<div class="tagline">미팅 요청' + (c.when ? ' · ' + esc(c.when) : '') + '</div>';
        if (c.body) h += '<div class="m-body">' + esc(c.body) + '</div>';
        if (!c.handled && me.manage) {
          // 구버전(일시 포함) 요청은 바로 확정, 새 요청은 일정 옵션 2개 제안
          if (c.when) h += '<div class="act"><button class="btn-mini" onclick="confirmMeet(' + c.id + ',' + d.id + ')">미팅 확정 (캘린더 초대)</button></div>';
          else h += '<div class="act"><button class="btn-mini" onclick="proposeMeet(' + c.id + ')">일정 제안하기 (옵션 2개)</button></div>';
        }
        if (!c.handled && !me.manage) h += '<div class="hint">대표님이 일정 옵션 2개를 제안하면 선택할 수 있습니다</div>';
        if (c.handled) h += '<div class="m-body" style="color:var(--ok);font-weight:600;font-size:13px">' + (c.handled === '제안됨' ? '일정 제안됨 — 아래에서 선택 대기' : '확정됨') + '</div>';
      } else if (c.type === '미팅 제안') {
        h += '<div class="tagline">미팅 일정 제안 · 하나를 선택해 주세요</div>'
          + '<div class="optline"><span class="tag">옵션 1</span>' + esc(c.when) + '</div>'
          + '<div class="optline"><span class="tag">옵션 2</span>' + esc(c.when2) + '</div>';
        if (c.body) h += '<div class="m-body">' + esc(c.body) + '</div>';
        if (!c.handled && c.author !== me.name)
          h += '<div class="act"><button class="btn-mini" onclick="chooseMeet(' + c.id + ',' + d.id + ',1)">옵션 1 선택</button>'
            + '<button class="btn-mini" onclick="chooseMeet(' + c.id + ',' + d.id + ',2)">옵션 2 선택</button></div>';
        if (!c.handled && c.author === me.name) h += '<div class="hint">상대방이 옵션을 선택하면 캘린더 초대가 발송됩니다</div>';
        if (c.handled) h += '<div class="m-body" style="color:var(--ok);font-weight:600;font-size:13px">확정됨</div>';
      } else if (c.type === '기한 조정') {
        h += '<div class="tagline">기한 조정 요청 · ' + esc(c.when) + '</div>';
        if (c.body) h += '<div class="m-body">' + esc(c.body) + '</div>';
        if (!c.handled && me.manage) h += '<div class="act"><button class="btn-mini" onclick="approveDue(' + c.id + ',' + d.id + ')">기한 변경 승인</button></div>';
        if (c.handled) h += '<div class="m-body" style="color:var(--ok);font-weight:600;font-size:13px">반영됨</div>';
      } else {
        if (c.body) h += '<div class="m-body">' + esc(c.body) + '</div>';
        if (c.files && c.files.length) h += '<div class="files">' + c.files.map(f =>
          '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">&#128206; ' + esc(f.name) + '</a>').join('') + '</div>';
        // 완료 보고의 처리 상태 — 컨펌/반려/철회/보류됨이 handled 칸에 남는다 (기한 승인 관행)
        if (c.type === '완료 보고' && c.handled)
          h += '<div class="m-body" style="color:var(--sub);font-weight:600;font-size:13px">'
            + esc(c.handled === '보류됨' ? c.handled : c.handled + '됨') + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';

    // 입력 영역
    if (isAssignee && openStatus) h += replyFormHtml(d);
    else if (openStatus || me.manage) h += commentFormHtml(d);
    if (isAssignee && openStatus && !me.manage) h += dueReqHtml(d);
    if (me.manage && openStatus) h += meetFormHtml(d);   // 대표도 미팅 제안 가능
    if (me.manage || isAssignee) h += ccFormHtml(d);     // 참조 공유 — 관련 직원에게 메일로만 전달
    if (me.manage || d.owner === me.name) h += manageBtnsHtml(d);

    $('sheetBody').innerHTML = h;
    bindDetail(d);
  }

  const typePill = c =>
    c.type === '답변' ? '<span class="pill done">답변</span>' :
    c.type === '코멘트' ? '<span class="pill gray">코멘트</span>' :
    c.type === '진행' ? '<span class="pill doing">진행</span>' :
    c.type === '완료 보고' ? '<span class="pill confirm">완료 보고</span>' :
    c.type === '전달' ? '<span class="pill doing">전달</span>' :
    '<span class="pill meet">' + c.type + '</span>';

  /* 컨펌 줄 (노션 판 결정 5) — 임원의 완료 보고에 대표가 답하는 자리.
     상태 확인은 서버가 잠금 안에서 다시 한다 — 여기 버튼은 낡았을 수 있는 화면일 뿐이다. */
  function actionBarHtml(d, convs){
    const me = DATA.me;
    if (d.status === '컨펌 대기') {
      if (me.manage) {
        return '<div class="card"><h3>완료 컨펌 <span style="font-weight:400">· 담당이 업무를 끝냈다고 보고했습니다</span></h3>'
          + '<input type="text" id="cfNote" placeholder="반려 사유 (반려할 때만, 선택)">'
          + '<div style="display:flex;gap:8px;margin-top:10px">'
          + '<button class="btn-primary" id="cfOk" style="margin-top:0;flex:1.4">완료 컨펌</button>'
          + '<button class="btn-quiet" id="cfNo" style="flex:1">반려 · 다시 진행</button></div></div>';
      }
      if (d.who.indexOf(me.name) >= 0) {
        return '<div class="card"><h3>컨펌 대기</h3>'
          + '<div class="hint">완료 보고를 올렸습니다 — 대표님 컨펌을 기다리는 중입니다.</div>'
          + '<button class="btn-quiet" id="cfCancel" style="margin-top:10px">보고 취소 · 다시 진행</button></div>';
      }
      return '';
    }
    /* 전달 줄 (옵션2 결정 6) — 임원 자기 업무는 마일스톤을 짠 뒤 대표님께 알린다.
       업무는 생성 즉시 보이지만, 전달이 「계획이 섰다」는 인지 시점의 기록이다. */
    const 자기업무 = !me.manage && d.owner === me.name && d.who.length === 1 && d.who[0] === me.name;
    if (자기업무 && (d.status === '시작 전' || d.status === '진행 중')) {
      const 전달됨 = (convs || []).some(c => c.type === '전달');
      return '<div class="card"><h3>대표님께 전달</h3>'
        + '<div class="hint">' + (전달됨
          ? '이미 전달했습니다. 계획이 크게 바뀌었으면 다시 전달할 수 있습니다.'
          : '마일스톤을 짠 뒤 전달하면 대표님께 메일이 갑니다. 전달 없이 완료 보고로 바로 가도 됩니다.') + '</div>'
        + '<input type="text" id="fwNote" placeholder="한 줄 메모 (선택)" style="margin-top:8px">'
        + '<button class="btn-quiet" id="fwSend" style="margin-top:10px">' + (전달됨 ? '다시 전달' : '대표님께 전달') + '</button></div>';
    }
    return '';
  }

  /* 세부업무 카드 — 상태(완료/지연/진행중)는 서버가 파생해 준다(세부상태_). 여기서 다시 세지 않는다.
     ⚠ 접힘/펼침을 만들지 않는다 — 쓰기 한 번마다 renderMain이 innerHTML을 통째로 다시 써서 초기화된다. */
  function subCardHtml(d, subs){
    const me = DATA.me;
    const 권한 = me.manage || d.owner === me.name || d.who.indexOf(me.name) >= 0;
    const 진행 = subProgress(subs);
    let h = '<div class="card"><h3>마일스톤' + (진행 ? ' ' + 진행 : '') + '</h3><div class="dlist">';
    if (!subs.length) h += '<div class="empty">아직 마일스톤이 없습니다</div>';
    subs.forEach(s => {
      const cls = s.status === '완료' ? 'done' : s.status === '지연' ? 'late' : 'wait';
      const 누구 = [s.who.join(', '), s.vendor].filter(Boolean).join(' · ');
      h += '<div class="ditem"><div class="txt"><b>' + esc(s.seq + '. ' + s.title) + '</b><span>'
        + esc((누구 || '담당 미지정') + (s.dueKo ? ' · 마감 ' + s.dueKo : '') + (s.doneKo ? ' · 완료 ' + s.doneKo : ''))
        + '</span></div><div class="side"><span class="pill ' + cls + '">' + esc(s.status) + '</span>'
        + (s.status === '완료' || s.dday == null ? ''
          : '<i class="dday' + (s.dday < 0 ? ' over' : s.dday <= 1 ? ' near' : '') + '">' + esc(s.ddayLabel) + '</i>')
        + '</div></div>';
      // 기한은 임원 재량이다 — 승인 버튼이 없다 (결정 6 앞단). 바꾸면 알림과 이력만 남는다
      if (권한) h += '<div class="sub-act">'
        + '<button class="btn-mini" data-sdone="' + s.id + '" data-v="' + (s.status === '완료' ? '0' : '1') + '">'
        + (s.status === '완료' ? '완료 취소' : '완료') + '</button>'
        + '<input type="date" data-sstart="' + s.id + '" value="' + esc(s.start || '') + '" aria-label="시작일">'
        + '<input type="date" data-sdue="' + s.id + '" value="' + esc(s.due || '') + '" aria-label="마감일">'
        + '<button class="btn-mini danger" data-sdel="' + s.id + '">삭제</button></div>';
    });
    h += '</div>';
    if (권한) h += '<div class="row-label">마일스톤 추가</div>'
      + '<div class="sub-new"><input type="text" id="nsTitle" placeholder="마일스톤 (예: 견적 수령)">'
      + '<input type="text" id="nsWho" placeholder="담당 (내부)">'
      + '<input type="text" id="nsVendor" placeholder="담당 (외부)">'
      // 시작일이 있어야 간트에 막대가 그려진다 — 마감일만 있으면 그날 마름모 하나로 찍힌다
      + '<input type="date" id="nsStart" aria-label="시작일">'
      + '<input type="date" id="nsDue" aria-label="마감일"></div>'
      + '<button class="btn-quiet" id="nsAdd" style="margin-top:10px">추가</button>'
      + '<div class="hint">왼쪽이 시작일, 오른쪽이 마감일입니다. 둘 다 넣으면 일정 막대로 보입니다.<br>'
      + '마일스톤 담당은 이름표입니다 — 적힌 사람에게 이 업무가 보이지는 않습니다.</div>';
    return h + '</div>';
  }

  /** 진행률 배지 — 완료/전체, 지연이 있으면 그 수까지. 목록 줄에도 같은 숫자가 나간다 */
  function subProgress(subs){
    if (!subs || !subs.length) return '';
    const done = subs.filter(s => s.status === '완료').length;
    const late = subs.filter(s => s.status === '지연').length;
    return '<span class="pill ' + (late ? 'late' : done === subs.length ? 'done' : 'gray') + '">'
      + done + '/' + subs.length + (late ? ' · 지연 ' + late : '') + '</span>';
  }

  /* 상위 기한 변경 요청 — 답변 폼 안에도 같은 길이 있지만 **본문이 있어야만** 보낼 수 있어서
     실사용 0건이었다. 여기가 단독 진입점이다. 대표님이 승인해야 바뀐다 (결정 6 뒷단). */
  function dueReqHtml(d){
    return '<div class="card"><h3>기한 변경 요청 <span style="font-weight:400">· 대표님 승인이 필요합니다</span></h3>'
      + '<input type="date" id="drDue" value="' + esc(d.due || '') + '">'
      + '<input type="text" id="drNote" placeholder="사유 (선택)" style="margin-top:8px">'
      + '<button class="btn-quiet" id="drSend" style="margin-top:10px">승인 요청 보내기</button></div>';
  }

  function replyFormHtml(d){
    /* 기록 세그 2종 (노션 판): '진행' = 수시 보고 — 기한 조정·미팅 요청을 함께 낼 수 있다.
       '완료 보고' = 끝맺음 → 컨펌 대기. 옛 '답변'은 은퇴했다 (서버 웹_답변등록은 호환으로 남는다).
       컨펌 대기 중에는 진행 기록만 남길 수 있다 — 보고를 겹쳐 올릴 자리가 없다. */
    const 보고가능 = d.status !== '컨펌 대기';
    return '<div class="card"><h3>기록 남기기</h3>'
      + (보고가능
        ? '<div class="seg" id="rKind"><button class="on" data-v="진행">진행</button>'
          + '<button data-v="완료 보고">완료 보고</button></div>'
        : '')
      + '<textarea id="rBody" placeholder="진행 상황을 입력하세요" rows="3" style="margin-top:10px"></textarea>'
      + '<div class="row-label">첨부 자료</div>'
      + '<div class="chips" id="rFiles"><button class="chip" id="rAddFile">+ 파일 추가</button></div>'
      + '<input type="file" id="rFileInput" multiple class="hide">'
      + '<div id="rExtra">'
      + '<div class="row-label">기한 회신</div>'
      + '<div class="seg" id="rDueSeg"><button class="on" data-v="ok">기한 내 가능</button><button data-v="change">조정 요청</button></div>'
      + '<div id="rDueBox" class="hide"><input type="date" id="rDueDate" style="margin-top:8px">'
      + '<input type="text" id="rDueNote" placeholder="조정 사유 (선택)" style="margin-top:8px"></div>'
      + (DATA.me.manage ? ''
        : '<div class="row-label">미팅</div>'
        + '<div class="seg" id="rMeetSeg"><button class="on" data-v="">필요 없음</button><button data-v="meet">미팅 요청</button></div>'
        + '<div id="rMeetBox" class="hide"><input type="text" id="rMeetNote" placeholder="논의할 내용 (선택)" style="margin-top:8px">'
        + '<div class="hint">일정은 대표님이 옵션 2개를 제안하면 그중에서 선택하게 됩니다</div></div>')
      + '</div>'
      + '<button class="btn-primary" id="rSend">진행 기록 남기기</button></div>';
  }

  // 미팅 일정 제안 (대표/관리자) — 옵션 2개 중 상대방이 선택
  function meetFormHtml(d){
    return '<div class="card" id="meetCard"><h3>미팅 제안 <span style="font-weight:400">· 일정 옵션 2개 중 상대방이 선택</span></h3>'
      + '<div class="row-label">옵션 1</div>' + dtPickHtml('mOpt1')
      + '<div class="row-label">옵션 2</div>' + dtPickHtml('mOpt2')
      + '<input type="text" id="mNote" placeholder="논의할 내용 (선택)" style="margin-top:12px">'
      + '<button class="btn-quiet" id="mSend" style="margin-top:12px">미팅 제안 보내기</button></div>';
  }

  // 참조 공유 — 플랫폼 계정이 없는 관련 직원에게 지시 내용·대표님 코멘트를 메일로만 전달
  function ccFormHtml(d){
    return '<div class="card"><h3>참조 공유 <span style="font-weight:400">· 관련 직원에게 메일로만 전달</span></h3>'
      + '<div class="chips" id="ccChips"></div>'
      + '<input type="text" id="ccInput" placeholder="직원 이메일 (예: hong@bazbiomedic.com)" inputmode="email" autocomplete="off" style="margin-top:8px">'
      + '<button class="btn-quiet" id="ccAdd" style="margin-top:8px">참조 추가</button>'
      + '<div class="hint">등록한 주소로 지시 내용과 대표님 코멘트가 메일로 공유됩니다. '
      + '플랫폼 접속 권한은 생기지 않으며, 임원 답변은 공유되지 않습니다.</div>'
      + '</div>';
  }

  function renderCcChips(d){
    const box = $('ccChips');
    if (!box) return;
    box.innerHTML = (d.cc || []).map(e =>
      '<span class="file-chip"><span>' + esc(e) + '</span><button class="x" data-e="' + esc(e) + '">&times;</button></span>').join('')
      || '<span class="empty" style="padding:4px 0">아직 참조가 없습니다</span>';
    box.querySelectorAll('.x').forEach(btn => btn.addEventListener('click', () => saveCc(d, (d.cc || []).filter(e => e !== btn.dataset.e))));
  }

  async function saveCc(d, emails){
    busy(true, '참조 저장 중...');
    try {
      const r = await gs('웹_참조설정', TOKEN, { id: d.id, emails });
      const grew = r.cc.length > (d.cc || []).length;
      d.cc = r.cc;
      renderCcChips(d);
      toast(grew ? '참조가 추가되었습니다. 지시 내용이 메일로 공유됩니다.' : '참조가 해제되었습니다.');
    } catch (e) { toast(e.message); }
    busy(false);
  }

  function commentFormHtml(d){
    return '<div class="card"><h3>코멘트</h3>'
      + '<textarea id="cBody" placeholder="코멘트를 입력하세요" rows="2"></textarea>'
      + '<button class="btn-primary" id="cSend">코멘트 남기기</button></div>';
  }

  function manageBtnsHtml(d){
    let b = '<div class="card"><h3>지시 관리</h3><div class="chips">';
    /* 노션 판(2026-08-30): 「임원 자기 완료」는 뒤집혔다 — 임원은 완료 보고(기록 폼)만 남고,
       직접 완료·보류는 대표·관리자 전용이다. 서버(웹_상태변경)와 같은 조건이어야 한다. */
    if (DATA.me.manage) {
      if (d.status !== '완료') b += '<button class="chip" onclick="setStatus(' + d.id + ',\'완료\')">완료 처리</button>';
      if (d.status !== '보류' && d.status !== '완료') b += '<button class="chip" onclick="setStatus(' + d.id + ',\'보류\')">보류</button>';
      if (d.status === '완료' || d.status === '보류') b += '<button class="chip" onclick="setStatus(' + d.id + ',\'진행 중\')">다시 진행</button>';
    }
    b += '<button class="chip" onclick="editDir()">수정</button>';
    if (DATA.me.manage) b += '<button class="chip" onclick="followUp()">후속 지시</button>';
    b += '<button class="chip danger" onclick="delDir(' + d.id + ', this)">삭제</button>';
    return b + '</div></div>';
  }

  // ── 지시 수정 ──
  window.editDir = () => {
    const d = LASTD;
    if (!d) return;
    let h = '<div class="grip"></div>'
      + '<div class="sheet-head"><h2>지시 수정</h2><button class="close" onclick="closeSheet()">닫기</button></div>'
      + '<div class="card">'
      + '<div class="row-label">제목</div><textarea id="eTitle" rows="2">' + esc(d.title) + '</textarea>'
      + '<div class="row-label">상세 설명</div><textarea id="eDetail" rows="3">' + esc(d.detail || '') + '</textarea>'
      + '<div class="row-label">기한</div><input type="date" id="eDue" value="' + esc(d.due || '') + '">'
      + '<div class="row-label">중요도</div><div class="seg" id="ePri">'
      + PRIS.map(p => '<button class="' + (d.pri === p ? 'on' : '') + '">' + p + '</button>').join('')
      + '</div>'
      + '<button class="btn-primary" id="eSave">저장</button>'
      + '<button class="btn-quiet" id="eCancel" style="margin-top:10px">취소</button>'
      + '</div>';
    $('sheetBody').innerHTML = h;
    segInit('ePri');
    $('eCancel').addEventListener('click', () => openDetail(d.id));
    $('eSave').addEventListener('click', async () => {
      const title = $('eTitle').value.trim();
      if (!title) { toast('제목을 입력해 주세요'); return; }
      busy(true, '저장 중...');
      try {
        const r = await gs('웹_지시수정', TOKEN, {
          id: d.id, title, detail: $('eDetail').value.trim(),
          due: $('eDue').value, pri: segVal('ePri'),
        });
        toast(r.changed ? '수정되었습니다. 담당자에게 알림이 갑니다.' : '변경된 내용이 없습니다');
        await reopen(d.id);
      } catch (e) { toast(e.message); }
      busy(false);
    });
  };

  // ── 지시 삭제 (두 번 눌러 확인) ──
  window.delDir = async (id, btn) => {
    if (!btn.dataset.arm) {
      btn.dataset.arm = '1';
      btn.textContent = '한 번 더 누르면 삭제';
      setTimeout(() => { btn.dataset.arm = ''; btn.textContent = '삭제'; }, 4000);
      return;
    }
    busy(true, '삭제 중...');
    try {
      await gs('웹_지시삭제', TOKEN, id);
      toast('지시가 삭제되었습니다');
      closeSheet();
      await refresh();
    } catch (e) { toast(e.message); }
    busy(false);
  };

  // ── 후속 지시 (내용·담당 미리 채움) ──
  window.followUp = () => {
    const d = LASTD;
    if (!d) return;
    closeSheet();
    $('mainTabs').querySelector('[data-tab=new]').click();
    $('newTitle').value = '[후속] ' + d.title;
    $('newDetail').value = '';
    $('newWho').querySelectorAll('.chip').forEach(c =>
      c.classList.toggle('on', d.who.indexOf(c.dataset.name) >= 0));
    window.scrollTo({ top: 0 });
    $('newTitle').focus();
  };

  let MEET_NEED = null;   // '일정 제안하기'로 응답 중인 미팅 요청 대화 ID

  function bindDetail(d){
    newFiles = [];
    MEET_NEED = null;
    const add = $('rAddFile');
    if (add) {
      // '진행'은 기한 회신·미팅 요청을 타지 않는다 — 그 칸들을 접고 버튼 이름만 바꾼다
      if ($('rKind')) segInit('rKind', btn => {
        const 보고 = btn.dataset.v === '완료 보고';
        // 기한 조정·미팅 요청은 진행 기록의 부속이다 — 완료 보고에는 접는다
        $('rExtra').classList.toggle('hide', 보고);
        $('rBody').placeholder = 보고 ? '완료 내용을 입력하세요 — 대표님 컨펌 대기가 됩니다' : '진행 상황을 입력하세요';
        $('rSend').textContent = 보고 ? '완료 보고 올리기' : '진행 기록 남기기';
      });
      segInit('rDueSeg', btn => $('rDueBox').classList.toggle('hide', btn.dataset.v !== 'change'));
      if ($('rMeetSeg')) segInit('rMeetSeg', btn => $('rMeetBox').classList.toggle('hide', btn.dataset.v !== 'meet'));
      add.addEventListener('click', () => $('rFileInput').click());
      $('rFileInput').addEventListener('change', async e => {
        for (const f of e.target.files) {
          if (f.size > 20 * 1024 * 1024) { toast(f.name + ' — 20MB 이하만 업로드할 수 있습니다'); continue; }
          const data = await fileToB64(f);
          newFiles.push({ name: f.name, mime: f.type, data });
        }
        e.target.value = '';
        renderFileChips();
      });
      $('rSend').addEventListener('click', () => sendReply(d));
    }
    // 컨펌 줄 — 대표·관리자의 컨펌/반려, 담당의 보고 취소
    const cfOk = $('cfOk');
    if (cfOk) {
      const 답 = async ok => {
        const note = $('cfNote') ? $('cfNote').value.trim() : '';
        busy(true, ok ? '컨펌 중...' : '반려 중...');
        try {
          await gs('웹_컨펌', TOKEN, { id: d.id, ok: ok, note: note });
          toast(ok ? '완료로 처리했습니다' : '반려했습니다 — 진행 중으로 돌아갑니다');
          await reopen(d.id);
        } catch (e) { toast(e.message); }
        busy(false);
      };
      cfOk.addEventListener('click', () => 답(true));
      $('cfNo').addEventListener('click', () => 답(false));
    }
    const cfCancel = $('cfCancel');
    if (cfCancel) cfCancel.addEventListener('click', async () => {
      busy(true, '취소 중...');
      try {
        await gs('웹_보고취소', TOKEN, { id: d.id });
        toast('보고를 취소했습니다 — 진행 중으로 돌아갑니다.');
        await reopen(d.id);
      } catch (e) { toast(e.message); }
      busy(false);
    });
    const fwSend = $('fwSend');
    if (fwSend) fwSend.addEventListener('click', async () => {
      busy(true, '전달 중...');
      try {
        await gs('웹_전달', TOKEN, { id: d.id, note: $('fwNote').value.trim() });
        toast('대표님께 전달했습니다.');
        await reopen(d.id);
      } catch (e) { toast(e.message); }
      busy(false);
    });
    const cSend = $('cSend');
    if (cSend) cSend.addEventListener('click', async () => {
      const body = $('cBody').value.trim();
      if (!body) { toast('내용을 입력해 주세요'); return; }
      busy(true, '저장 중...');
      try { await gs('웹_코멘트등록', TOKEN, { id: d.id, body }); toast('코멘트가 등록되었습니다'); await reopen(d.id); }
      catch (e) { toast(e.message); }
      busy(false);
    });
    /* 세부업무 — 완료 체크 · 기한 즉시 변경(승인 없음) · 삭제 · 한 줄 추가.
       #sheetBody로 좁힌다 — 뒤에 있는 목록에도 같은 속성이 있으면 중복 바인딩된다 */
    document.querySelectorAll('#sheetBody [data-sdone]').forEach(btn => btn.addEventListener('click', async () => {
      busy(true, '저장 중...');
      try { await gs('웹_세부완료', TOKEN, { id: Number(btn.dataset.sdone), done: btn.dataset.v === '1' }); await reopen(d.id); }
      catch (e) { toast(e.message); }
      busy(false);
    }));
    /* 시작일은 기한이 아니다 — 승인도 알림 문구도 기한 쪽과 다르다.
       서버(세부수정_)가 시작일 변경은 '기한 변경'이 아닌 '코멘트'로 남긴다 */
    document.querySelectorAll('#sheetBody [data-sstart]').forEach(inp => inp.addEventListener('change', async () => {
      busy(true, '저장 중...');
      try {
        await gs('웹_세부수정', TOKEN, { id: Number(inp.dataset.sstart), start: inp.value });
        await reopen(d.id);
      } catch (e) { toast(e.message); }
      busy(false);
    }));
    document.querySelectorAll('#sheetBody [data-sdue]').forEach(inp => inp.addEventListener('change', async () => {
      busy(true, '기한 변경 중...');
      try {
        await gs('웹_세부수정', TOKEN, { id: Number(inp.dataset.sdue), due: inp.value });
        toast('마일스톤 기한을 바꿨습니다. 담당자에게 알림이 갑니다.');
        await reopen(d.id);
      } catch (e) { toast(e.message); }
      busy(false);
    }));
    document.querySelectorAll('#sheetBody [data-sdel]').forEach(btn => btn.addEventListener('click', async () => {
      busy(true, '삭제 중...');
      try { await gs('웹_세부삭제', TOKEN, Number(btn.dataset.sdel)); await reopen(d.id); }
      catch (e) { toast(e.message); }
      busy(false);
    }));
    const nsAdd = $('nsAdd');
    if (nsAdd) nsAdd.addEventListener('click', async () => {
      const title = $('nsTitle').value.trim();
      if (!title) { toast('마일스톤을 입력해 주세요'); return; }
      busy(true, '추가 중...');
      try {
        await gs('웹_세부등록', TOKEN, { dirId: d.id, items: [{
          title, who: $('nsWho').value.trim(), vendor: $('nsVendor').value.trim(),
          start: $('nsStart').value, due: $('nsDue').value,
        }] });
        await reopen(d.id);
      } catch (e) { toast(e.message); }
      busy(false);
    });
    const drSend = $('drSend');
    if (drSend) drSend.addEventListener('click', async () => {
      if (!$('drDue').value) { toast('바꿀 기한을 골라 주세요'); return; }
      busy(true, '요청 전송 중...');
      try {
        await gs('웹_기한요청', TOKEN, { id: d.id, due: $('drDue').value, note: $('drNote').value.trim() });
        toast('기한 변경 승인 요청을 보냈습니다.');
        await reopen(d.id);
      } catch (e) { toast(e.message); }
      busy(false);
    });
    // 참조 공유 — 칩 렌더 + 추가 버튼
    if ($('ccChips')) {
      renderCcChips(d);
      const addCc = () => {
        const v = $('ccInput').value.trim().toLowerCase();
        if (!v) { toast('이메일을 입력해 주세요'); return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast('이메일 형식이 올바르지 않습니다'); return; }
        if ((d.cc || []).indexOf(v) >= 0) { toast('이미 등록된 주소입니다'); return; }
        $('ccInput').value = '';
        saveCc(d, (d.cc || []).concat(v));
      };
      $('ccAdd').addEventListener('click', addCc);
      $('ccInput').addEventListener('keydown', e => { if (e.key === 'Enter') addCc(); });
    }
    const mSend = $('mSend');
    if (mSend) {
      mSend.addEventListener('click', async () => {
        const opt1 = dtPickVal('mOpt1'), opt2 = dtPickVal('mOpt2');
        if (!opt1 || !opt2) { toast('일정 옵션 2개를 모두 선택해 주세요'); return; }
        if (opt1 === opt2) { toast('두 옵션이 같은 시각입니다'); return; }
        busy(true, '미팅 제안 전송 중...');
        try {
          await gs('웹_미팅제안', TOKEN, { id: d.id, opt1, opt2, note: $('mNote').value.trim(), needId: MEET_NEED });
          toast('미팅 제안이 전송되었습니다. 상대방이 옵션을 선택하면 확정됩니다.');
          await reopen(d.id);
        } catch (e) { toast(e.message); }
        busy(false);
      });
    }
  }

  function renderFileChips(){
    const box = $('rFiles');
    box.querySelectorAll('.file-chip').forEach(el => el.remove());
    newFiles.forEach((f, i) => {
      const el = document.createElement('span');
      el.className = 'file-chip';
      el.innerHTML = '<span>' + esc(f.name) + '</span><button class="x" data-i="' + i + '">&times;</button>';
      el.querySelector('.x').addEventListener('click', () => { newFiles.splice(i, 1); renderFileChips(); });
      $('rAddFile').before(el);
    });
  }

  const fileToB64 = f => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(f);
  });

  async function sendReply(d){
    const body = $('rBody').value.trim();
    const 보고 = $('rKind') && segVal('rKind') === '완료 보고';
    if (보고) {
      busy(true, newFiles.length ? '파일 업로드 중...' : '보고 전송 중...');
      try {
        await gs('웹_완료보고', TOKEN, { id: d.id, body, files: newFiles });
        toast('완료 보고를 올렸습니다 — 대표님 컨펌 대기가 됩니다.');
        await reopen(d.id);
      } catch (e) { toast(e.message); }
      busy(false);
      return;
    }
    if (!body && !newFiles.length) { toast('진행 내용을 입력해 주세요'); return; }
    const f = { id: d.id, body, files: newFiles };
    if (segVal('rDueSeg') === 'change') {
      if (!$('rDueDate').value) { toast('조정할 기한을 선택해 주세요'); return; }
      f.dueProposed = $('rDueDate').value; f.dueNote = $('rDueNote').value.trim();
    }
    if ($('rMeetSeg') && segVal('rMeetSeg') === 'meet') {
      f.meetNeed = true; f.meetNote = $('rMeetNote').value.trim();
    }
    busy(true, newFiles.length ? '파일 업로드 중...' : '기록 중...');
    try {
      await gs('웹_진행등록', TOKEN, f);
      toast('진행 기록을 남겼습니다.');
      await reopen(d.id);
    } catch (e) { toast(e.message); }
    busy(false);
  }

  async function reopen(id){ await refresh(); openDetail(id); }

  window.closeSheet = closeSheet;
  window.setStatus = async (id, status) => {
    busy(true, '변경 중...');
    try { await gs('웹_상태변경', TOKEN, { id, status }); toast('상태가 변경되었습니다'); await reopen(id); }
    catch (e) { toast(e.message); }
    busy(false);
  };
  window.confirmMeet = async (convId, dirId) => {
    busy(true, '캘린더 등록 중...');
    try { const r = await gs('웹_미팅확정', TOKEN, convId); toast('미팅 확정 · ' + r.when + ' 초대가 발송되었습니다'); await reopen(dirId); }
    catch (e) { toast(e.message); }
    busy(false);
  };
  // 미팅 요청에 '일정 제안하기' — 아래 미팅 제안 카드로 이동
  window.proposeMeet = (needId) => {
    MEET_NEED = needId;
    const card = $('meetCard');
    if (!card) { toast('미팅 제안 카드를 찾을 수 없습니다'); return; }
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.style.outline = '2px solid var(--accent)';
    setTimeout(() => { card.style.outline = ''; }, 1600);
    const o1 = $('mOpt1D');
    if (o1) o1.focus();
  };
  // 제안받은 옵션 선택 → 미팅 확정
  window.chooseMeet = async (convId, dirId, choice) => {
    busy(true, '미팅 확정 중...');
    try { const r = await gs('웹_미팅선택', TOKEN, convId, choice); toast('미팅 확정 · ' + r.when + ' 캘린더 초대가 발송되었습니다'); await reopen(dirId); }
    catch (e) { toast(e.message); }
    busy(false);
  };
  window.approveDue = async (convId, dirId) => {
    busy(true, '반영 중...');
    try { await gs('웹_기한승인', TOKEN, convId); toast('기한이 변경되었습니다'); await reopen(dirId); }
    catch (e) { toast(e.message); }
    busy(false);
  };

  // ── 시작 ──
  if (TOKEN) init(); else show('vLogin');
</script>
</body>
</html>
