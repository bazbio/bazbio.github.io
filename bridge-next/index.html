<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- PWA 머리 (ADR 0008) — 예전에는 셸(iframe 바깥)이 들고 있었다. 화면이 Pages로 오면서
     셸이 없어졌으므로 여기가 곧 홈 화면 앱의 머리다.
     ⚠ viewport는 GAS doGet이 addMetaTag로 붙여 주던 것이다. Pages에는 붙여 줄 사람이
     없으니 여기 있어야 한다 — 빠지면 휴대폰에서 화면이 데스크톱 폭으로 뜬다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>브리지</title>
<meta name="theme-color" content="#0075de">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="브리지">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- Pretendard — Inter 메트릭 호환 한글 폰트 (노션 판, 2026-08-30). 오프라인·차단 시
     아래 폰트 스택의 Apple SD Gothic Neo가 그대로 받는다 — 이 링크가 죽어도 화면은 안 죽는다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    /* 노션 팔레트 (2026-08-30) — 웜 페이퍼 캔버스 + 흰 카드 + 헤어라인.
       구조 액센트는 --accent 하나뿐이다. 스티커 팔레트(--stk-*)는 장식·상태 점 전용 —
       버튼·레이아웃 채움에 쓰지 않는다. */
    --bg:#f6f5f4; --card:#FFFFFF; --ink:#0d0d0c; --ink2:#31302e; --sub:#615d59; --faint:#a39e98;
    --line:#e6e6e6; --field:#f1efed;
    --accent:#0075de; --accent-press:#005bab; --accent-ink:#FFFFFF;
    /* CTA 채움은 양 테마 공통 — 다크의 밝은 --accent 위 흰 글자는 4.5:1이 안 나온다 */
    --cta:#0075de;
    --ok:#1aae39; --warn:#dd5b00; --bad:#e03e3e;
    /* barely-there 레이어드 섀도 — 카드는 헤어라인 보더가 주 경계다 */
    --shadow:0 0 0 1px rgba(0,0,0,.02), 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.03);
    --stk-sky:#62aef0; --stk-purple:#d6b6f6; --stk-pink:#ff64c8;
    --stk-orange:#dd5b00; --stk-teal:#2a9d99; --stk-green:#1aae39;
    /* 라운드 사다리 — 입력 4 · 행 5 · 유틸 8 · 카드 12 · 대형 16 · CTA 필 */
    --r-in:4px; --r-row:5px; --r-btn:8px; --r-card:12px; --r-lg:16px; --r-pill:9999px;
    /* 간트 막대 색 — 막대·마름모·범례가 이 다섯만 본다 (따로 적으면 언젠가 서로 달라진다).
       --ok·--bad를 그대로 채우면 흰 카드 위에서 도형 기준(3:1)이 안 나와 밝기만 낮춰 파생.
       컨펌 대기(--gt-confirm)는 노션 퍼플 계열 솔리드 — 스티커 퍼플은 1.6:1이라 도형 불가. */
    --gt-wait:var(--accent);
    --gt-confirm:#9065b0;
    --gt-done:color-mix(in srgb, var(--ok) 72%, #000);
    --gt-late:color-mix(in srgb, var(--bad) 82%, #000);
    --gt-hold:var(--sub);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191918; --card:#232322; --ink:#eeedeb; --ink2:#c9c6c1; --sub:#a5a19b; --faint:#75716b;
      --line:rgba(255,255,255,.10); --field:#2c2b2a;
      --accent:#4c9ff0; --accent-press:#82bdf5;
      --ok:#3fbf5c; --warn:#f2915c; --bad:#ff7369;
      --shadow:0 0 0 1px rgba(255,255,255,.04);
      --gt-confirm:#b18ad2;
      --gt-done:var(--ok);
      --gt-late:var(--bad);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",sans-serif;
    font-size:16px; line-height:1.5; min-height:100vh;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  input,textarea,select{font:inherit; color:var(--ink)}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

  .hide{display:none !important}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px 90px}

  /* 상단 바 */
  .topbar{
    position:sticky; top:0; z-index:20;
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    background:color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:720px; margin:0 auto; padding:0 16px; height:52px; display:flex; align-items:center; justify-content:space-between}
  .brand{font-weight:700; font-size:17px; letter-spacing:-.01em}
  .brand small{font-weight:500; font-size:12px; color:var(--sub); margin-left:7px}
  .topbar .who{font-size:13px; color:var(--sub); display:flex; align-items:center; gap:10px}
  .topbar .who button{color:var(--accent); font-size:13px; font-weight:600}

  .page-head{display:flex; align-items:baseline; justify-content:space-between; padding:22px 2px 4px}
  .page-head h1{margin:0; font-size:28px; font-weight:700; letter-spacing:-.03em}
  .page-head time{font-size:13px; color:var(--sub); font-weight:500}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:16px; box-shadow:var(--shadow); margin-top:14px}
  .card h3{margin:0 0 12px; font-size:13px; font-weight:600; color:var(--sub); letter-spacing:.02em}

  textarea,input[type=date],input[type=datetime-local],input[type=text],input[type=tel],input[type=number],input[type=password]{
    width:100%; border:0; background:var(--field); border-radius:var(--r-in);
    padding:12px 14px; font-size:15px;
  }
  textarea{resize:none; min-height:64px}
  ::placeholder{color:var(--sub); opacity:1}

  .row-label{font-size:12px; font-weight:600; color:var(--sub); margin:12px 0 6px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    padding:7px 14px; border-radius:999px; background:var(--field);
    font-size:13px; font-weight:600; transition:background .15s,color .15s;
  }
  .chip.on{background:var(--cta); color:var(--accent-ink)}

  .seg{display:flex; background:var(--field); border-radius:var(--r-btn); padding:3px}
  .seg button{flex:1; padding:8px 0; border-radius:6px; font-size:13px; font-weight:600; color:var(--sub); transition:background .15s,color .15s}
  .seg button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.12)}

  /* 10분 단위 일시 선택: 날짜 + 시 + 분 */
  .dtrow{display:flex; gap:8px; margin-top:8px}
  .dtrow input[type=date]{flex:1.5; min-width:0}
  .dtrow select{flex:1; min-width:0; border:0; background:var(--field); border-radius:var(--r-in); padding:12px 8px; font-size:15px; text-align:center}

  .btn-primary{
    background:var(--cta); color:var(--accent-ink); border-radius:999px;
    padding:14px 0; font-size:16px; font-weight:600; width:100%; margin-top:14px; transition:transform .15s;
  }
  .btn-primary:disabled{opacity:.5; cursor:default}
  .btn-quiet{background:var(--field); color:var(--accent); border-radius:999px; padding:11px 0; font-size:14px; font-weight:600; width:100%; transition:transform .15s}
  .btn-mini{background:var(--field); color:var(--accent); border-radius:999px; padding:6px 14px; font-size:12px; font-weight:700; transition:transform .15s}
  .btn-primary:active{background:var(--accent-press)}
  .btn-primary:active,.btn-quiet:active,.btn-mini:active,.chip:active{transform:scale(.95)}

  /* 통계 타일 */
  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:13px 14px; box-shadow:var(--shadow)}
  .tile .k{font-size:11px; font-weight:600; color:var(--sub)}
  .tile .v{font-size:25px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-top:2px}
  .tile.warn .v{color:var(--warn)} .tile.bad .v{color:var(--bad)} .tile.ok .v{color:var(--ok)}
  @media (max-width:480px){ .tiles{grid-template-columns:repeat(2,1fr)} }

  /* 검색 */
  .searchbar{margin-top:14px}
  .searchbar input{
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-btn);
  }

  /* 임원별 현황 — 카드 그리드 */
  .mgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  @media (min-width:700px){ .mgrid{grid-template-columns:repeat(3,1fr)} }
  .mcard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:13px 13px 12px;
    text-align:left; display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    transition:transform .15s, box-shadow .15s;
  }
  .mcard:hover{box-shadow:var(--shadow)}
  .mcard:active{transform:scale(.97)}
  .mcard b{font-size:15.5px; letter-spacing:-.01em}
  .mcard .mbar{width:100%; height:4px; border-radius:99px; background:var(--field); overflow:hidden}
  .mcard .mbar i{display:block; height:100%; border-radius:99px; background:var(--ok)}
  .mcard .mstats{display:flex; gap:5px; flex-wrap:wrap}
  .mcard .mstats span{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--field); color:var(--sub); white-space:nowrap}
  .mcard .mstats span.bad{color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, transparent)}
  .mcard .mstats span.ok{color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, transparent)}
  .mcard .mdue{font-size:11px; font-weight:600; color:var(--sub)}
  .mcard .mdue.soon{color:var(--warn)}
  .mcard .mdue.near{color:var(--bad)}
  .mcard.on{outline:2px solid var(--accent); outline-offset:-1px}

  .chip.danger{color:var(--bad)}

  /* 지시 목록 */
  .dlist{display:flex; flex-direction:column}
  .dgroup{display:flex; align-items:center; gap:8px; padding:16px 2px 5px; border-top:1px solid var(--line); margin-top:4px}
  .dgroup:first-child{border-top:0; margin-top:0; padding-top:4px}
  .dgroup b{font-size:13.5px}
  .dgroup .cnt{font-size:11.5px; color:var(--sub); margin-left:auto}
  .dgroup + .ditem{border-top:0}

  /* 부문 하이라이트 칩 */
  .dept{font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; flex:none; letter-spacing:.01em; white-space:nowrap;
    background:color-mix(in srgb, var(--accent) 11%, transparent); color:var(--accent)}
  .ditem{display:flex; align-items:center; gap:10px; padding:13px 2px; border-top:1px solid var(--line); width:100%; text-align:left}
  .ditem:first-child{border-top:0}
  .ditem .txt{flex:1; min-width:0}
  .ditem .txt b{display:block; font-size:15px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ditem .txt span{font-size:12px; color:var(--sub)}
  .ditem .side{display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:none}
  .dday{font-size:11px; font-weight:800; font-style:normal; color:var(--sub); letter-spacing:.02em}
  .dday.soon{color:var(--warn)}
  .dday.near,.dday.over{color:var(--bad)}
  .pill{font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap; flex:none}
  /* 상태 배지 — 틴트 배경 + 유색 글자. 글자 쪽은 4.5:1을 넘겨야 해서 틴트보다 어둡게 파생한다 */
  .pill.todo{color:var(--sub); background:var(--field)}
  .pill.doing{color:color-mix(in srgb, var(--accent) 80%, #000); background:color-mix(in srgb, var(--accent) 11%, transparent)}
  .pill.confirm{color:color-mix(in srgb, var(--gt-confirm) 82%, #000); background:color-mix(in srgb, var(--gt-confirm) 13%, transparent)}
  .pill.wait{color:color-mix(in srgb, var(--warn) 78%, #000); background:color-mix(in srgb, var(--warn) 14%, transparent)}
  .pill.done{color:color-mix(in srgb, var(--ok) 72%, #000); background:color-mix(in srgb, var(--ok) 14%, transparent)}
  .pill.late{color:color-mix(in srgb, var(--bad) 78%, #000); background:color-mix(in srgb, var(--bad) 12%, transparent)}
  .pill.meet{color:color-mix(in srgb, var(--accent) 80%, #000); background:color-mix(in srgb, var(--accent) 12%, transparent)}
  .pill.gray{color:var(--sub); background:var(--field)}
  @media (prefers-color-scheme: dark){
    .pill.doing{color:color-mix(in srgb, var(--accent) 72%, #fff)}
    .pill.confirm{color:color-mix(in srgb, var(--gt-confirm) 66%, #fff)}
    .pill.wait{color:color-mix(in srgb, var(--warn) 72%, #fff)}
    .pill.done{color:color-mix(in srgb, var(--ok) 70%, #fff)}
    .pill.late{color:color-mix(in srgb, var(--bad) 68%, #fff)}
    .pill.meet{color:color-mix(in srgb, var(--accent) 72%, #fff)}
  }
  .empty{padding:26px 0; text-align:center; font-size:14px; color:var(--sub)}
  .stuck-g{padding:10px 0 4px; font-size:12px; font-weight:700; color:var(--sub)}
  /* 세부업무 — 행 아래 붙는 조작 줄과 한 줄 추가 폼 */
  .sub-act{display:flex; align-items:center; gap:8px; padding:0 2px 10px; flex-wrap:wrap}
  .sub-act input[type=date]{flex:1; min-width:130px; margin:0}
  .sub-new{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .sub-new input{margin:0}
  .sub-new input:first-child{grid-column:1 / -1}

  /* 보고 일정 캘린더 */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .cal-head h3{margin:0}
  .cal-nav{display:flex; align-items:center; gap:2px}
  .cal-nav b{font-size:13px; min-width:88px; text-align:center; letter-spacing:-.01em}
  .cal-nav button{width:30px; height:30px; border-radius:8px; font-size:17px; color:var(--accent); font-weight:700}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
  .cal-w{font-size:10.5px; font-weight:700; color:var(--sub); text-align:center; padding:3px 0}
  .cal-w.sun{color:var(--bad)}
  .cal-d{min-height:56px; border-radius:9px; padding:3px 2px 4px; background:var(--field); display:flex; flex-direction:column; gap:2px; overflow:hidden}
  .cal-d.off{background:transparent; min-height:0}
  .cal-d .n{font-size:10.5px; font-weight:700; color:var(--sub); padding:1px 0 0 4px}
  .cal-d .n.sun{color:var(--bad)}
  .cal-d.today{outline:2px solid var(--accent); outline-offset:-2px}
  .cal-d.today .n{color:var(--accent)}
  .cal-i{display:block; width:100%; font-size:9.5px; font-weight:700; line-height:1.3; padding:2px 4px; border-radius:5px;
    text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--accent); background:color-mix(in srgb, var(--accent) 11%, transparent)}
  .cal-i.past{opacity:.55}
  .cal-i.done{opacity:.5; color:var(--sub); background:var(--field)}
  .cal-i.meet{color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, transparent)}
  .cal-more{font-size:9px; font-weight:700; color:var(--sub); padding-left:4px}

  /* ── 업무 일정 (간트) ──
     왼쪽 라벨은 제자리에 붙어 있고 날짜 칸만 가로로 흐른다. 하루 폭(--gt-dw)과 바의 위치는
     JS가 계산해 인라인으로 넣는다 — 그 둘 말고는 인라인 스타일을 쓰지 않는다. */
  .gt-wrap{overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; margin:0 -16px}
  .gt{min-width:max-content; --gt-dw:34px}
  .gt-row{display:flex; align-items:stretch; border-top:1px solid var(--line); width:100%; text-align:left}
  .gt-row.head{border-top:0}
  .gt-row.dir,.gt-row.sub{cursor:pointer}
  .gt-row.dir:hover .gt-lab,.gt-row.sub:hover .gt-lab{background:var(--field)}
  .gt-row.dir:hover .gt-lab b,.gt-row.sub:hover .gt-lab b{color:var(--accent)}
  .gt-lab{position:sticky; left:0; z-index:2; flex:none; width:152px; min-width:152px;
    padding:11px 12px 11px 16px; background:var(--card); border-right:1px solid var(--line);
    transition:background .18s cubic-bezier(.16,1,.3,1)}
  .gt-lab b{display:block; font-size:15px; font-weight:600; letter-spacing:-.01em; line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:color .18s cubic-bezier(.16,1,.3,1)}
  .gt-lab span{display:block; font-size:12.5px; color:var(--sub); line-height:1.4;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .gt-row.sub .gt-lab{padding-left:32px}
  .gt-row.sub .gt-lab b{font-size:14px; font-weight:500}
  /* 구분 머리 — 가로로 흘러도 이름은 왼쪽에 남는다 */
  .gt-grp{border-top:1px solid var(--line); padding:16px 16px 7px; background:var(--field)}
  .gt-grp:first-child{border-top:0}
  .gt-grp i{position:sticky; left:16px; display:inline-flex; align-items:center; gap:8px;
    font-style:normal; font-size:14px; font-weight:700; color:var(--ink); letter-spacing:-.01em}
  /* 건수 배지 — 액센트 계열은 어느 쪽으로 칠해도 4.5:1을 못 넘겼다 (흰 글씨 3.6 / 액센트 글씨 3.8).
     구분 머리줄이 --field라, 배지만 --card로 띄우면 라이트 5.3:1 · 다크 5.9:1이 나온다 */
  .gt-grp i em{font-style:normal; font-weight:700; color:var(--sub); background:var(--card);
    border-radius:999px; padding:2px 9px; font-size:12px}
  .gt-track{position:relative; flex:none; display:flex}
  .gt-d{flex:none; width:var(--gt-dw); border-left:1px solid var(--line)}
  .gt-d.we{background:color-mix(in srgb, var(--sub) 12%, transparent)}
  .gt-d.today{background:color-mix(in srgb, var(--accent) 20%, transparent)}
  .gt-row.head .gt-d{padding:7px 0 8px; text-align:center; font-size:12.5px; font-weight:700; color:var(--sub)}
  /* 오늘 칸 머리 — 흰 글씨를 --accent 위에 얹으면 다크에서 3.6:1이라, 막대와 같은 방식으로 어둡게 깐다 */
  .gt-row.head .gt-d.today{color:#FFFFFF; background:color-mix(in srgb, var(--accent) 78%, #000)}
  .gt-mons{display:flex; padding-left:152px}
  /* 라벨 폭은 하루폭()의 700px 문턱과 같이 움직인다 — 폰에서는 이름을 줄여 날짜를 더 보여준다 */
  @media (min-width:700px){
    .gt-lab{width:214px; min-width:214px}
    .gt-mons{padding-left:214px}
  }
  .gt-mon{flex:none; font-size:12.5px; font-weight:700; color:var(--ink); padding:9px 0 3px 6px; border-left:1px solid var(--line)}
  /* 막대 — 시작일~마감일. 색을 통째로 채운다 (연한 톤은 흰 카드 위에서 안 보인다).
     완료는 초록, 지연은 빨강, 진행 중은 액센트, 보류는 회색 */
  .gt-bar{position:absolute; top:50%; transform:translateY(-50%); height:20px; border-radius:999px;
    background:var(--gt-wait)}
  .gt-bar.done{background:var(--gt-done)}
  .gt-bar.late{background:var(--gt-late)}
  .gt-bar.hold{background:var(--gt-hold)}
  .gt-bar.confirm{background:var(--gt-confirm)}
  /* 요약 막대(업무 줄) — 세부업무를 감싸는 띠라 얇고 각지게 해서 세부 막대와 구별한다 */
  .gt-bar.roll{height:10px; border-radius:3px}
  /* 창 밖으로 잘린 쪽은 모서리를 각지게 — 「여기서 끝난 게 아니라 잘렸다」는 표시 */
  .gt-bar.cutL{border-top-left-radius:2px; border-bottom-left-radius:2px}
  .gt-bar.cutR{border-top-right-radius:2px; border-bottom-right-radius:2px}
  /* 기한만 있는 줄 — 기간이 없으니 그날 하나를 마름모로 찍는다 */
  .gt-dot{position:absolute; top:50%; width:16px; height:16px; margin-left:calc((var(--gt-dw) - 16px) / 2);
    transform:translateY(-50%) rotate(45deg); border-radius:3px; background:var(--gt-wait)}
  .gt-dot.done{background:var(--gt-done)}
  .gt-dot.late{background:var(--gt-late)}
  .gt-dot.hold{background:var(--gt-hold)}
  .gt-dot.confirm{background:var(--gt-confirm)}
  /* 창 밖에 있는 줄 — 빈 칸으로 두면 "일정이 없다"로 읽힌다. 어느 쪽에 있는지 화살표로 알린다 */
  .gt-edge{position:absolute; top:50%; transform:translateY(-50%); font-size:16px; font-weight:800;
    color:var(--sub); padding:0 4px}
  .gt-edge.l{left:0}
  .gt-edge.r{right:0}
  .gt-legend{display:flex; flex-wrap:wrap; gap:8px 16px; padding:14px 2px 0; font-size:12.5px; color:var(--sub)}
  .gt-legend span{display:inline-flex; align-items:center; gap:6px}
  .gt-legend s{width:20px; height:11px; border-radius:999px; text-decoration:none}
  .gt-legend s.w{background:var(--gt-wait)}
  .gt-legend s.c{background:var(--gt-confirm)}
  .gt-legend s.d{background:var(--gt-done)}
  .gt-legend s.l{background:var(--gt-late)}

  /* ── 업무 표 (기본 뷰, 노션 판 2026-08-30) ──
     폰에서는 2줄 카드로 접는다 — 가로 스크롤 표는 상태·신호등이 첫 화면 밖으로 밀린다. */
  .viewbar{display:flex; align-items:center; justify-content:space-between; gap:10px 12px; flex-wrap:wrap; margin-bottom:12px}
  .viewbar .vtabs{flex:none}
  .viewbar .vtabs button{flex:none; padding:8px 18px}
  .viewbar .vtype{flex:none; margin-right:auto}
  .viewlabel{margin:0; font-size:12.5px; font-weight:600; color:var(--sub); display:flex; align-items:center; gap:6px}
  .tbl{display:flex; flex-direction:column}
  .tbl-h{display:none}
  .tbl-g{display:flex; align-items:center; gap:8px; padding:14px 2px 6px; border-top:1px solid var(--line)}
  .tbl-g:first-child{border-top:0; padding-top:4px}
  .tbl-g i{font-style:normal; font-size:13.5px; font-weight:700; letter-spacing:-.01em}
  .tbl-g em{font-style:normal; font-size:11.5px; font-weight:700; color:var(--sub); background:var(--field); border-radius:999px; padding:2px 9px}
  .tbl-r{display:grid; width:100%; text-align:left; align-items:center; gap:3px 10px;
    padding:11px 2px; border-top:1px solid var(--line); border-radius:var(--r-row);
    grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"title st" "meta meta";
    transition:background .18s cubic-bezier(.16,1,.3,1)}
  .tbl-r:hover{background:var(--field)}
  .tbl-g + .tbl-r{border-top:0}
  .t-title{grid-area:title; font-size:15px; font-weight:600; letter-spacing:-.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .t-st{grid-area:st; justify-self:end}
  .t-meta{grid-area:meta; display:flex; align-items:center; gap:10px; min-width:0;
    font-size:12.5px; color:var(--sub)}
  .t-who{flex:none}
  .t-due{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
  .t-ms{display:inline-flex; align-items:center; gap:6px; margin-left:auto; white-space:nowrap;
    font-variant-numeric:tabular-nums}
  /* D-day 신호등 — 이모지 대신 팔레트를 따르는 점. 7일 초과 초록 · 3일 초과 주황 · 그 이하·지남 빨강 */
  .tl{width:9px; height:9px; border-radius:50%; flex:none; display:inline-block}
  .tl.g{background:var(--gt-done)}
  .tl.o{background:var(--warn)}
  .tl.r{background:var(--gt-late)}
  .msbar{width:52px; height:4px; border-radius:99px; background:var(--field); overflow:hidden; display:inline-block}
  .msbar i{display:block; height:100%; border-radius:99px; background:var(--gt-done)}
  @media (min-width:700px){
    .tbl-h{display:grid; grid-template-columns:minmax(0,1fr) 92px 92px 138px 96px; gap:0 10px;
      padding:4px 2px 8px; border-bottom:1px solid var(--line); font-size:11.5px; font-weight:700; color:var(--sub)}
    .tbl-r{grid-template-columns:minmax(0,1fr) 92px 92px 138px 96px;
      grid-template-areas:"title who st due ms"; gap:0 10px; padding:12px 2px}
    .tbl-h + .tbl-g{border-top:0}
    .t-meta{display:contents}
    .t-who{grid-area:who; font-size:13px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .t-st{grid-area:st; justify-self:start}
    .t-due{grid-area:due; font-size:13px; color:var(--sub)}
    .t-ms{grid-area:ms; margin-left:0; font-size:12.5px; color:var(--sub)}
  }

  /* 데스크톱: 현황판을 목록 + 캘린더 2단으로 */
  @media (min-width:1080px){
    .wrap{max-width:1104px}
    .topbar-in{max-width:1104px}
    .board-cols{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:0 16px; align-items:start}
    #tabNew{max-width:720px; margin:0 auto}
    .cal-d{min-height:64px}
    .gt-lab{width:270px; min-width:270px}
    .gt-mons{padding-left:270px}
  }

  /* 탭 (대표용) */
  .bigseg{display:flex; background:var(--field); border-radius:var(--r-btn); padding:3px; margin-top:16px}
  .bigseg button{flex:1; padding:11px 0; border-radius:6px; font-size:14px; font-weight:600; color:var(--sub)}
  .bigseg button.on{background:var(--cta); color:#fff; box-shadow:0 2px 8px color-mix(in srgb, var(--cta) 30%, transparent)}

  /* 상세 시트 */
  .sheet-back{
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.35);
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width:640px){ .sheet-back{align-items:center; padding:24px} }
  .sheet{
    background:var(--bg); width:100%; max-width:640px; max-height:92vh; overflow-y:auto;
    border-radius:var(--r-lg) var(--r-lg) 0 0; padding:10px 16px 34px;
  }
  @media (min-width:640px){ .sheet{border-radius:var(--r-lg); padding:10px 22px 30px} }
  .grip{width:38px; height:5px; border-radius:99px; background:var(--line); margin:6px auto 4px}
  .sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:10px 2px 2px}
  .sheet-head h2{margin:0; font-size:21px; font-weight:700; letter-spacing:-.02em; line-height:1.3}
  .sheet-head .close{color:var(--sub); font-size:15px; font-weight:600; flex:none; padding:4px 2px}
  .sheet-meta{font-size:13px; color:var(--sub); padding:4px 2px 0}
  .sheet-meta b{color:var(--ink); font-weight:600}
  .detail-body{font-size:14.5px; white-space:pre-wrap; padding:10px 2px 0}

  /* 대화 스레드 */
  .thread{display:flex; flex-direction:column; gap:10px; margin-top:8px}
  .msg{background:var(--card); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow)}
  .msg .m-head{display:flex; align-items:center; gap:8px; margin-bottom:5px}
  .msg .m-head b{font-size:13px}
  .msg .m-head time{font-size:11px; color:var(--sub); margin-left:auto; white-space:nowrap}
  .msg .m-body{font-size:14px; white-space:pre-wrap}
  .msg .files{display:flex; flex-direction:column; gap:6px; margin-top:8px}
  .msg .files a{
    display:flex; align-items:center; gap:7px; background:var(--field); border-radius:var(--r-btn);
    padding:8px 12px; font-size:13px; font-weight:600; color:var(--accent); text-decoration:none;
  }
  .msg .act{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap}
  .tagline{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--accent)}
  .hint{font-size:12px; color:var(--sub); margin-top:6px; line-height:1.5}
  .proxy{font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; background:var(--field); color:var(--sub)}
  .optline{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13.5px; font-weight:600}
  .optline .tag{flex:none; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent)}

  .file-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--field);
    border-radius:var(--r-btn); padding:8px 12px; font-size:13px; font-weight:600; max-width:100%;
  }
  .file-chip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .file-chip .x{color:var(--bad); font-weight:800; padding:0 2px}

  /* 로그인 */
  .login{max-width:360px; margin:0 auto; padding:12vh 24px 40px; text-align:center}
  .login .mark{
    width:74px; height:74px; border-radius:22px; background:var(--cta); color:#fff;
    font-size:30px; font-weight:800; display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px; letter-spacing:-.02em;
  }
  .login h1{font-size:26px; font-weight:600; letter-spacing:-.02em; margin:0 0 4px}
  .login p{color:var(--sub); font-size:14px; margin:0 0 26px}
  .login input{
    text-align:center; margin-top:12px; background:var(--card);
    border:1.5px solid var(--line); border-radius:var(--r-btn);
    padding:15px 14px; font-size:17px;
  }
  .login input:focus{border-color:var(--accent); outline:none}
  .login .msg-err{color:var(--bad); font-size:13px; font-weight:600; min-height:20px; margin-top:12px}
  .login .otp-note{font-size:13px; color:var(--sub); margin-top:14px; white-space:pre-line}

  /* 토스트 · 로딩 */
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(8px); z-index:60;
    background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:600;
    padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .spin{
    width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:sp .8s linear infinite; margin:0 auto;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading-full{padding:16vh 0; text-align:center}
  .loading-full p{color:var(--sub); font-size:14px; margin-top:14px}

  /* 부팅 인트로 — 옛 Pages 셸이 하던 브랜드 순간을 0.3초로 되살린 것 (ADR 0025).
     ⚠ **지연을 만들지 않는다.** 여기는 스냅샷·초기데이터를 이미 기다리는 자리이고,
     준비되면 show()가 애니메이션이 끝나기를 안 기다리고 바로 걷어 간다. 옛 셸은 반대로
     최소 3.2초를 붙들었고 그것이 승격 전 체감 속도의 정체였다 — 그 방식으로 돌아가지 마라.
     느린 부팅에서 워드마크만 멈춰 있으면 멎은 것처럼 보이므로 0.8초를 넘길 때만 안내가
     뜨게 지연을 준다. JS가 아니라 `both` 채움으로 처리해서 빠른 날엔 아예 안 뜬다.
     `.loading-full`·`.spin`은 시트·처리중 오버레이가 함께 쓰므로 건드리지 않았다. */
  .boot{padding:16vh 0; text-align:center}
  .boot-mark{
    font-size:28px; font-weight:800; letter-spacing:-.02em; color:var(--ink);
    animation:boot-in .3s cubic-bezier(.16,1,.3,1) both;
  }
  .boot-span{
    width:74px; height:3px; border-radius:999px; margin:14px auto 0; background:var(--accent);
    animation:boot-span .24s cubic-bezier(.16,1,.3,1) .06s both;
  }
  .boot-note{
    color:var(--sub); font-size:13px; margin:14px 0 0;
    animation:boot-note .3s cubic-bezier(.16,1,.3,1) .8s both;
  }
  @keyframes boot-in{from{opacity:0; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none}}
  @keyframes boot-span{from{transform:scaleX(0)} to{transform:scaleX(1)}}
  @keyframes boot-note{from{opacity:0} to{opacity:1}}

  .busy{position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center}
  .busy .box{background:var(--card); border-radius:var(--r-lg); padding:22px 30px; box-shadow:var(--shadow); text-align:center}
  .busy p{margin:12px 0 0; font-size:13px; color:var(--sub)}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="vLogin" class="login hide">
  <div class="mark">B</div>
  <h1>브리지</h1>
  <p>바즈바이오메딕 업무지시 플랫폼</p>
  <div id="loginStep1">
    <input type="text" id="inName" placeholder="이름" autocomplete="off">
    <input type="password" id="inPin" placeholder="PIN" inputmode="numeric" autocomplete="off">
    <button class="btn-primary" id="btnLogin">로그인</button>
  </div>
  <div id="loginStep2" class="hide">
    <input type="text" id="inOtp" placeholder="인증번호 6자리" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <button class="btn-primary" id="btnOtp">확인</button>
    <div class="otp-note" id="otpNote"></div>
  </div>
  <div class="msg-err" id="loginErr"></div>
</div>

<!-- 메인 -->
<div id="vMain" class="hide">
  <div class="topbar"><div class="topbar-in">
    <div class="brand">브리지 <small>바즈바이오메딕</small></div>
    <div class="who"><span id="whoName"></span><button id="btnLogout">로그아웃</button></div>
  </div></div>

  <div class="wrap">
    <div class="page-head">
      <h1 id="pageTitle">업무지시</h1>
      <time id="todayLabel"></time>
    </div>

    <div class="bigseg hide" id="mainTabs">
      <button class="on" data-tab="board">현황판</button>
      <button data-tab="new">새 지시</button>
    </div>

    <!-- 현황판 / 내 지시 -->
    <div id="tabBoard">
      <div class="tiles" id="tiles"></div>
      <div class="searchbar"><input type="text" id="q" placeholder="검색 · 제목 · 내용 · 이름" autocomplete="off"></div>
      <!-- 본판 카드 — 표가 기본 뷰, 간트·캘린더는 전환 뷰다 (노션 판 2026-08-30).
           gtWrap·calGrid 등 기존 id를 그대로 옮겨 renderGantt·renderCal은 무수정 흡수됐다. -->
      <div class="card" id="cardView">
        <div class="viewbar">
          <div class="seg vtabs" id="viewTabs">
            <button class="on" data-view="table">표</button>
            <button data-view="gantt">간트</button>
            <button data-view="cal">캘린더</button>
          </div>
          <!-- 유형 칩 — 임원 KPI만 모아 보는 자리 (노션 판 결정 3). 세 뷰에 똑같이 걸린다 -->
          <div class="chips vtype" id="typeChips">
            <button class="chip on" data-type="">전체</button>
            <button class="chip" data-type="일반">일반</button>
            <button class="chip" data-type="KPI">KPI</button>
          </div>
          <h3 id="listLabel" class="viewlabel"></h3>
        </div>
        <div id="viewTable">
          <div class="tbl" id="tblWrap"></div>
        </div>
        <div id="viewGantt" class="hide">
          <div class="cal-head">
            <h3>업무 일정</h3>
            <div class="cal-nav">
              <button id="gtPrev" aria-label="앞 2주">&#8249;</button>
              <b id="gtRange"></b>
              <button id="gtNext" aria-label="뒤 2주">&#8250;</button>
            </div>
          </div>
          <div class="gt-wrap" id="gtWrap"></div>
          <div class="gt-legend">
            <span><s class="w"></s>진행 중</span><span><s class="c"></s>컨펌 대기</span><span><s class="d"></s>완료</span><span><s class="l"></s>지연</span>
            <span>◆ 기한만 정해진 줄</span>
          </div>
        </div>
        <div id="viewCal" class="hide">
          <div class="cal-head">
            <h3>보고 일정</h3>
            <div class="cal-nav">
              <button id="calPrev" aria-label="이전 달">&#8249;</button>
              <b id="calTitle"></b>
              <button id="calNext" aria-label="다음 달">&#8250;</button>
            </div>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
      </div>
      <div class="board-cols">
        <div class="board-main">
          <div class="card" id="cardStuck">
            <h3 id="stuckHead">막힌 곳</h3>
            <div class="dlist" id="stuckList"></div>
          </div>
          <div class="card hide" id="cardMembers">
            <h3>임원별 현황 <span style="font-weight:400">· 카드를 누르면 상세가 열립니다</span></h3>
            <div id="memRows"></div>
          </div>
        </div>
        <aside class="board-side">
          <div class="card" id="cardMeet">
            <h3 id="meetHead">미팅</h3>
            <div class="dlist" id="meetList"></div>
            <button class="btn-quiet hide" id="btnMeetNew" style="margin-top:12px">대표님께 미팅 요청</button>
            <div class="hint hide" id="meetHint"></div>
          </div>
        </aside>
      </div>
    </div>

    <!-- 새 지시 (대표/관리자) -->
    <div id="tabNew" class="hide">
      <div class="card">
        <h3 id="formHead">새 지시</h3>
        <div id="newAsWrap" class="hide">
          <div class="row-label">지시 명의</div>
          <div class="seg" id="newAsSeg">
            <button class="on" data-v="">내 이름으로</button><button data-v="boss" id="newAsBoss">대표님 대신</button>
          </div>
          <div class="hint hide" id="newAsHint"></div>
        </div>
        <textarea id="newTitle" placeholder="지시 내용을 입력하세요" rows="2"></textarea>
        <div class="row-label">상세 설명 (선택)</div>
        <textarea id="newDetail" placeholder="배경이나 참고사항이 있으면 적어주세요" rows="2"></textarea>
        <div class="row-label" id="whoLabel">담당 임원</div>
        <div class="chips" id="newWho"></div>
        <!-- 구분 — 업무 일정(간트)에서 줄을 묶는 갈래. 자유 입력이고, 이미 쓴 값은 목록으로 뜬다 -->

<script>
  /* 딥링크 — 알림 메일의 「지시 보기」가 `?d=123`으로 온다.
     예전에는 GAS doGet이 템플릿 스크립틀릿으로 심어 줬다. 화면이 Pages로 오면서
     ⚠ 그 스크립틀릿 문법을 이 파일 어디에도(주석에도) 다시 적지 마라. 이 파일은 롤백 경로에서
     여전히 GAS 템플릿으로 평가되고, 주석 안이라도 GAS는 그것을 실행하려 든다 —

     심어 줄 사람이 없어졌고, 대신 주소를 직접 읽는다. GAS는 화면을 샌드박스 iframe에 넣어
     쿼리가 안 실렸으므로 예전에는 이 길이 아예 없었다. */
  const BOOT = { d: (function () {
    const v = new URLSearchParams(location.search).get('d');
    return v && isFinite(Number(v)) ? Number(v) : null;
  })() };

  /* 배포 시각 도장. `도구/브리지배포.js`가 이 자리를 실제 값으로 바꿔 넣는다 — 저장소 원본은 dev.
     낡은 화면이 붙었는지 사람이 알아볼 근거다.

     ⚠ 브리지에는 이 값을 version.txt와 대조하는 `버전확인_`이 아직 없다(SalesON엔 있다).
     그래서 지금은 사람이 콘솔에서 눈으로 보는 표지일 뿐이다. 낡은 화면을 막는 일 자체는
     sw.js의 네트워크 우선(no-store)이 하고 있다.
     ⚠ 아래 선언은 한 줄짜리 그대로 두어야 배포 스크립트가 도장을 찍는다. 줄바꿈을 넣거나
     따옴표를 바꾸면 스크립트가 중단한다 — 조용히 틀리지는 않는다. */
  var 빌드버전_ = '202608300930';

  /* GAS 배포 주소 — 화면이 GAS 밖으로 나가면서 `google.script.run`이 없어졌다.
   * 대신 GAS의 doPost 디스패처를 fetch로 부른다 (ADR 0008).
   *
   * **한 파일이 두 곳에 배포된다.**
   *   bazbio.github.io/bridge/       임원들이 쓴다.    → 운영 배포(고정 ID)
   *   bazbio.github.io/bridge-next/  여기서 검증한다.  → 검증 배포
   *
   * 버전 번호(@32 같은)는 여기 적지 않는다. ID는 고정이지만 버전은 redeploy할 때마다 바뀌어,
   * 적어 두면 반드시 낡는다. 실제로 8/15 승격 전까지 이 자리에 「운영 @32 / 검증 @33」이
   * 적혀 있었고 둘 다 틀린 값이었다. 지금 버전이 궁금하면 `clasp deployments`로 본다.
   *
   * ⚠ 검증용으로 `@HEAD` 배포를 쓰면 안 된다. 그 배포는 익명 접근이 막혀 있어 화면이 부르면
   *   Google 로그인 HTML이 401로 돌아온다(2026-08-12 확인). 코드를 고칠 때마다
   *   `clasp deploy`로 검증 배포를 새로 만들거나, 같은 ID에 `clasp redeploy`한다.
   *
   * 그래서 주소를 경로로 가른다. 손으로 바꿔 넣으면 승격할 때마다 빠뜨릴 자리가 생기고,
   * 그 실수는 **임원들이 검증용 배포를 부르는 것**이라 조용히 위험하다. 파일 하나가 어디에
   * 놓였는지 보고 스스로 정하게 둔다. `-next`가 아닌 모든 경로는 운영이다 — GAS doGet으로
   * 열리는 롤백 경로도 여기 걸린다.
   *
   * ⚠ 배포 ID를 바꾸면 여기도 바꾼다. 운영 쪽을 잘못 건드리면 임원 전원이 멈춘다.
   *   `clasp redeploy`로 같은 ID를 유지하는 한 운영 ID는 안 바뀐다(새 배포 금지). */
  const API_URL = 'https://script.google.com/macros/s/'
    + (location.pathname.indexOf('-next') >= 0
        ? 'AKfycbxI6OHqfezvQ3a8lvIdH3lUqQJR_Hep6JUruARDgXoBcbF4vVRVs9tyBmm4qKNH_GyKMg'  // 검증용
        : 'AKfycbx9Y99D3BdLucPbmYVb14Go7fOhtnIXQ7namenu9zRe0BWXL6rV4vCD2eCuWx4He21fqw') // 운영
    + '/exec';
  // 관문(Supabase 엣지 펑션) — Code.js CONFIG.GATE_URL과 같다
  const GATE_URL = 'https://orttfugxziltenujdlme.supabase.co/functions/v1';

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  /* 부팅 계측 — 주소 끝에 `?perf`를 붙였을 때만 돈다 (2026-08-19).
     폰에서는 콘솔을 못 보므로 화면 아래에 찍는다. 임원이 쓰는 주소에는 안 붙으므로 화면은
     한 픽셀도 안 바뀐다. 숫자는 문서 요청이 시작된 순간부터의 밀리초다.
     쿼리 이름을 한글로 안 둔 이유: 폰 주소창에서 한글을 치기가 번거롭고, location.search는
     퍼센트 인코딩된 채로 와서 비교가 한 겹 더 든다. */
  const 계측켬_ = location.search.indexOf('perf') >= 0;
  const 계측줄_ = [];
  function 계측(라벨, ms){
    if (!계측켬_) return;
    계측줄_.push(라벨 + ' ' + Math.round(ms == null ? performance.now() : ms) + 'ms');
    let box = $('계측판');
    if (!box) {
      box = document.createElement('div');
      box.id = '계측판';
      box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.82);'
        + 'color:#fff;font:12px/1.5 monospace;padding:6px 10px;white-space:pre-wrap';
      document.body.appendChild(box);
    }
    box.textContent = 계측줄_.join('\n');
  }
  if (계측켬_) {
    const nav = performance.getEntriesByType('navigation')[0];
    if (nav) 계측('화면 내려받기 끝', nav.responseEnd);
    계측('스크립트 시작');
  }

  let TOKEN = localStorage.getItem('brg_token') || '';
  let DEV = '';             // 기기 식별자 — 메일 인증을 마친 기기는 서버가 기억해 인증번호 생략 (6개월)
  try {
    DEV = localStorage.getItem('brg_device') || '';
    if (!DEV) {
      if (window.crypto && crypto.getRandomValues) {
        const a = new Uint8Array(16); crypto.getRandomValues(a);
        DEV = Array.prototype.map.call(a, b => ('0' + b.toString(16)).slice(-2)).join('');
      } else {
        DEV = String(Date.now()) + Math.random().toString(16).slice(2);
      }
      localStorage.setItem('brg_device', DEV);
    }
  } catch (e) {}
  let DATA = null;          // 웹_초기데이터 결과
  let 갱신대기_ = null;      // 방금 쓰기 응답에 실려 온 목록 갱신분 — refresh()가 소비한다
  let pendingLogin = null;  // {name, pin}
  let newFiles = [];        // 답변 첨부 대기 목록
  let LASTD = null;         // 상세 시트에 열려 있는 지시
  let LASTS = [];           // 그 지시의 세부업무
  const FILTER = { q: '', member: '', type: '' };
  const PRIS = ['보통','중요','긴급'];
  // 열린 상태 3종 — 상태 5종 판(2026-08-30)의 「아직 안 끝난」 쪽
  const isOpen = s => s === '시작 전' || s === '진행 중' || s === '컨펌 대기';
  /* 관문에 구워진 옛 부트 스냅샷은 옛 상태 어휘(답변 대기/답변 완료)를 들고 온다 —
     서버 상태정규화_와 같은 매핑. 새 서버 응답에는 헛돈다 (이미 새 어휘다). */
  function 상태정규화(data){
    const map = { '답변 대기': '시작 전', '답변 완료': '진행 중' };
    ((data && data.directives) || []).forEach(d => { d.status = map[d.status] || d.status || '시작 전'; });
    return data;
  }

  /* 서버 호출 통로 (ADR 0008). 호출부 24곳은 한 줄도 안 바뀐다 — 이 함수만 갈아끼웠다.
   *
   * ⚠ 여기서 가장 중요한 것은 **오류 문구를 잃지 않는 것**이다. `google.script.run`은
   *   withFailureHandler에 서버 예외를 그대로 줬고, 화면 여러 곳이 그 문구를 토스트로
   *   띄운다("이미 처리된 요청입니다" 같은 말). 디스패처가 {ok:false,error}로 실어 보낸
   *   문구를 여기서 Error로 되살려야 그 문구가 산다.
   *
   * 본문을 percent-encoding해서 순수 ASCII로 보낸다. text/plain이라야 CORS 사전요청이
   * 붙지 않는데(왕복 하나가 준다), GAS가 그 본문의 문자셋을 UTF-8로 안 읽어 한글이 깨지기
   * 때문이다. Code.js doPost가 decodeURIComponent로 되돌린다. */
  function gs(fn){
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((res, rej) => {
      const 실패 = msg => rej(new Error(String(msg || '오류가 발생했습니다').replace(/^Error: ?/,'')));
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: encodeURIComponent(JSON.stringify({ fn: fn, args: args })),
      }).then(r => r.text()).then(t => {
        let r;
        // 본문이 JSON이 아니면 GAS가 HTML 오류 페이지를 낸 것이다 (배포 만료·권한 등).
        // 그 HTML을 그대로 토스트에 띄우면 아무도 못 읽으므로 여기서 사람 말로 바꾼다.
        try { r = JSON.parse(t); } catch (e) { return 실패('서버에 연결하지 못했습니다'); }
        if (r && r.ok) {
          /* 쓰기 응답에 실려 온 목록 갱신분을 붙잡아 둔다 (2026-08-19) — Code.js 갱신얹기_.
             뒤이어 부르는 refresh()가 이걸 쓰면 왕복이 하나 준다.
             성공한 응답마다 덮어쓰므로(없으면 null) 묵은 갱신이 잘못 쓰일 자리가 없다. */
          갱신대기_ = (r.data && r.data.갱신) || null;
          res(r.data);
        } else 실패(r && r.error);
      }).catch(e => 실패(e && e.message));
    });
  }

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function busy(on, msg){
    $('busy').classList.toggle('hide', !on);
    if (msg) $('busyMsg').textContent = msg;
  }
  function show(view){
    ['vLogin','vMain','vLoading'].forEach(v => $(v).classList.add('hide'));

  // ── 세그먼트/칩 공통 ──

    const box = $(id);

  const segVal = id => { const b = $(id).querySelector('button.on'); return b ? (b.dataset.v !== undefined ? b.dataset.v : b.textContent.trim()) : ''; };

  // ── 10분 단위 일시 선택 (날짜 + 시 + 분) ──
  function dtPickHtml(id){

    for (let m = 0; m < 60; m += 10)

      + '<select id="' + id + 'M">' + ms + '</select></div>';
  }
  // 'yyyy-MM-ddTHH:mm' 반환, 날짜 미선택 시 ''
  const dtPickVal = id => $(id + 'D').value ? $(id + 'D').value + 'T' + $(id + 'H').value + ':' + $(id + 'M').value : '';

  // ── 로그인 ──
  $('btnLogin').addEventListener('click', async () => {
    const name = $('inName').value.trim(), pin = $('inPin').value.trim();
    if (!name || !pin) { $('loginErr').textContent = '이름과 PIN을 입력해 주세요.'; return; }

    busy(true, '확인 중...');
    try {
      const r = await gs('웹_로그인', name, pin, DEV);
      if (r && r.token) {   // 신뢰 기기 — 인증번호 없이 바로 로그인

        return;

      $('loginStep2').classList.remove('hide');
      $('otpNote').textContent = r.hint + ' 주소로 인증번호를 보냈습니다.\n인증 후 이 기기에서는 6개월간 인증번호 없이 로그인됩니다.';

    } catch (e) { $('loginErr').textContent = e.message; }

  });

  ['inPin','inOtp'].forEach(id => $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') (id === 'inPin' ? $('btnLogin') : $('btnOtp')).click();

  $('btnLogout').addEventListener('click', () => {
    localStorage.removeItem('brg_token'); TOKEN = ''; location.reload();
