<script>
/* 담당자가 주소만 치고 들어오면 현황으로 보낸다 (2026-08-29 사용자 결정).
   「첫 화면은 품질 현황」이라는 요청이 이 화면(무로그인 등록)에는 걸 수 없어서다 —
   로그인 없이 열리는 주소에 품질 데이터를 올릴 수는 없다.

   ⚠ **QR은 `?r`을 달고 나간다.** 현장에서 QR을 찍으면 로그인한 적이 있어도 **언제나 등록 화면**이다.
   안 그러면 영업사원 폰에 세션이 생긴 뒤로 QR이 현황으로 튀어 30초 등록이 깨진다.
   `r`은 register다. 한글 질의문자열은 QR에서 퍼센트 인코딩돼 길어지고 스캐너에 따라 깨진다.

   <head>에서 돌린다 — 본문이 그려진 뒤에 옮기면 등록 화면이 한 번 번쩍인다. */
(function () {
  if (/[?&]r(=|&|$)/.test(location.search)) return;   // QR로 왔다 — 등록 화면이 맞다
  var 세션 = null;
  try { 세션 = JSON.parse(localStorage.getItem('meari.세션')); } catch (e) {}
  if (세션 && 세션.토큰) location.replace('app.html');
})();

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   관문 세 개를 부른다 (SPEC §5.1 · §7)
     meari-boot        이름 목록 · 유형 목록 · 최근 거래처

  var 첫 = document.createElement('option');
  첫.value = '';
  첫.textContent = 사람.length ? '이름을 골라 주세요' : '등록자 명단이 아직 비어 있습니다';
  sel.appendChild(첫);

  사람.forEach(function (p) {
    var o = document.createElement('option');
    o.value = p.이름;
    o.textContent = p.이름;
    sel.appendChild(o);
  });

  // 한 번 고르면 폰이 기억한다 — 두 번째부터는 바로 본론이다
  var 기억 = '';
  try { 기억 = localStorage.getItem(기억키) || ''; } catch (e) {}
  if (기억 && 사람.some(function (p) { return p.이름 === 기억; })) sel.value = 기억;

  sel.onchange = function () {
    try { localStorage.setItem(기억키, sel.value); } catch (e) {}
  };
}

function 최근채우기(목록) {
  var 칸 = $('최근');
  칸.textContent = '';
  목록.slice(0, 8).forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = r.표기;
    b.onclick = function () { $('거래처').value = r.표기; };
    칸.appendChild(b);
  });
}

/* ── 그룹웨어 접수 글 붙여넣기 ────────────────────────────────────
   지금 접수는 그룹웨어 「Cs접수건」 대화방에 이 다섯 줄로 올라간다:

     병원명 / 영업담당자 / 연락처 / 접수사항 / 특이사항

   메아리는 그 방을 대체하지 않는다 — CS에는 지금처럼 그룹웨어로 간다. 그러면 영업이
   같은 것을 두 번 적게 되고, **두 번 적는 것은 죽는다.** 그래서 그 글을 그대로 받는다.
   같은 글을 붙여넣는 것으로 등록이 끝나야 이 장부가 산다.
   ────────────────────────────────────────────────────────────── */
var 붙임키 = {
  '병원명': '거래처', '거래처': '거래처', '병원': '거래처',
  '영업담당자': '담당', '담당자': '담당',
  '연락처': '연락처', '전화': '연락처', '전화번호': '연락처',
  '접수사항': '내용', '내용': '내용', '증상': '내용',
  '특이사항': '특이사항', '비고': '특이사항'
};

/* ⚠ 값이 한 줄로 안 끝난다 (2026-08 실물 8건에서 확인). 이런 것들이 온다:
     특이사항:                     ← 키만 있고 값은 다음 줄부터
     투자처
     동행 불가
   그리고 「특이사항: 워런티 유효」 뒤에 대시로 시작하는 줄이 셋 더 붙기도 한다.
   그래서 **아는 키를 만나면 그 칸을 열고, 다음 아는 키를 만날 때까지의 줄을 전부
   그 칸에 붙인다.** 한 줄만 보던 옛 파서는 8건 중 6건에서 값을 잘라먹었다. */
function 붙임파싱(글) {
  var 결과 = {}, 찾음 = 0, 열린칸 = null;
  글.split(/\r?\n/).forEach(function (원줄) {
    var 줄 = 원줄.trim();
    if (!줄) return;
    var m = 줄.match(/^([^:：]{1,12})\s*[:：]\s*([\s\S]*)$/);
    var 칸 = m ? 붙임키[m[1].replace(/\s+/g, '')] : null;
    if (칸) { 찾음++; 열린칸 = 칸; 결과[칸] = m[2].trim(); return; }
    if (열린칸) 결과[열린칸] = (결과[열린칸] ? 결과[열린칸] + '\n' : '') + 줄;
  });
  var 담당 = 결과.담당 || '';
  delete 결과.담당;
  // 두 칸 이상 알아본 것만 접수 양식으로 본다. 한 줄짜리 메모가 잘못 흩어지지 않게
  return 찾음 >= 2 ? { 값: 결과, 담당: 담당 } : null;
}

function 붙임채우기(파싱) {
  var 채운것 = [];
  // 거래처·연락처는 한 줄 칸이다 — 이어진 줄은 공백으로 잇는다.
  // input에 줄바꿈을 넣으면 브라우저가 지워 「투자처동행 불가」처럼 붙어 버린다
  var 한줄 = function (s) { return String(s).split(/\n+/).join(' '); };
  if (파싱.값.거래처)   { $('거래처').value = 한줄(파싱.값.거래처); 채운것.push('병원명'); }
  if (파싱.값.연락처)   { $('연락처').value = 한줄(파싱.값.연락처); 채운것.push('연락처'); }
  if (파싱.값.특이사항) { $('특이사항').value = 파싱.값.특이사항; 채운것.push('특이사항'); }
  $('내용').value = 파싱.값.내용 || '';

  // 담당자 이름은 명부에 있을 때만 고른다 — 없는 이름을 넣으면 서버가 403을 낸다
  if (파싱.담당 && 사람.some(function (p) { return p.이름 === 파싱.담당; })) {
    $('이름').value = 파싱.담당;
    try { localStorage.setItem(기억키, 파싱.담당); } catch (e) {}
    채운것.push('담당자');
  }

  // 제품은 **글자가 그대로 있을 때만** 고른다. 둘 이상 짚이거나 없으면 아무것도 안 고르고
  // 사람이 누른다 — 틀리게 찍어 주는 것이 안 찍어 주는 것보다 나쁘다.
  // 못 짚으면 **앞 글의 제품을 지운다.** 붙여넣기는 칸을 다시 채우는 동작이라서,
  // 안 지우면 잘못 붙여넣고 다시 붙여넣었을 때 앞 제품이 남아 그대로 틀리게 찍힌다
  var 글 = (파싱.값.내용 || '') + ' ' + (파싱.값.특이사항 || '');
  var 짚임 = ['핸드피스', '노즐', '큐어젯', '노보젯'].filter(function (p) { return 글.indexOf(p) >= 0; });
  고른제품 = (짚임.length === 1) ? 짚임[0] : '';
  제품그리기();
  if (고른제품) 채운것.push('제품');

  var el = $('붙임말');
  el.textContent = 채운것.length
    ? '접수 글을 알아봤습니다 — ' + 채운것.join('·') + ' 채웠습니다. 증상은 눌러서 골라 주세요.'
    : '접수 글을 알아봤습니다. 나머지 칸은 눌러서 골라 주세요.';
  보임(el, true);
}

$('내용').addEventListener('paste', function (e) {
  var 클립 = e.clipboardData || window.clipboardData;
  if (!클립) return;
  var 글 = 클립.getData('text');
  if (!글 || 글.indexOf('\n') < 0) return;      // 한 줄짜리는 그냥 붙는다
  var 파싱 = 붙임파싱(글);
  if (!파싱) return;
  e.preventDefault();
  붙임채우기(파싱);
});

/* ── 사진: 고르는 즉시 줄인다 ── */
$('사진추가').onclick = function () { $('파일').click(); };

$('파일').onchange = function (e) {
  var 파일들 = Array.prototype.slice.call(e.target.files || []);
  e.target.value = '';
  파일들.slice(0, 사진최대 - 사진.length).forEach(function (f) {
    줄이기(f).then(function (blob) {
      if (사진.length >= 사진최대) return;
      사진.push(blob);
      사진그리기();
    }).catch(function () { 탈보임('사진 하나를 읽지 못했습니다. 다시 찍어 주세요.'); });
  });
};

function 줄이기(파일) {
  return new Promise(function (성공, 실패) {
    var img = new Image();
    var url = URL.createObjectURL(파일);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var 비율 = Math.min(1, 긴변 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * 비율);
      c.height = Math.round(img.height * 비율);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { b ? 성공(b) : 실패(new Error('blob')); }, 'image/jpeg', 화질);
    };
    img.onerror = function () { URL.revokeObjectURL(url); 실패(new Error('load')); };
    img.src = url;
  });
}

function 사진그리기() {
  var 칸 = $('사진칸');
  Array.prototype.slice.call(칸.querySelectorAll('.한장')).forEach(function (el) { el.remove(); });
  사진.forEach(function (b, i) {
    var 감 = document.createElement('div');
    감.className = '한장';
    var img = document.createElement('img');
    img.src = URL.createObjectURL(b);
    img.alt = (i + 1) + '번째 사진';
    img.onload = function () { URL.revokeObjectURL(img.src); };
    var x = document.createElement('button');
    x.type = 'button';
    x.className = '뺀다';
    x.setAttribute('aria-label', (i + 1) + '번째 사진 빼기');
    x.textContent = '×';
    x.onclick = function () { 사진.splice(i, 1); 사진그리기(); };
    감.appendChild(img);
    감.appendChild(x);
    칸.insertBefore(감, $('사진추가'));
  });
  $('사진추가').disabled = 사진.length >= 사진최대;
}

/* ── 동영상: 브라우저 재인코딩이 안 되므로 크기만 확인하고 그대로 올린다 ── */
$('동영상추가').onclick = function () { $('동영상파일').click(); };
$('동영상파일').onchange = function (e) {
  var f = (e.target.files || [])[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > 동영상최대) return 탈보임('동영상이 50MB를 넘습니다. 30초 이내로 잘라서 올려 주세요.');
  동영상 = f;
  동영상그리기();
};
function 동영상그리기() {
  var 칸 = $('동영상칸');
  Array.prototype.slice.call(칸.querySelectorAll('.한장')).forEach(function (el) { el.remove(); });
  if (동영상) {
    var 감 = document.createElement('div');
    감.className = '한장';
    감.style.cssText = 'display:flex;align-items:center;justify-content:center;background:#111;border-radius:8px;color:#fff;font-size:11px;flex-direction:column;gap:3px';
    감.innerHTML = '<span>동영상</span><span style="opacity:.7">' + (동영상.size / 1048576).toFixed(1) + 'MB</span>';
    var x = document.createElement('button');
    x.type = 'button';
    x.className = '뺀다';
    x.setAttribute('aria-label', '동영상 빼기');
    x.textContent = '×';
    x.onclick = function () { 동영상 = null; 동영상그리기(); };
    감.appendChild(x);
    칸.insertBefore(감, $('동영상추가'));
  }
  $('동영상추가').disabled = !!동영상;
}

/* ── 보내기 ── */
$('보내기').onclick = function () {
  if (보내는중) return;

  var 이름 = $('이름').value;
  var 내용 = $('내용').value.trim();
  if (!이름) return 탈보임('이름을 골라 주세요.');
  if (!고른제품) return 탈보임('무엇에 대한 것인지 골라 주세요.');
  if (!고른유형) return 탈보임('어떤 증상인지 골라 주세요.');
  if (!내용) return 탈보임('무슨 일이 있었는지 적어 주세요.');
  탈보임('');

  보내는중 = true;
  $('보내기').disabled = true;
  $('보내기').textContent = '보내는 중…';

  fetch(관문 + '/meari-register', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      이름: 이름,
      거래처표기: $('거래처').value.trim(),
      연락처: $('연락처').value.trim(),
      제품: 고른제품,
      유형: 고른유형,
      내용: 내용,
      특이사항: $('특이사항').value.trim(),
      사진장수: 사진.length,
      동영상: !!동영상
    })
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) throw new Error(d && d.이유 ? d.이유 : '보내지 못했습니다');
      // 건은 이미 저장됐다. 여기서부터 실패해도 현장 목소리는 남는다 (SPEC §7)
      return 사진올리기(d.건_id, d.업로드 || []).then(function (올린수) {
        끝내기(d.건_id, d.기한, 올린수);
      });
    })
    .catch(function (e) {
      보내는중 = false;
      $('보내기').disabled = false;
      $('보내기').textContent = '보내기';
      탈보임(e && e.message ? e.message : '보내지 못했습니다. 다시 눌러 주세요.');
    });
};

function 사진올리기(건_id, 업로드) {
  if (!업로드.length) return Promise.resolve(0);
  var 성공순번 = [];
  return Promise.all(업로드.map(function (u) {
    var 동영상인가 = u.순번 === 0;
    var 몸통 = 동영상인가 ? 동영상 : 사진[u.순번 - 1];
    if (!몸통) return Promise.resolve();
    return fetch(u.url, {
      method: 'PUT',
      headers: { 'content-type': 동영상인가 ? (동영상.type || 'video/mp4') : 'image/jpeg' },
      body: 몸통
    })
      .then(function (r) { if (r.ok) 성공순번.push(u.순번); })
      .catch(function () {});   // 한 장 실패가 등록 전체를 무르지 않는다
  })).then(function () {
    if (!성공순번.length) return 0;
    return fetch(관문 + '/meari-photo-done', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ 건_id: 건_id, 순번들: 성공순번 })
    }).then(function () { return 성공순번.length; })
      .catch(function () { return 성공순번.length; });
  });
}

function 끝내기(건_id, 기한, 올린수) {
  var 말 = '접수번호 ' + 건_id + '번';
  if (기한) {
    var d = new Date(기한);
    말 += ' · 기한 ' + (d.getMonth() + 1) + '/' + d.getDate();
  }
  var 보낼수 = 사진.length + (동영상 ? 1 : 0);
  if (보낼수) {
    말 += 올린수 === 보낼수
      ? ' · 파일 ' + 올린수 + '개'
      : ' · 파일 ' + 올린수 + '/' + 보낼수 + '개 (일부 실패)';
  }
  $('끝말').textContent = 말;
  보임($('본문'), false);
  보임($('바닥'), false);
  보임($('끝'), true);
  window.scrollTo(0, 0);
}

$('또').onclick = function () {
  $('거래처').value = '';
  $('연락처').value = '';
  $('내용').value = '';
  $('특이사항').value = '';
  보임($('붙임말'), false);
  고른제품 = '';
  고른유형 = '';
  사진 = [];
  동영상 = null;
  사진그리기();
  동영상그리기();
  제품그리기();
  유형그리기();
  보내는중 = false;
  $('보내기').disabled = false;
  $('보내기').textContent = '보내기';
  보임($('끝'), false);
  보임($('본문'), true);
  보임($('바닥'), true);
  window.scrollTo(0, 0);
};

부트();
</script>
