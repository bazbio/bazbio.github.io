<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메아리</title>
<meta name="theme-color" content="#2878ed">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>

/* 이음 화면/style.css의 색·서체·간격·컴포넌트 규칙을 메아리에 적용. */
:root{
  --ink-deep:#192d49;--ink:#192d49;--body:#52657e;--muted:#708097;--faint:#99a6b7;
  --canvas:#fff;--soft:#edf3fa;--card:#f4f7fb;--hair:#dce4ef;--hair2:#e8edf4;
  --red:#b83a46;--red-deep:#b83a46;--red-bg:#fff0f1;--amber:#a96921;--green:#226540;
  --청:#2878ed;--청-deep:#1969dc;--청-bg:#edf4ff;
  --accent:#2878ed;--accent-deep:#1969dc;--accent-bg:#edf4ff;
  --r-in:12px;--r-card:18px;--r-big:23px;--pill:12px;
  --곡선:cubic-bezier(.16,1,.3,1);--하단:calc(100px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f4f7fb;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;font-size:14px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
button:disabled{cursor:default;opacity:.55}:focus-visible{outline:3px solid #9fc7ff;outline-offset:4px}
.숨김,[hidden]{display:none!important}
.마크{display:flex;align-items:center;gap:11px;font-size:30px;font-weight:800;letter-spacing:-1.6px;line-height:1.3}
.브랜드기호{display:grid;place-items:center;width:37px;height:37px;border-radius:12px;background:var(--청);color:white;flex-shrink:0}
.브랜드기호 svg{width:25px;height:25px}
.눈썹{margin:0 0 13px;color:var(--청);font-size:12px;font-weight:650;letter-spacing:.04em}
.버튼,.보내기{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:12px 20px;border:0;border-radius:12px;font-size:14px;font-weight:650;line-height:1.5;background:var(--청);color:white;box-shadow:0 4px 10px #2878ed13;transition:background .18s}
.버튼:hover:not(:disabled),.보내기:hover:not(:disabled){background:var(--청-deep)}
.버튼.흰{background:var(--soft);color:#3f5979;box-shadow:none}.버튼.흰:hover:not(:disabled){background:#e2ebf7}
.버튼.빨글{background:var(--red-bg);color:var(--red);box-shadow:none}
.글칸,.고름{width:100%;min-width:0;min-height:46px;padding:13px 15px;border:1px solid var(--hair);border-radius:12px;background:white;color:inherit}
.글칸::placeholder{color:var(--faint)}.글칸:focus,.고름:focus{outline:2px solid #b5d2ff;border-color:var(--청)}
textarea.글칸{resize:vertical;line-height:1.65;min-height:100px}
.라벨{display:block;font-size:14px;font-weight:600;margin:18px 0 9px}
.알약들,.무리,.최근{display:flex;flex-wrap:wrap;gap:8px}
.알,.최근 button{min-height:44px;padding:10px 15px;border:1px solid var(--hair2);border-radius:12px;background:white;color:#667890;font-size:13px;font-weight:550;transition:background .18s,border-color .18s}
.알:hover,.최근 button:hover{background:#f3f7fc;border-color:#c0d7fa}
.알[aria-pressed="true"]{background:var(--청-bg);border-color:#a7cafa;color:#236bd2;font-weight:700}
.알약들.세로{flex-direction:column}.알약들.세로 .알{text-align:left;min-height:50px;padding:13px 16px}
.도움,.메타{font-size:12px;color:var(--muted);line-height:1.7}.도움{margin:8px 0 0}
.안내,.붙임알림{padding:14px 18px;background:var(--soft);color:var(--body);border-radius:12px;font-size:13px;line-height:1.8;margin:12px 0}
.탈,.알림{padding:14px 18px;background:var(--red-bg);color:var(--red);border-radius:12px;font-size:13px;margin:0 0 16px}
.빙글{width:24px;height:24px;margin:80px auto;border:2.5px solid var(--hair2);border-top-color:var(--청);border-radius:50%;animation:돈다 .7s linear infinite}
@keyframes 돈다{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* 로그인: 이음과 같은 소개 / 로그인 카드의 두 열 구성. */
.로그인판{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:80px;max-width:1180px;margin:auto;padding:80px 50px}
.로그인소개 .마크{margin-bottom:72px}.로그인소개 h1{font-size:42px;line-height:1.45;letter-spacing:-1.8px;margin:0}
.보조{margin:22px 0 0;color:var(--muted);font-size:16px;line-height:1.9}
.흐름{display:flex;align-items:center;gap:12px;margin-top:45px;font-size:12px;color:#7d8da3;flex-wrap:wrap}.흐름 span{background:#eaf0f8;border-radius:20px;padding:10px 16px}.흐름 span:last-child{background:#e1ecff;color:#286dcc}.흐름 i{font-style:normal}
.로그인카드{background:white;padding:44px;border-radius:26px;box-shadow:0 14px 60px #263f6310}.로그인카드 h2{font-size:25px;letter-spacing:-.7px;margin:0 0 25px}.로그인카드 .버튼{width:100%}.로그인카드 .도움{text-align:center;margin-top:20px}
.접수만{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:12px;padding:12px 16px;background:var(--soft);color:#3f5979;border-radius:12px;font-size:13px;font-weight:600}.접수만:hover{background:#e2ebf7}
/* 앱: 왼쪽 메뉴, 사용자 도구, 넓은 작업 영역. */
#앱{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100dvh}
.곁바{background:white;border-right:1px solid var(--hair2);padding:35px 20px 25px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column}.곁바 .마크{margin-left:13px}
.곁설명{font-size:11px;color:#99a6b7;margin:14px 13px 40px}.곁바닥{margin-top:auto;padding-left:12px;font-size:11px;color:#8a99ac;display:flex;align-items:center;gap:8px}.상태점{width:6px;height:6px;background:#82a8db;border-radius:50%}
.필그룹{display:flex;flex-direction:column;gap:8px}.필그룹 button{display:flex;align-items:center;gap:10px;text-align:left;padding:16px 15px;min-height:48px;border:0;border-radius:13px;background:none;color:#667890;font-size:14px;font-weight:550;white-space:nowrap}
.필그룹 button:hover{background:#f3f7fc}.필그룹 button[aria-selected="true"]{background:#edf4ff;color:#236bd2;font-weight:700}.탭기호{width:18px;text-align:center;font-size:16px;font-weight:400}
.필그룹 .수{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:auto;border-radius:20px;background:var(--red);color:white;font-size:11px}
.작업영역{min-width:0}.윗바{height:78px;padding:0 44px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#ffffffa6;border-bottom:1px solid var(--hair2);color:var(--muted);font-size:13px}.사용자도구{display:flex;align-items:center;gap:14px}.사람 b{color:#3c506b;font-weight:600}.나가기{padding:10px;border:0;background:none;color:var(--muted);font-size:13px}.나가기:hover{color:var(--청)}
.몸{max-width:1260px;margin:auto;padding:44px}.페이지머리{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.페이지머리 h1{font-size:30px;letter-spacing:-1px;margin:0 0 10px;line-height:1.4}.페이지머리 .눈썹{font-size:11px;margin-bottom:10px}.페이지머리 .메타{margin:0;font-size:14px}.페이지머리>.버튼{flex-shrink:0}
.꼬리말{max-width:1260px;margin:0 auto;padding:12px 44px 28px;color:#8c9aaf;font-size:12px}
.구분{font-size:17px;font-weight:650;line-height:1.6;margin:28px 0 16px;display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}.구분:first-child{margin-top:0}.구분 span{font-size:12px;font-weight:400}
.카드목록{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}.카드{background:white;border:1px solid transparent;border-radius:18px;padding:22px 25px;margin-bottom:12px;box-shadow:0 2px 8px #203a5d03}.카드목록>.카드{margin-bottom:0}.카드.누름{cursor:pointer;transition:border-color .18s,box-shadow .18s}.카드.누름:hover{border-color:#c0d7fa;box-shadow:0 5px 18px #203a5d08}.카드.요약{background:#f8fbff;border-color:#dceaff}.카드.늦음{border-color:#f0d4d8}
.제목줄{font-size:16px;font-weight:650;line-height:1.6;margin:10px 0 8px}.빈말{text-align:center;background:white;border-radius:22px;padding:64px 24px;color:var(--muted);font-size:14px}.빈말 b{display:block;color:var(--ink);font-size:20px;letter-spacing:-.6px;margin-bottom:10px}
.표식{display:inline-flex;align-items:center;padding:5px 9px;margin-right:6px;border-radius:6px;font-size:11px;font-weight:650;line-height:1.5;vertical-align:middle}.표식.지연{background:var(--red-bg);color:var(--red)}.표식.임박{background:#fff6e6;color:var(--amber)}.표식.끝{background:#e8f5ed;color:var(--green)}.표식.회,.표식.회면{background:#f0f3f7;color:#728096}
.숫자들{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.숫자{background:white;border:1px solid transparent;border-radius:16px;padding:20px}.숫자 .값{font-size:28px;font-weight:700;line-height:1.3}.숫자 .이름{font-size:12px;color:var(--muted);margin-top:10px}.숫자 .꼬리{font-size:11px;color:var(--faint);margin-top:4px}.숫자 .값.빨{color:var(--red)}.숫자 .값.주{color:var(--amber)}.숫자.경보{border-color:#f0d4d8}
.집계들{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.집계카드{min-width:0;background:white;border-radius:20px;padding:26px}.집계카드:first-child{grid-column:1/-1}.집계카드 .구분{margin:0 0 20px}
.막대줄{display:grid;grid-template-columns:minmax(76px,32%) minmax(0,1fr) 65px;gap:10px;align-items:center;margin-bottom:12px;font-size:12px}.막대줄 .이름{color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.막대통{background:#edf3fa;border-radius:12px;height:9px;overflow:hidden}.막대통 i{display:block;background:var(--청);height:100%;border-radius:12px;min-width:3px}.막대통 i.빨{background:var(--red)}.막대줄 .값{text-align:right;font-weight:650;white-space:nowrap}.막대줄 .값 span{font-weight:400;color:var(--faint);font-size:10px}
.추이{display:flex;gap:14px;align-items:flex-end;height:180px;margin:6px 0 12px;padding:0 4px;overflow-x:auto}.기둥{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}.기둥 b{font-size:12px;font-weight:650}.기둥 i{display:block;width:100%;max-width:64px;background:var(--청);border-radius:6px 6px 0 0;min-height:2px}.기둥 i.늦{background:var(--red)}.기둥 em{font-style:normal;font-size:11px;color:var(--muted)}
.사진띠{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.사진띠 img{width:80px;height:80px;object-fit:cover;border-radius:12px;border:1px solid var(--hair2)}
.겹창{position:fixed;inset:0;z-index:50;background:#14294066;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px}.겹창 .판{background:white;border-radius:23px;width:100%;max-width:650px;max-height:90dvh;overflow-y:auto;padding:26px 30px 30px;box-shadow:0 25px 90px #10253d33}.겹창 .구분{font-size:16px;margin-top:26px}.닫기줄{display:flex;justify-content:flex-end;margin-bottom:4px}.닫기줄 button{background:#f1f5fa;border:0;border-radius:50%;width:44px;height:44px;font-size:24px;color:#65758a}
table.표{width:100%;border-collapse:collapse;background:white;font-size:12px}table.표 th,table.표 td{text-align:left;padding:10px;border-bottom:1px solid var(--hair2)}table.표 th{color:var(--muted);font-weight:500}table.표 td.수{text-align:right;font-weight:650}.표감{border-radius:18px;overflow-x:auto}
@media(min-width:1500px){.몸{padding-top:58px}.카드{padding:25px 30px}}
@media(max-width:1000px){.집계들{grid-template-columns:1fr}.집계카드:first-child{grid-column:auto}}
@media(max-width:900px){#앱{grid-template-columns:188px minmax(0,1fr)}.곁바{padding:28px 12px}.윗바{padding:0 26px}.몸{padding:30px 26px}.필그룹 button{font-size:12px;padding:14px 10px}.곁설명{font-size:10px}.로그인판{gap:35px;padding:50px 30px}.로그인소개 h1{font-size:32px}.로그인카드{padding:30px}.페이지머리 h1{font-size:26px}.숫자들{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.로그인판{display:flex;flex-direction:column;padding:28px 22px;gap:30px;align-items:stretch}.로그인소개 .마크{margin-bottom:30px}.로그인소개 h1{font-size:27px;line-height:1.5}.보조{font-size:14px;margin-top:14px}.흐름{display:none}.로그인카드{padding:27px 24px;border-radius:21px}.로그인소개>.눈썹{font-size:10px}#앱{display:block}.곁바{height:auto;position:static;border-right:0;border-bottom:1px solid var(--hair2);padding:18px 15px 10px}.곁바 .마크{font-size:25px;margin-left:6px}.브랜드기호{width:31px;height:31px;border-radius:10px}.브랜드기호 svg{width:22px;height:22px}.곁설명,.곁바닥{display:none}.필그룹{flex-direction:row;gap:5px;margin-top:19px;overflow-x:auto}.필그룹 button{flex:1;justify-content:center;padding:12px 8px;font-size:11px;gap:4px}.필그룹 .수{margin-left:0}.탭기호{font-size:13px;width:14px}.윗바{height:53px;padding:0 22px;font-size:11px}.사용자도구{gap:4px}.나가기{font-size:11px}.몸{padding:26px 20px}.페이지머리{align-items:flex-start;gap:12px;margin-bottom:21px}.페이지머리 h1{font-size:25px}.페이지머리 .눈썹{font-size:10px}.페이지머리 .메타{font-size:12px}.페이지머리>.버튼{font-size:12px;padding:10px 12px;min-height:40px;margin-top:20px}.카드{padding:19px 18px;border-radius:16px}.제목줄{font-size:14px}.메타{font-size:11px}.집계카드{padding:22px 20px}.숫자{padding:15px}.숫자 .값{font-size:24px}.겹창{padding:0;align-items:flex-end}.겹창 .판{border-radius:23px 23px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom))}.빈말{padding:45px 22px}.빈말 b{font-size:18px}.꼬리말{padding:6px 22px 25px}}
</style>
</head>
<body>

<!-- ── 로그인 ── -->
<div id="로그인" class="로그인판 숨김">
  <section class="로그인소개">
    <div class="마크"><span class="브랜드기호" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 10v4m5-8v12m5-15v18m5-13v8"/></svg></span>메아리</div>
    <p class="눈썹">국내영업 품질접수 장부</p>
    <h1>현장의 목소리부터,<br>해결의 순간까지.</h1>
    <p class="보조">고객에게 들은 이야기를 남기고,<br>접수부터 완료까지 한곳에서 확인하세요.</p>
    <div class="흐름" aria-hidden="true"><span>현장 접수</span><i>→</i><span>진행 확인</span><i>→</i><span>처리 완료</span></div>
  </section>
  <section class="로그인카드" aria-labelledby="로그인제목">
    <p class="눈썹">현장의 다음을 연결하세요</p><h2 id="로그인제목">메아리에 로그인</h2>
    <p id="로그인탈" class="탈 숨김" role="alert"></p>
    <label class="라벨" for="이름">이름</label>
    <input id="이름" class="글칸" type="text" autocomplete="username" placeholder="이름을 입력해 주세요">
    <label class="라벨" for="핀">PIN</label>
    <input id="핀" class="글칸" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="발급받은 PIN을 입력해 주세요">
    <button id="들어가기" class="버튼" style="margin-top:24px">들어가기</button>
    <a class="접수만" href="index.html?r">로그인 없이 접수만 하기</a>
    <p class="도움">접속 정보는 사내 시스템 담당자에게 문의해 주세요.</p>
  </section>
</div>

<!-- 탭·계정·접수 경로는 유지하고 이음의 앱 레이아웃을 적용한다. -->
<div id="앱" class="숨김">
  <aside class="곁바">
    <a class="마크" href="app.html"><span class="브랜드기호" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 10v4m5-8v12m5-15v18m5-13v8"/></svg></span>메아리</a>
    <p class="곁설명">현장의 목소리를 끝까지 잇다</p>
    <div class="필그룹" id="탭들" role="tablist" aria-label="메아리 메뉴" aria-orientation="vertical"></div>
    <div class="곁바닥"><span class="상태점" aria-hidden="true"></span>국내영업 품질접수 장부</div>
  </aside>
  <div class="작업영역">
    <header class="윗바"><span>메아리 / <span id="현재위치">현황</span></span>
      <div class="사용자도구"><span class="사람"><b id="내이름"></b></span><button class="나가기" id="나가기">나가기</button></div>
    </header>
    <main class="몸">
      <div class="페이지머리"><div><p class="눈썹">현장의 목소리를 끝까지</p><h1 id="화면제목">품질 현황</h1><p class="메타" id="화면설명">접수와 처리 현황을 한눈에 확인하세요.</p></div><a class="버튼" href="index.html?r">＋ 접수</a></div>
      <div id="본문" role="tabpanel" aria-label="현황"></div>
    </main>
    <footer class="꼬리말">메아리 · 국내영업 품질접수 장부</footer>
  </div>
</div>

<div id="로딩" class="빙글" role="status" aria-label="불러오는 중"></div>
<div id="겹창자리"></div>

<script>
'use strict';
var 관문 = 'https://orttfugxziltenujdlme.supabase.co/functions/v1';
var 완료표시최대 = 200;   // 완료 탭에 한 번에 그리는 카드 수. 넘으면 화면에 그렇다고 적는다

var 세션 = null;   // {토큰, 이름, 역할[]}
var 홈 = null;     // meari-data 홈 payload {나, 건들, 조치구분}
var 지금탭 = '';

var $ = function (id) { return document.getElementById(id); };
var 보임 = function (el, 켬) { el.classList.toggle('숨김', !켬); };
var 새기기 = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

/* 한국 날짜로 자른다. UTC로 자르면 오전 9시 이전 건이 전날·전달로 밀린다 */
function 한국날짜(v) {
  if (!v) return '';
  try { return new Date(v).toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); }
  catch (e) { return String(v).slice(0, 10); }
}
function 날짜(v) { var s = 한국날짜(v); return s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : ''; }

function 부르기(길, 몸) {
  return fetch(관문 + 길, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(몸 || {})
  }).then(function (r) { return r.json().then(function (d) { d.상태코드 = r.status; return d; }); });
}

/* ── 세션 ── */
function 세션저장(s) { try { localStorage.setItem('meari.세션', JSON.stringify(s)); } catch (e) {} }
function 세션읽기() { try { return JSON.parse(localStorage.getItem('meari.세션')); } catch (e) { return null; } }
function 나가기() { try { localStorage.removeItem('meari.세션'); } catch (e) {} location.reload(); }

/* ── 로그인 ── */
$('들어가기').onclick = function () {
  var 이름 = $('이름').value.trim(), pin = $('핀').value.trim();
  if (!이름 || !pin) return 로그인탈('이름과 PIN을 넣어 주세요');
  $('들어가기').disabled = true;
  부르기('/meari-login', { 이름: 이름, pin: pin }).then(function (d) {
    $('들어가기').disabled = false;
    if (!d.ok) return 로그인탈(d.이유 || '들어가지 못했습니다');
    세션 = { 토큰: d.토큰, 이름: d.이름, 역할: d.역할 };
    세션저장(세션);
    시작();
  }).catch(function () { $('들어가기').disabled = false; 로그인탈('연결하지 못했습니다'); });
};
$('핀').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('들어가기').click(); });
function 로그인탈(말) { var el = $('로그인탈'); el.textContent = 말; 보임(el, true); }

/* 전체를 보는 사람인가 — 품질담당·대표. 유형(분류) 정정 권한이 여기 걸린다 */
function 전체봄() {
  return 세션.역할.indexOf('품질담당') >= 0 || 세션.역할.indexOf('대표') >= 0;
}

/* ── 건 나누기 ──
   이관 건(0054)은 상태가 「완료」지만 **시계가 없다** — 지연·기한초과·소요일이 전부 null이다.
   그룹웨어에서 옮겨 온 옛 접수라 처리 내역을 모르기 때문이다. 여기서 갈라 두지 않으면
   「제 시간에 완료」가 100%로, 평균 소요일이 0일로 부풀어 오른다.
   유형·병원·제품·월별 추이는 `건들()` 그대로 쓴다 — 그걸 보려고 가져온 것이다. */
function 건들() { return (홈 && 홈.건들) || []; }
function 진행중들() { return 건들().filter(function (g) { return g.상태 === '진행중'; }); }
function 완료들() { return 건들().filter(function (g) { return g.상태 === '완료' && !g.이관; }); }
function 이관들() { return 건들().filter(function (g) { return g.이관; }); }
function 지연들() { return 진행중들().filter(function (g) { return g.지연; }); }

/* 진행중 탭 전용 분류 — 제품 컬럼과 다르다. 큐어젯·노보젯 같은 본체 구분이 아니라
   현장에서 실제로 고장 나는 부위(핸드피스·노즐·풋스위치)로 묶어 달라는 요청(2026-09-01).
   유형 이름에 그 말이 있으면 그 칸으로, 없으면 기타다. 표에 없는 값이라 서버에 안 묻는다. */
function 분류(g) {
  var s = String(g.유형 || '');
  if (s.indexOf('핸드피스') >= 0) return '핸드피스';
  if (s.indexOf('노즐') >= 0) return '노즐';
  if (s.indexOf('풋스위치') >= 0) return '풋스위치';
  return '기타';
}

/* ── 탭 ── */
// 첫 화면은 현황이다 — 열자마자 「지금 품질이 어떤가」가 보여야 한다 (2026-08-29 사용자 요청).
// 진행중이 먼저면 매일 볼 사람에게는 편하지만, 이 장부를 만든 이유인 「무엇이 반복되고
// 제 시간에 처리되는가」가 한 번 더 눌러야 나온다.
function 탭목록() {
  var 탭 = [['현황', '현황'], ['진행중', '진행중'], ['완료', '완료']];
  if (전체봄()) 탭.push(['관리', '관리']);   // 품질담당·대표만 — PIN 재발급
  return 탭;
}

function 탭그리기() {
  var 칸 = $('탭들'); 칸.textContent = '';
  칸.setAttribute('aria-orientation', matchMedia('(max-width:650px)').matches ? 'horizontal' : 'vertical');
  탭목록().forEach(function (t) {
    var b = document.createElement('button');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(t[0] === 지금탭));
    var 수 = (t[0] === '진행중') ? 지연들().length : 0;   // 빨간 숫자는 지연만 — 나머지는 급하지 않다
    b.innerHTML = '<span class="탭기호" aria-hidden="true">' + ({현황:'▦', 진행중:'◷', 완료:'✓', 관리:'⚙'}[t[0]]) + '</span>' + 새기기(t[1]) + (수 ? ' <span class="수">' + 수 + '</span>' : '');
    b.onclick = function () { 지금탭 = t[0]; 탭그리기(); 본문그리기(); };
    칸.appendChild(b);
  });
}

/* ── 시작 ── */
function 시작() {
  보임($('로그인'), false); 보임($('로딩'), true);
  부르기('/meari-data', { 토큰: 세션.토큰 }).then(function (d) {
    보임($('로딩'), false);
    if (!d.ok) { if (d.상태코드 === 401) return 나가기(); throw new Error(); }
    홈 = d;
    $('내이름').textContent = 세션.이름;
    보임($('앱'), true);
    if (!지금탭) 지금탭 = '현황';
    탭그리기(); 본문그리기();
  }).catch(function () {
    보임($('로딩'), false); 보임($('앱'), true);
    $('본문').innerHTML = '<div class="빈말"><b>연결하지 못했습니다</b>잠시 뒤 다시 열어 주세요</div>';
  });
}
function 다시읽기() {
  return 부르기('/meari-data', { 토큰: 세션.토큰 }).then(function (d) {
    if (d.ok) { 홈 = d; 탭그리기(); 본문그리기(); }
  });
}
$('나가기').onclick = 나가기;

/* ── 건 카드 ── */
function 건배지(g) {
  // 이관 건에는 기한도 소요일도 안 찍는다 — 없는 시계를 찍으면 거짓말이 된다
  if (g.이관) return '<span class="표식 회">이관</span>';
  var h = '';
  if (g.상태 === '진행중') {
    if (g.지연) h += '<span class="표식 지연">' + g.지연일수 + '일 늦음</span>';
    else h += '<span class="표식 임박">기한 ' + 날짜(g.기한) + '</span>';
  } else {
    h += '<span class="표식 끝">완료 · ' + g.소요일 + '일</span>';
    if (g.기한초과) h += '<span class="표식 지연">기한 넘김</span>';
    h += '<span class="표식 회면">' + 새기기(g.조치구분) + '</span>';
  }
  return h;
}
function 건줄(g) {
  return '<div class="카드 누름' + (g.지연 ? ' 늦음' : '') + '" data-건="' + g.id + '">' + 건배지(g) +
    '<div class="제목줄">' + 새기기(g.유형) + '</div>' +
    '<div class="메타">' + (g.거래처_표기 ? 새기기(g.거래처_표기) + ' · ' : '') +
    새기기(g.제품) + ' · ' + 새기기(g.등록자_이름) + ' · ' + 날짜(g.등록일시) +
    (g.사진수 ? ' · 사진 ' + g.사진수 : '') + '</div>' +
    '<div class="메타" style="color:var(--body);margin-top:3px">' +
    새기기(String(g.내용_원문).slice(0, 70)) + '</div></div>';
}
function 건줄들걸기(칸) {
  칸.querySelectorAll('[data-건]').forEach(function (el) {
    el.onclick = function () { 건열기(Number(el.dataset.건)); };
  });
}

/* ── 본문 ── */
function 본문그리기() {
  var 머리말 = {
    현황: ['품질 현황', '접수와 처리 현황을 한눈에 확인하세요.'],
    진행중: ['진행 중인 접수', '기한과 증상을 확인하고 해결된 접수를 완료해 주세요.'],
    완료: ['완료된 접수', '처리 결과와 지난 접수 내역을 확인하세요.'],
    관리: ['계정 관리', '담당자 계정과 PIN 발급을 관리하세요.']
  }[지금탭] || ['품질 현황', '접수와 처리 현황을 한눈에 확인하세요.'];
  $('현재위치').textContent = 지금탭;
  $('화면제목').textContent = 머리말[0];
  $('화면설명').textContent = 머리말[1];
  var 몸 = $('본문');
  몸.setAttribute('aria-label', 지금탭);
  if (지금탭 === '진행중') return 진행중그리기(몸);
  if (지금탭 === '완료') return 완료그리기(몸);
  if (지금탭 === '관리') return 관리그리기(몸);
  return 현황그리기(몸);
}

/* ── 관리 (품질담당·대표) ────────────────────────────────────────
   **PIN을 「보여주는」 화면이 아니다.** DB에는 SHA-256 해시만 있어 원래 값을 되돌릴 수 없다.
   관리자가 언제나 할 수 있는 것은 「다시 주기」이고, 새 PIN은 여기서 한 번만 뜬다.
   ────────────────────────────────────────────────────────────── */
function 관리그리기(몸) {
  var 들 = (홈 && 홈.계정들) || [];
  var h = '<div class="안내">PIN은 <b>다시 볼 수 없습니다</b> — 저장된 것이 해시라서 ' +
    '원리적으로 불가능합니다. 잊었거나 새로 주셔야 하면 여기서 <b>다시 발급</b>하세요. ' +
    '새 PIN이 화면에 한 번 뜹니다.</div>' +
    '<div class="구분">계정 ' + 들.length + '명</div>';
  if (!들.length) h += '<div class="빈말"><b>명부를 불러오지 못했습니다</b></div>';
  들.forEach(function (p) {
    var 나 = (p.이름 === (홈.나 || {}).이름);
    h += '<div class="카드">' +
      '<span class="표식 회">' + 새기기(String(p.역할 || '').split(',').join(' · ')) + '</span>' +
      (p.pin있음 ? '' : '<span class="표식 지연">PIN 없음</span>') +
      (나 ? '<span class="표식 끝">나</span>' : '') +
      '<div class="제목줄">' + 새기기(p.이름) + '</div>' +
      '<button class="버튼 흰" data-재발급="' + 새기기(p.이름) + '" style="margin-top:8px">PIN 다시 발급</button>' +
      '</div>';
  });
  몸.innerHTML = h;
  몸.querySelectorAll('[data-재발급]').forEach(function (el) {
    el.onclick = function () { PIN재발급(el.dataset.재발급); };
  });
}

function PIN재발급(이름) {
  var 나인가 = (이름 === (홈.나 || {}).이름);
  var 물음 = 이름 + ' 님의 PIN을 다시 발급합니다.\n지금 쓰던 PIN은 즉시 죽습니다.';
  if (나인가) 물음 += '\n\n본인 것이라 지금 로그인도 끊깁니다.';
  if (!confirm(물음)) return;
  부르기('/meari-act', { 토큰: 세션.토큰, 동작: 'PIN재발급', 대상: 이름 }).then(function (r) {
    if (!r.ok) return alert(r.이유 || '재발급하지 못했습니다');
    PIN보이기(r.이름, r.pin, r.나였다);
    if (!r.나였다) 다시읽기();   // 「PIN 없음」 표시를 갱신한다. 내 것이면 토큰이 죽어 안 부른다
  });
}

function PIN보이기(이름, pin, 나였다) {
  var h = '<div class="구분">' + 새기기(이름) + ' 님의 새 PIN</div>' +
    '<div style="font-size:44px;font-weight:700;letter-spacing:.14em;text-align:center;' +
    'padding:18px 0;font-variant-numeric:tabular-nums">' + 새기기(pin) + '</div>' +
    '<button class="버튼 검정" id="복사" style="width:100%">복사</button>' +
    '<div class="안내">이 창을 닫으면 <b>다시 볼 수 없습니다.</b> 지금 전달하시거나 적어 두세요. ' +
    '옛 PIN은 이미 죽었습니다.</div>';
  if (나였다) {
    h += '<div class="탈" style="margin-top:12px">본인 것을 바꿨습니다 — 지금 로그인이 끊겼습니다.</div>' +
      '<button class="버튼 흰" id="다시로그인" style="width:100%">새 PIN으로 다시 로그인</button>';
  }
  var 판 = 겹창(h);
  판.querySelector('#복사').onclick = function () {
    var b = this;
    if (!navigator.clipboard) { b.textContent = '복사가 안 됩니다 — 손으로 적어 주세요'; return; }
    navigator.clipboard.writeText(pin)
      .then(function () { b.textContent = '복사했습니다'; })
      .catch(function () { b.textContent = '복사가 안 됩니다 — 손으로 적어 주세요'; });
  };
  if (판.querySelector('#다시로그인')) 판.querySelector('#다시로그인').onclick = 나가기;
}

function 진행중그리기(몸) {
  var 전부 = 진행중들();
  var 늦음 = 전부.filter(function (g) { return g.지연; }).length;

  if (!전부.length) {
    몸.innerHTML = '<div class="빈말"><b>진행 중인 접수가 없습니다</b>' +
      '<a href="index.html?r" style="color:var(--ink)">등록 화면</a>에서 올립니다</div>';
    return;
  }

  var h = '<div class="메타" style="margin-bottom:4px">진행 중 ' + 전부.length + '건' +
    (늦음 ? ' · <span style="color:var(--red);font-weight:600">기한 넘김 ' + 늦음 + '건</span>' : '') + '</div>';

  var 분류순서 = ['핸드피스', '노즐', '풋스위치', '기타'];
  분류순서.forEach(function (분류명) {
    var 들 = 전부.filter(function (g) { return 분류(g) === 분류명; }).sort(function (a, b) {
      if (!!a.지연 !== !!b.지연) return a.지연 ? -1 : 1;   // 기한 넘긴 것이 그 안에서 먼저
      return String(a.기한).localeCompare(String(b.기한));
    });
    if (!들.length) return;
    var 그중늦음 = 들.filter(function (g) { return g.지연; }).length;
    h += '<div class="구분">' + 분류명 + ' ' + 들.length + '건' +
      (그중늦음 ? ' <span style="color:var(--red)">· 기한 넘김 ' + 그중늦음 + '건</span>' : '') + '</div>' +
      '<div class="카드목록">' + 들.map(건줄).join('') + '</div>';
  });
  몸.innerHTML = h;
  건줄들걸기(몸);
}

function 잘라그리기(들) {
  var h = '<div class="카드목록">' + 들.slice(0, 완료표시최대).map(건줄).join('') + '</div>';
  // 잘린 것을 조용히 숨기지 않는다 — 몇 건을 안 그렸는지 화면에 적는다
  if (들.length > 완료표시최대) {
    h += '<div class="메타" style="text-align:center;padding:10px 0">최근 ' + 완료표시최대 +
         '건만 그렸습니다 · 나머지 ' + (들.length - 완료표시최대) + '건은 현황 탭의 숫자에 들어 있습니다</div>';
  }
  return h;
}

function 완료그리기(몸) {
  var 들 = 완료들(), 옛것 = 이관들();
  var h = '';
  if (!들.length && !옛것.length) h += '<div class="빈말"><b>완료된 접수가 없습니다</b></div>';
  if (들.length) {

        this.disabled = true;
        행동({ 동작: '관리자완료', 건_id: g.id, 조치구분: 관리자고른구분, 조치내용: 내용, 완료일: 완료일 });
      };
    }
    if (판.querySelector('#되돌리기')) {
      판.querySelector('#되돌리기').onclick = function () {
        this.disabled = true;
        행동({ 동작: '되돌리기', 건_id: g.id });
      };
    }

    function 행동(몸2) {
      몸2.토큰 = 세션.토큰;
      부르기('/meari-act', 몸2).then(function (r) {
        if (!r.ok) {
          alert(r.이유 || '처리하지 못했습니다');
          판.querySelectorAll('button:disabled').forEach(function (b) { b.disabled = false; });
          return;
        }
        겹창닫기(); 다시읽기();
      });
    }
  });
}

/* ── 겹창 ── */
function 겹창(html) {
  var 감 = document.createElement('div');
  감.className = '겹창';
  감.innerHTML = '<div class="판"><div class="닫기줄"><button aria-label="닫기">×</button></div>' + html + '</div>';
  감.onclick = function (e) { if (e.target === 감) 겹창닫기(); };
  감.querySelector('.닫기줄 button').onclick = 겹창닫기;
  $('겹창자리').textContent = '';
  $('겹창자리').appendChild(감);
  return 감;
}
function 겹창닫기() { $('겹창자리').textContent = ''; }

/* ── 진입 ── */
세션 = 세션읽기();
보임($('로딩'), false);
if (세션 && 세션.토큰) { 시작(); } else { 보임($('로그인'), true); }
</script>
