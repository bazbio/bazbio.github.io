<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메아리</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   메아리 앱 — 로그인 화면 (ADR 0028)
   디자인: 혼합안 v2 (2026-08-11 확정). 등록 화면(index.html)과 같은 토큰.
   탭 셋: 현황(첫 화면) · 진행중 · 완료. 역할로 갈리지 않는다 — 열 명 한 팀이 같은 것을 본다.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#111111; --body:#374151; --muted:#6b7280; --faint:#9ca3af;
  --canvas:#ffffff; --grouped:#f7f7f8; --card:#f5f5f6; --hair:#e5e7eb; --hair2:#d1d5db;
  --red:#b42318; --red-bg:#f9f1f0; --amber:#8a6116; --amber-bg:#f9f6ee;
  --청:#4c6b8a; --청-bg:#f1f4f8;
  --r-btn:8px; --r-card:12px; --pill:9999px;
  --곡선:cubic-bezier(0.16,1,0.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--canvas); color:var(--ink);
  font-family:'Pretendard Variable','Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:15px; line-height:1.55; letter-spacing:-.01em;
  word-break:keep-all; overflow-wrap:break-word;
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit; color:inherit; letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:var(--r-btn)}
.숨김{display:none !important}

/* ── 상단바 ── */
.윗바{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:14px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(255,255,255,.92); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--hair);
}
.윗바 .마크{font-size:16px; font-weight:600; letter-spacing:-.02em}
.윗바 .사람{margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap}
.윗바 .사람 b{color:var(--ink); font-weight:600}
.윗바 .나가기{background:none; border:none; color:var(--faint); font-size:12.5px; cursor:pointer; padding:4px}

/* pill-in-pill 탭 */
.필그룹{display:flex; gap:2px; background:#ececee; border-radius:var(--pill); padding:3px;
        overflow-x:auto; scrollbar-width:none}
.필그룹::-webkit-scrollbar{display:none}
.필그룹 button{
  flex:0 0 auto; border:none; background:transparent; cursor:pointer;
  font-size:13px; font-weight:500; color:var(--muted);
  padding:7px 15px; border-radius:var(--pill); white-space:nowrap;
  transition:color .18s var(--곡선);
}
.필그룹 button[aria-selected="true"]{background:#fff; color:var(--ink); font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.1)}
.필그룹 .수{color:var(--red); font-weight:700; margin-left:3px}

/* ── 몸 ── */
.몸{max-width:760px; margin:0 auto; padding:16px 16px 80px}
.구분{font-size:12px; font-weight:600; color:var(--muted); margin:22px 0 8px;
      display:flex; align-items:center; gap:10px}
.구분:after{content:''; flex:1; height:1px; background:var(--hair)}
.카드{background:#fff; border:1px solid var(--hair); border-radius:var(--r-card);
      padding:14px 16px; margin-bottom:10px}
.카드.누름{cursor:pointer; transition:border-color .18s var(--곡선)}
.카드.누름:active{transform:scale(.995)}
.카드.요약{background:var(--card); border-color:transparent}
.카드.늦음{border-color:#e6cfcb; background:var(--red-bg)}
.메타{font-size:12.5px; color:var(--muted)}
.제목줄{font-size:15px; font-weight:600; letter-spacing:-.015em; margin:2px 0}
.빈말{color:var(--muted); text-align:center; padding:44px 0 36px; font-size:14px}
.빈말 b{display:block; font-size:18px; font-weight:600; letter-spacing:-.02em; color:var(--ink); margin-bottom:5px}

/* 배지 */
.표식{display:inline-block; font-size:11.5px; font-weight:600; padding:2.5px 10px;
      border-radius:var(--pill); vertical-align:1px; margin-right:3px}
.표식.지연{background:var(--red); color:#fff}
.표식.임박{background:var(--amber-bg); color:var(--amber); border:1px solid #e6dbb8}
.표식.끝{background:var(--청-bg); color:var(--청); border:1px solid #ccd9e4}
.표식.회{background:#fff; color:var(--muted); border:1px solid var(--hair)}
.표식.회면{background:var(--card); color:var(--body); border:1px solid transparent}

/* 숫자 타일 */
.숫자들{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:4px 0 6px}
.숫자{background:#fff; border:1px solid var(--hair); border-radius:var(--r-card);
      padding:14px 10px 12px; text-align:center}
.숫자 .값{font-size:28px; font-weight:700; letter-spacing:-.04em; line-height:1.05}
.숫자 .값.빨{color:var(--red)} .숫자 .값.주{color:var(--amber)}
.숫자 .이름{font-size:11.5px; color:var(--muted); font-weight:500; margin-top:3px}
.숫자 .꼬리{font-size:11px; color:var(--faint); margin-top:1px}
.숫자.경보{background:var(--red-bg); border-color:#e6cfcb}
@media(max-width:520px){ .숫자들{grid-template-columns:repeat(2,1fr)} }

/* 가로 막대 — 유형·조치구분·거래처 */
.막대줄{display:grid; grid-template-columns:minmax(76px,32%) 1fr 46px; gap:10px;
        align-items:center; margin-bottom:7px; font-size:12.5px}
.막대줄 .이름{color:var(--body); text-align:right; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap}
.막대통{background:var(--card); border-radius:var(--pill); height:20px; overflow:hidden}
.막대통 i{display:block; background:var(--청); height:100%; border-radius:var(--pill); min-width:3px}
.막대통 i.빨{background:var(--red)}
.막대줄 .값{font-weight:600; color:var(--ink); text-align:right}
.막대줄 .값 span{font-weight:400; color:var(--faint); font-size:11px}

/* 세로 추이 — 월별 */
.추이{display:flex; gap:8px; align-items:flex-end; height:132px; margin:6px 0 2px;
      padding:0 2px; overflow-x:auto; scrollbar-width:none}
.추이::-webkit-scrollbar{display:none}
.기둥{flex:1 0 34px; display:flex; flex-direction:column; align-items:center;
      justify-content:flex-end; height:100%; gap:4px}
.기둥 b{font-size:11.5px; font-weight:600; color:var(--ink)}
.기둥 i{display:block; width:100%; background:var(--청); border-radius:4px 4px 0 0; min-height:2px}
.기둥 i.늦{background:var(--red)}
.기둥 em{font-style:normal; font-size:11px; color:var(--faint)}

/* 버튼·입력 */
.버튼{display:inline-flex; align-items:center; justify-content:center; border-radius:var(--r-btn);
      font-size:14px; font-weight:600; padding:10px 18px; letter-spacing:-.01em;
      border:none; cursor:pointer; transition:transform .18s var(--곡선), opacity .18s var(--곡선)}
.버튼:active:not(:disabled){transform:scale(.97)}
.버튼:disabled{opacity:.45; cursor:default}
.버튼.검정{background:var(--ink); color:#fff}
.버튼.흰{background:#fff; color:var(--ink); border:1px solid var(--hair2)}
.버튼.빨글{background:#fff; color:var(--red); border:1px solid var(--hair2)}
.글칸{width:100%; min-height:46px; padding:11px 13px; background:#fff;
      border:1px solid var(--hair); border-radius:var(--r-btn);
      transition:border-color .2s var(--곡선), box-shadow .2s var(--곡선)}
.글칸:focus{border-color:var(--ink); box-shadow:0 0 0 3px rgba(17,17,17,.06); outline:none}
textarea.글칸{min-height:88px; resize:vertical; line-height:1.6}
.알약들{display:flex; flex-wrap:wrap; gap:7px}
.알{min-height:42px; padding:0 15px; background:#fff; color:var(--body);
    border:1px solid var(--hair2); border-radius:var(--r-btn);
    font-size:13.5px; font-weight:500; cursor:pointer;
    transition:transform .18s var(--곡선), background-color .18s var(--곡선), color .18s var(--곡선)}
.알:active{transform:scale(.97)}
.알[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff; font-weight:600}
.라벨{display:block; font-size:12.5px; font-weight:600; color:var(--body); margin:14px 2px 6px}
.안내{font-size:12.5px; color:var(--muted); background:var(--card); border-radius:var(--r-btn);
      padding:9px 13px; margin-top:10px}
.탈{margin:0 0 14px; padding:10px 14px; border-radius:var(--r-btn); font-size:13.5px; font-weight:500;
    background:var(--red-bg); color:var(--red); border:1px solid #e6cfcb}

/* 사진 */
.사진띠{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.사진띠 img{width:72px; height:72px; object-fit:cover; border-radius:var(--r-btn);
            border:1px solid var(--hair); cursor:pointer}

/* 상세 겹창 */
.겹창{position:fixed; inset:0; z-index:50; background:rgba(17,17,17,.32); display:flex;
      align-items:flex-end; justify-content:center}
.겹창 .판{background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:760px;
          max-height:88vh; overflow-y:auto; padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
.겹창 .닫기줄{display:flex; justify-content:flex-end; margin-bottom:2px}
.겹창 .닫기줄 button{background:var(--card); border:none; border-radius:50%; width:30px; height:30px;
                     font-size:15px; color:var(--muted); cursor:pointer}
@media(min-width:640px){
  .겹창{align-items:center; padding:24px}
  .겹창 .판{border-radius:16px; max-height:82vh}
}

/* 로그인 */
.로그인판{max-width:360px; margin:0 auto; padding:80px 24px}
.로그인판 h1{font-size:28px; font-weight:600; letter-spacing:-.03em; margin:0 0 4px}
.로그인판 .보조{color:var(--muted); font-size:14px; margin:0 0 28px}

table.표{width:100%; border-collapse:collapse; font-size:13px; background:#fff;
         border:1px solid var(--hair); border-radius:var(--r-card); overflow:hidden}
table.표 th{font-size:11.5px; color:var(--muted); font-weight:600; text-align:left;
            padding:8px 10px; border-bottom:1px solid var(--hair); background:#fafafa}
table.표 td{padding:9px 10px; border-bottom:1px solid var(--hair); vertical-align:top}
table.표 tr:last-child td{border-bottom:none}
table.표 td.수{text-align:right; font-weight:600}
.표감{border-radius:var(--r-card); overflow-x:auto}

.빙글{width:24px; height:24px; margin:80px auto; border:2.5px solid var(--hair);
      border-top-color:var(--ink); border-radius:50%; animation:돈다 .7s linear infinite}
@keyframes 돈다{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}
</style>
</head>
<body>

<!-- ── 로그인 ── -->
<div id="로그인" class="로그인판 숨김">
  <h1>메아리</h1>
  <p class="보조">국내영업 품질접수 장부</p>
  <p id="로그인탈" class="탈 숨김" role="alert"></p>
  <label class="라벨" for="이름">이름</label>
  <input id="이름" class="글칸" type="text" autocomplete="username">
  <label class="라벨" for="핀">PIN</label>
  <input id="핀" class="글칸" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
  <button id="들어가기" class="버튼 검정" style="width:100%;margin-top:20px;padding:13px">들어가기</button>
</div>

<!-- ── 앱 ── -->
<div id="앱" class="숨김">
  <div class="윗바">
    <span class="마크">메아리</span>
    <div class="필그룹" id="탭들" role="tablist"></div>
    <span class="사람"><b id="내이름"></b></span>
    <button class="나가기" id="나가기">나가기</button>
  </div>
  <main class="몸" id="본문"></main>
</div>

<div id="로딩" class="빙글" role="status" aria-label="불러오는 중"></div>
<div id="겹창자리"></div>

<script>
'use strict';
var 관문 = 'https://orttfugxziltenujdlme.supabase.co/functions/v1';
var 완료표시최대 = 200;   // 완료 탭에 한 번에 그리는 카드 수. 넘으면 화면에 그렇다고 적는다

var 세션 = null;   // {토큰, 이름, 역할[]}
var 홈 = null;     // meari-data 홈 payload {나, 건들, 조치구분}
var 지금탭 = '';

var $ = function (id) { return document.getElementById(id); };
var 보임 = function (el, 켬) { el.classList.toggle('숨김', !켬); };
var 새기기 = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

/* 한국 날짜로 자른다. UTC로 자르면 오전 9시 이전 건이 전날·전달로 밀린다 */
function 한국날짜(v) {
  if (!v) return '';
  try { return new Date(v).toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); }
  catch (e) { return String(v).slice(0, 10); }
}
function 날짜(v) { var s = 한국날짜(v); return s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : ''; }

function 부르기(길, 몸) {
  return fetch(관문 + 길, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(몸 || {})
  }).then(function (r) { return r.json().then(function (d) { d.상태코드 = r.status; return d; }); });
}

/* ── 세션 ── */
function 세션저장(s) { try { localStorage.setItem('meari.세션', JSON.stringify(s)); } catch (e) {} }
function 세션읽기() { try { return JSON.parse(localStorage.getItem('meari.세션')); } catch (e) { return null; } }
function 나가기() { try { localStorage.removeItem('meari.세션'); } catch (e) {} location.reload(); }

/* ── 로그인 ── */
$('들어가기').onclick = function () {
  var 이름 = $('이름').value.trim(), pin = $('핀').value.trim();
  if (!이름 || !pin) return 로그인탈('이름과 PIN을 넣어 주세요');
  $('들어가기').disabled = true;
  부르기('/meari-login', { 이름: 이름, pin: pin }).then(function (d) {
    $('들어가기').disabled = false;
    if (!d.ok) return 로그인탈(d.이유 || '들어가지 못했습니다');
    세션 = { 토큰: d.토큰, 이름: d.이름, 역할: d.역할 };
    세션저장(세션);
    시작();
  }).catch(function () { $('들어가기').disabled = false; 로그인탈('연결하지 못했습니다'); });
};
$('핀').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('들어가기').click(); });
function 로그인탈(말) { var el = $('로그인탈'); el.textContent = 말; 보임(el, true); }

/* 전체를 보는 사람인가 — 품질담당·대표. 유형(분류) 정정 권한이 여기 걸린다 */
function 전체봄() {
  return 세션.역할.indexOf('품질담당') >= 0 || 세션.역할.indexOf('대표') >= 0;
}

/* ── 건 나누기 ── */
function 건들() { return (홈 && 홈.건들) || []; }
function 진행중들() { return 건들().filter(function (g) { return g.상태 === '진행중'; }); }
function 완료들() { return 건들().filter(function (g) { return g.상태 === '완료'; }); }
function 지연들() { return 진행중들().filter(function (g) { return g.지연; }); }

/* ── 탭 ── */
// 첫 화면은 현황이다 — 열자마자 「지금 품질이 어떤가」가 보여야 한다 (2026-08-29 사용자 요청).
// 진행중이 먼저면 매일 볼 사람에게는 편하지만, 이 장부를 만든 이유인 「무엇이 반복되고
// 제 시간에 처리되는가」가 한 번 더 눌러야 나온다.
var 탭목록 = [['현황', '현황'], ['진행중', '진행중'], ['완료', '완료']];

function 탭그리기() {
  var 칸 = $('탭들'); 칸.textContent = '';
  탭목록.forEach(function (t) {
    var b = document.createElement('button');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(t[0] === 지금탭));
    var 수 = (t[0] === '진행중') ? 지연들().length : 0;   // 빨간 숫자는 지연만 — 나머지는 급하지 않다
    b.innerHTML = 새기기(t[1]) + (수 ? ' <span class="수">' + 수 + '</span>' : '');
    b.onclick = function () { 지금탭 = t[0]; 탭그리기(); 본문그리기(); };
    칸.appendChild(b);
  });
}

/* ── 시작 ── */
function 시작() {
  보임($('로그인'), false); 보임($('로딩'), true);
  부르기('/meari-data', { 토큰: 세션.토큰 }).then(function (d) {
    보임($('로딩'), false);
    if (!d.ok) { if (d.상태코드 === 401) return 나가기(); throw new Error(); }
    홈 = d;
    $('내이름').textContent = 세션.이름;
    보임($('앱'), true);
    if (!지금탭) 지금탭 = '현황';
    탭그리기(); 본문그리기();
  }).catch(function () {
    보임($('로딩'), false); 보임($('앱'), true);
    $('본문').innerHTML = '<div class="빈말"><b>연결하지 못했습니다</b>잠시 뒤 다시 열어 주세요</div>';
  });
}
function 다시읽기() {
  return 부르기('/meari-data', { 토큰: 세션.토큰 }).then(function (d) {
    if (d.ok) { 홈 = d; 탭그리기(); 본문그리기(); }
  });
}
$('나가기').onclick = 나가기;

/* ── 건 카드 ── */
function 건배지(g) {
  var h = '';
  if (g.상태 === '진행중') {
    if (g.지연) h += '<span class="표식 지연">' + g.지연일수 + '일 늦음</span>';
    else h += '<span class="표식 임박">기한 ' + 날짜(g.기한) + '</span>';
  } else {
    h += '<span class="표식 끝">완료 · ' + g.소요일 + '일</span>';
    if (g.기한초과) h += '<span class="표식 지연">기한 넘김</span>';
    h += '<span class="표식 회면">' + 새기기(g.조치구분) + '</span>';
  }
  return h;
}
function 건줄(g) {
  return '<div class="카드 누름' + (g.지연 ? ' 늦음' : '') + '" data-건="' + g.id + '">' + 건배지(g) +
    '<div class="제목줄">' + 새기기(g.유형) + '</div>' +
    '<div class="메타">' + (g.거래처_표기 ? 새기기(g.거래처_표기) + ' · ' : '') +
    새기기(g.제품) + ' · ' + 새기기(g.등록자_이름) + ' · ' + 날짜(g.등록일시) +
    (g.사진수 ? ' · 사진 ' + g.사진수 : '') + '</div>' +
    '<div class="메타" style="color:var(--body);margin-top:3px">' +
    새기기(String(g.내용_원문).slice(0, 70)) + '</div></div>';
}
function 건줄들걸기(칸) {
  칸.querySelectorAll('[data-건]').forEach(function (el) {
    el.onclick = function () { 건열기(Number(el.dataset.건)); };
  });
}

/* ── 본문 ── */
function 본문그리기() {
  var 몸 = $('본문');
  if (지금탭 === '진행중') return 진행중그리기(몸);
  if (지금탭 === '완료') return 완료그리기(몸);
  return 현황그리기(몸);
}

function 진행중그리기(몸) {
  var 늦은것 = 지연들();
  var 남은것 = 진행중들().filter(function (g) { return !g.지연; })
    .sort(function (a, b) { return String(a.기한).localeCompare(String(b.기한)); });

  var h = '';
  if (!늦은것.length && !남은것.length) {
    h += '<div class="빈말"><b>진행 중인 접수가 없습니다</b>' +
         '<a href="index.html" style="color:var(--ink)">등록 화면</a>에서 올립니다</div>';
  }
  if (늦은것.length) {
    h += '<div class="구분">기한을 넘겼습니다 ' + 늦은것.length + '건</div>';
    늦은것.sort(function (a, b) { return b.지연일수 - a.지연일수; }).forEach(function (g) { h += 건줄(g); });
  }
  if (남은것.length) {
    h += '<div class="구분">진행 중 ' + 남은것.length + '건 — 기한이 가까운 것부터</div>';
    남은것.forEach(function (g) { h += 건줄(g); });
  }
  몸.innerHTML = h;
  건줄들걸기(몸);
}

function 완료그리기(몸) {
  var 들 = 완료들();
  var h = '';
  if (!들.length) h += '<div class="빈말"><b>완료된 접수가 없습니다</b></div>';
  else {
    h += '<div class="구분">완료 ' + 들.length + '건</div>';
    들.slice(0, 완료표시최대).forEach(function (g) { h += 건줄(g); });
    // 잘린 것을 조용히 숨기지 않는다 — 몇 건을 안 그렸는지 화면에 적는다
    if (들.length > 완료표시최대) {
      h += '<div class="메타" style="text-align:center;padding:10px 0">최근 ' + 완료표시최대 +
           '건만 그렸습니다 · 나머지 ' + (들.length - 완료표시최대) + '건은 현황 탭의 숫자에 들어 있습니다</div>';
    }
  }
  몸.innerHTML = h;
  건줄들걸기(몸);
}

/* ── 현황 (첫 화면) ──────────────────────────────────────────────
   집계는 전부 여기서 한다. 관문은 건을 그대로 주고 화면이 센다 —
   새 각도로 보고 싶을 때 관문을 안 고쳐도 되게.
   ────────────────────────────────────────────────────────────── */
function 세기(들, 뽑기) {
  var m = {};
  들.forEach(function (g) { var k = 뽑기(g); if (k) m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).map(function (k) { return { 이름: k, 수: m[k] }; })
    .sort(function (a, b) { return b.수 - a.수; });
}

function 막대들(줄들, 전체, 빨간것) {
  if (!줄들.length) return '<div class="메타">아직 없습니다.</div>';
  var 최대 = 줄들[0].수 || 1;
  return 줄들.map(function (r) {
    var 몫 = 전체 ? Math.round(r.수 * 1000 / 전체) / 10 : 0;
    return '<div class="막대줄"><span class="이름">' + 새기기(r.이름) + '</span>' +
      '<span class="막대통"><i class="' + (빨간것 === r.이름 ? '빨' : '') + '" style="width:' +
      Math.max(2, Math.round(r.수 * 100 / 최대)) + '%"></i></span>' +
      '<span class="값">' + r.수 + '<span> ' + 몫 + '%</span></span></div>';
  }).join('');
}

function 현황그리기(몸) {
  var 전부 = 건들(), 진행 = 진행중들(), 완료 = 완료들(), 늦음 = 지연들();
  if (!전부.length) {
    몸.innerHTML = '<div class="빈말"><b>아직 쌓인 접수가 없습니다</b>' +
      '건이 올라오면 유형·처리속도·헛걸음 비율이 여기 나옵니다</div>';
    return;
  }

  var 이번달키 = 한국날짜(new Date()).slice(0, 7);
  var 이번달 = 전부.filter(function (g) { return 한국날짜(g.등록일시).slice(0, 7) === 이번달키; });

  var 기한내 = 완료.filter(function (g) { return !g.기한초과; });
  var 제시간율 = 완료.length ? Math.round(기한내.length * 100 / 완료.length) : null;
  var 소요합 = 완료.reduce(function (s, g) { return s + (Number(g.소요일) || 0); }, 0);
  var 평균소요 = 완료.length ? Math.round(소요합 * 10 / 완료.length) / 10 : null;

  var h = '<div class="숫자들">' +
    '<div class="숫자"><div class="값">' + 이번달.length + '</div><div class="이름">이번 달 접수</div>' +
      '<div class="꼬리">누적 ' + 전부.length + '</div></div>' +
    '<div class="숫자"><div class="값">' + 진행.length + '</div><div class="이름">진행 중</div>' +
      '<div class="꼬리">완료 ' + 완료.length + '</div></div>' +
    '<div class="숫자' + (늦음.length ? ' 경보' : '') + '"><div class="값' + (늦음.length ? ' 빨' : '') + '">' +
      늦음.length + '</div><div class="이름">기한 넘김</div>' +
      '<div class="꼬리">5영업일 기준</div></div>' +
    '<div class="숫자"><div class="값">' + (제시간율 === null ? '—' : 제시간율 + '%') + '</div>' +
      '<div class="이름">제 시간에 완료</div>' +
      '<div class="꼬리">' + (평균소요 === null ? '완료 0건' : '평균 ' + 평균소요 + '일') + '</div></div>' +
    '</div>';

  /* 월별 추이 — 최근 12개월. 막대 안의 빨강은 그달 접수 중 기한을 넘긴 것 */
  var 달묶음 = {};
  전부.forEach(function (g) {
    var k = 한국날짜(g.등록일시).slice(0, 7);
    if (!달묶음[k]) 달묶음[k] = { 계: 0, 늦: 0 };
    달묶음[k].계++;
    if (g.지연 || g.기한초과) 달묶음[k].늦++;
  });
  var 달들 = Object.keys(달묶음).sort().slice(-12);
  var 달최대 = 달들.reduce(function (m, k) { return Math.max(m, 달묶음[k].계); }, 1);
  h += '<div class="구분">월별 접수 — 최근 ' + 달들.length + '개월</div><div class="추이">' +
    달들.map(function (k) {
      var v = 달묶음[k];
      var 높이 = Math.max(2, Math.round(v.계 * 100 / 달최대));
      var 늦높이 = v.계 ? Math.round(높이 * v.늦 / v.계) : 0;
      return '<div class="기둥"><b>' + v.계 + '</b>' +
        '<i style="height:' + (높이 - 늦높이) + '%"></i>' +
        (늦높이 ? '<i class="늦" style="height:' + 늦높이 + '%;border-radius:0 0 4px 4px;margin-top:-4px"></i>' : '') +
        '<em>' + Number(k.slice(5, 7)) + '월</em></div>';
    }).join('') + '</div>' +
    '<div class="메타">빨간 부분이 기한을 넘긴 건입니다.</div>';

  /* 유형 — 무엇이 반복되는가 */
  h += '<div class="구분">증상 유형</div>' + 막대들(세기(전부, function (g) { return g.유형; }), 전부.length);

  /* 조치구분 — 헛걸음이 얼마나인가. 이 표의 존재 이유 */
  if (완료.length) {
    h += '<div class="구분">어떻게 처리됐나 — 완료 ' + 완료.length + '건</div>' +
      막대들(세기(완료, function (g) { return g.조치구분; }), 완료.length, '이상없음') +
      '<div class="메타">「이상없음」은 방문했으나 문제가 없던 건입니다 — ' +
      '2026 상반기 CS 원장에서는 594건 중 188건(32%)이었습니다.</div>';
  }

  /* 거래처 — 같은 병원이 반복되는가 */
  var 거래처 = 세기(전부, function (g) { return g.거래처_표기; }).filter(function (r) { return r.수 >= 2; });
  if (거래처.length) {
    h += '<div class="구분">두 번 이상 올라온 병원</div>' +
      막대들(거래처.slice(0, 15), 전부.length);
  }

  /* 제품 */
  h += '<div class="구분">제품</div>' + 막대들(세기(전부, function (g) { return g.제품; }), 전부.length);

  몸.innerHTML = h;
}

/* ── 알약 무리 ── */
function 무리(칸, 값들, 처음, 골랐다) {
  var 고른 = 처음;
  function 그리기() {
    칸.textContent = '';
    값들.forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = '알'; b.textContent = v;
      b.setAttribute('aria-pressed', String(v === 고른));
      b.onclick = function () { 고른 = v; 골랐다(v); 그리기(); };
      칸.appendChild(b);
    });
  }
  그리기();
}

/* ── 건 상세 ── */
function 건열기(건_id) {
  부르기('/meari-data', { 토큰: 세션.토큰, 보기: '건', 건_id: 건_id }).then(function (d) {
    if (!d.ok) return alert(d.이유 === '없음' ? '없는 건입니다' : '불러오지 못했습니다');
    var g = d.건;

    var h = 건배지(g) +
      '<div style="font-size:18px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px">' +
      새기기(g.유형) + ' · ' + 새기기(g.제품) + '</div>' +
      '<div class="메타">' + (g.거래처_표기 ? 새기기(g.거래처_표기) + ' · ' : '') +

      '<div style="font-size:15px;margin-top:10px;white-space:pre-wrap">' + 새기기(g.내용_원문) + '</div>';
    if (g.특이사항) h += '<div class="안내">특이사항 — ' + 새기기(g.특이사항) + '</div>';
    if (g.연락처) h += '<div class="메타" style="margin-top:6px">연락처 ' +
      '<a href="tel:' + 새기기(g.연락처) + '" style="color:var(--ink)">' + 새기기(g.연락처) + '</a></div>';

    if ((d.사진 || []).length) {
      h += '<div class="사진띠">' + d.사진.map(function (p) {
        if (p.동영상) return '<video src="' + p.url + '" controls preload="metadata" style="width:100%;max-width:340px;border-radius:8px;border:1px solid var(--hair)"></video>';
        return '<a href="' + p.url + '" target="_blank" rel="noopener"><img src="' + p.url + '" alt="사진 ' + p.순번 + '"></a>';
      }).join('') + '</div>';
    }

    if (g.상태 === '완료') {
      h += '<div class="구분">처리 결과</div>' +
        '<div class="카드 요약"><span class="표식 회">' + 새기기(g.조치구분) + '</span>' +
        '<span class="표식 회면">' + 날짜(g.완료일시) + ' 완료 · ' + g.소요일 + '일 걸림</span>' +
        '<div style="font-size:14px;margin-top:5px">' + 새기기(g.조치내용) + '</div></div>';
      if (d.내건) {
        h += '<button class="버튼 빨글" id="되돌리기" style="margin-top:12px">잘못 눌렀습니다 — 진행 중으로 되돌리기</button>';
      }
    } else if (d.내건) {
      h += '<div class="구분">해결됐다면</div>' +
        '<span class="라벨">어떻게 처리했습니까</span><div class="알약들" id="구분무리"></div>' +
        '<span class="라벨">한 줄로 적어 주세요</span>' +
        '<input id="조치내용" class="글칸" placeholder="예) 핸드피스 교체, 9/2 방문">' +
        '<button class="버튼 검정" id="완료하기" style="margin-top:12px;width:100%">완료로 닫기</button>' +
        '<div class="안내">닫는 것은 올린 사람만 할 수 있습니다. 잘못 닫아도 되돌릴 수 있습니다.</div>';
    } else {
      h += '<div class="안내">이 건은 ' + 새기기(g.등록자_이름) + ' 님이 올렸습니다 — 닫는 것은 올린 사람만 합니다.</div>';
    }

    // 유형 고치기. 완료된 건도 고칠 수 있다 — 분류 정정이지 상태 변경이 아니다.
    // 맨 아래에 둔다: 이 겹창의 주된 일은 완료를 찍는 것이고, 유형 정정은 가끔 하는 일이다.
    var 유형고침 = d.내건 || 전체봄();
    if (유형고침) {
      h += '<div class="구분">증상 유형 — 잘못 골랐으면 고칩니다</div>' +
        '<div class="알약들" id="유형무리"></div>' +
        '<button class="버튼 흰" id="유형저장" style="margin-top:12px" disabled>다른 유형을 고르면 바뀝니다</button>';
    }

    var 판 = 겹창(h);

    if (판.querySelector('#유형무리')) {
      var 고른유형 = g.유형;
      var 유형저장 = 판.querySelector('#유형저장');
      무리(판.querySelector('#유형무리'), (홈.유형 || []), g.유형, function (v) {
        고른유형 = v;
        유형저장.disabled = (v === g.유형);
        유형저장.textContent = (v === g.유형) ? '다른 유형을 고르면 바뀝니다' : '이 유형으로 바꾸기';
      });
      유형저장.onclick = function () {
        this.disabled = true;
        행동({ 동작: '유형변경', 건_id: g.id, 유형: 고른유형 });
      };
    }

    if (판.querySelector('#구분무리')) {
      var 고른구분 = '';
      무리(판.querySelector('#구분무리'), (홈.조치구분 || []), '', function (v) { 고른구분 = v; });
      판.querySelector('#완료하기').onclick = function () {
        var 내용 = 판.querySelector('#조치내용').value.trim();
        if (!고른구분) return alert('어떻게 처리했는지 골라 주세요');
        if (!내용) return alert('어떻게 해결됐는지 한 줄 적어 주세요');
        this.disabled = true;
        행동({ 동작: '완료', 건_id: g.id, 조치구분: 고른구분, 조치내용: 내용 });
      };
    }
    if (판.querySelector('#되돌리기')) {
      판.querySelector('#되돌리기').onclick = function () {
        this.disabled = true;
        행동({ 동작: '되돌리기', 건_id: g.id });
      };
    }

    function 행동(몸2) {
      몸2.토큰 = 세션.토큰;
      부르기('/meari-act', 몸2).then(function (r) {
        if (!r.ok) {
          alert(r.이유 || '처리하지 못했습니다');
          판.querySelectorAll('button:disabled').forEach(function (b) { b.disabled = false; });
          return;
        }
        겹창닫기(); 다시읽기();
      });
    }
  });
}

/* ── 겹창 ── */
function 겹창(html) {
  var 감 = document.createElement('div');
  감.className = '겹창';
  감.innerHTML = '<div class="판"><div class="닫기줄"><button aria-label="닫기">×</button></div>' + html + '</div>';
  감.onclick = function (e) { if (e.target === 감) 겹창닫기(); };
  감.querySelector('.닫기줄 button').onclick = 겹창닫기;
  $('겹창자리').textContent = '';
  $('겹창자리').appendChild(감);
  return 감;
}
function 겹창닫기() { $('겹창자리').textContent = ''; }

/* ── 진입 ── */
세션 = 세션읽기();
보임($('로딩'), false);
if (세션 && 세션.토큰) { 시작(); } else { 보임($('로그인'), true); }
</script>
