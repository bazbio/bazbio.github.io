<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>등대 — 경영 현황</title>
<meta name="theme-color" content="#0E7490">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 토큰 — Toss 톤 (결정_매출탭_260806 ⑥: 등대 전체 통일) ===== */
:root{
  --bg:#F9FAFB; --surface:#FFFFFF;
  --ink:#191F28; --ink-2:#4E5968; --ink-3:#8B95A1;
  --blue:#3182F6; --blue-bg:#EBF3FE;
  --sig-green:#008A50; --sig-amber:#C77D0A; --sig-red:#E0333C;
  --sig-green-bg:#E6F5EE; --sig-amber-bg:#FBF1E1; --sig-red-bg:#FCEBEC;
  --hairline:#F2F4F6; --line:#E5E8EB;
  --r-sm:10px; --r-md:16px; --r-pill:999px;
  --shadow:0 20px 60px -15px rgba(25,31,40,.06);
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:14px; line-height:1.5; letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}

/* ===== 껍데기 ===== */
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-0.02em}
header.top .sub{color:var(--ink-3);font-size:12.5px}
header.top .spacer{flex:1}

/* 탭 — 밑줄형 */
.tabs{display:flex;gap:2px;margin-left:6px}
.tabs button{
  position:relative;border:0;background:none;font:inherit;
  font-size:15px;font-weight:600;color:var(--ink-3);
  padding:8px 12px;min-height:44px;cursor:pointer;border-radius:var(--r-sm);
  transition:color .2s var(--ease);
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{
  content:'';position:absolute;left:12px;right:12px;bottom:4px;height:2px;
  border-radius:2px;background:var(--blue);
}
.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.seg{display:inline-flex;background:var(--hairline);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;color:var(--ink-2);
  font:inherit;font-size:13px;font-weight:600;
  padding:6px 14px;border-radius:var(--r-pill);cursor:pointer;
  min-height:34px;transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--blue);box-shadow:0 1px 3px rgba(25,31,40,.10)}
.seg button:active{transform:scale(.98)}
.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px}

/* ===== 표 (손익·매출 공용) ===== */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.pl{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;font-size:13px}
table.pl th,table.pl td{padding:7px 10px;white-space:nowrap;border-bottom:1px solid var(--hairline)}
table.pl thead th{
  position:sticky;top:0;z-index:2;background:var(--surface);
  color:var(--ink-3);font-size:11.5px;font-weight:600;text-align:right;
}
table.pl thead th:first-child{text-align:left;left:0;z-index:3}
table.pl td:first-child,table.pl th:first-child{
  position:sticky;left:0;background:var(--surface);text-align:left;
  min-width:150px;box-shadow:1px 0 0 var(--hairline);
}
table.pl td{text-align:right}
table.pl tbody tr:hover td{background:var(--bg)}
table.pl tbody tr:hover td:first-child{background:var(--bg)}

.r-total>td{font-weight:700;background:#F7F9FB}
.r-total>td:first-child{background:#F7F9FB}
.r-op>td{font-weight:700;border-top:2px solid var(--ink);background:#F7F9FB}
.r-op>td:first-child{background:#F7F9FB}
.r-child>td:first-child{padding-left:26px;color:var(--ink-2)}
.r-leaf>td{color:var(--ink-2);font-size:12.5px}
.r-leaf>td:first-child{padding-left:40px}
.r-leaf2>td{color:var(--ink-2);font-size:12.5px}
.r-leaf2>td:first-child{padding-left:54px}

/* 펼침 단추 — 행 제목 자리를 통째로 쓴다 */
.toggle{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:0;font:inherit;color:inherit;cursor:pointer;
  padding:4px 2px;min-height:32px;border-radius:var(--r-sm);
}
.toggle:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.toggle .chev{
  width:14px;height:14px;flex:none;color:var(--ink-3);
  transition:transform .2s var(--ease);
}
.toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}

.share{color:var(--ink-3);font-size:11.5px;margin-left:5px}
.neg{color:var(--sig-red)}
.adj{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--sig-amber);margin-left:5px;vertical-align:middle;
}
.rate{font-weight:600}
.rate.g{color:var(--sig-green)} .rate.a{color:var(--sig-amber)} .rate.r{color:var(--sig-red)}
.muted{color:var(--ink-3)}

/* ===== 로그인 · 상태 ===== */
.center{max-width:360px;margin:56px auto}
.center h2{font-size:17px;margin:0 0 4px}
.center p{color:var(--ink-3);font-size:12.5px;margin:0 0 16px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
input[type=password]{
  width:100%;padding:11px 12px;font:inherit;
  border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);color:var(--ink);min-height:44px;
}
input[type=password]:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.btn{
  width:100%;padding:11px 16px;min-height:44px;
  border:0;border-radius:var(--r-sm);background:var(--blue);color:#fff;
  font:inherit;font-weight:600;cursor:pointer;
  transition:transform .2s var(--ease),opacity .2s var(--ease);
}
.btn:hover{transform:scale(1.02)} .btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.msg{margin-top:10px;font-size:12.5px;min-height:18px}
.msg.err{color:var(--sig-red)}

.note{margin-top:10px;color:var(--ink-3);font-size:11.5px;line-height:1.6;word-break:keep-all}

.spinner{
  width:22px;height:22px;margin:0 auto 10px;
  border:2px solid var(--hairline);border-top-color:var(--blue);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .btn:hover,.btn:active,.seg button:active{transform:none}
}
@media (min-width:768px){ .wrap{padding:24px} header.top h1{font-size:22px} }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <section id="login" class="center" hidden>
    <div class="card">
      <h2>등대</h2>
      <p>경영 현황 · 비밀번호로 들어갑니다</p>
      <form id="loginForm">
        <label class="f"><span>비밀번호</span>
          <input type="password" id="pw" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit" id="loginBtn">들어가기</button>
      </form>
      <div class="msg" id="loginMsg" role="status" aria-live="polite"></div>
      <p class="note">한 번 들어가면 90일 동안 이 브라우저에서 다시 묻지 않습니다.</p>
    </div>
  </section>

  <!-- 로딩 -->
  <section id="loading" class="center" hidden>
    <div class="card" style="text-align:center">
      <div class="spinner" aria-hidden="true"></div>
      <div class="muted" style="font-size:12.5px">현황을 불러오는 중…</div>
    </div>
  </section>

  <!-- 오류 -->
  <section id="error" class="center" hidden>
    <div class="card">
      <h2>불러오지 못했습니다</h2>
      <p id="errorMsg"></p>
      <button class="btn" id="retryBtn" type="button">다시 시도</button>
    </div>
  </section>

  <!-- 본문 -->
  <main id="app" hidden>
    <header class="top">
      <h1>등대</h1>
      <nav class="tabs" role="tablist" aria-label="화면">
        <button type="button" role="tab" id="tabBtnPL" aria-selected="true">손익</button>
        <button type="button" role="tab" id="tabBtnSales" aria-selected="false">매출</button>
      </nav>
      <span class="spacer"></span>
      <span class="sub" id="asof"></span>
    </header>

    <!-- 손익 탭 -->
    <section id="tab-pl">
      <div class="controls">
        <div class="seg" role="group" aria-label="집계 범위">
          <button type="button" id="btnHQ" aria-pressed="true">본사 별도</button>
          <button type="button" id="btnCOMB" aria-pressed="false">합산</button>
        </div>
      </div>
      <div class="card">
        <div class="scroll">
          <table class="pl" id="pl">
            <thead><tr id="plHead"></tr></thead>
            <tbody id="plBody"></tbody>
          </table>
        </div>
        <p class="note" id="footnote"></p>
      </div>
    </section>

    <!-- 매출 탭 -->
    <section id="tab-sales" hidden>
      <div class="controls">
        <div class="seg" role="group" aria-label="연도" id="segYear"></div>
        <div class="seg" role="group" aria-label="값" id="segMode"></div>
      </div>
      <div class="card">
        <div class="scroll">
          <table class="pl" id="sales">
            <thead><tr id="salesHead"></tr></thead>
            <tbody id="salesBody"></tbody>
          </table>
        </div>
        <p class="note" id="salesNote"></p>
      </div>
    </section>
  </main>
</div>

<script>
/* =========================================================================
   등대 — 화면은 Pages, 데이터는 엣지 (ADR 0014)
   숫자 규약은 CONTEXT.md 「재무 기준」을 따른다:
     · 손익·매출의 금액은 전부 **무상·취소 포함 전 건** — 그래야 재무제표와 닫힌다
     · 매출 탭 수량은 **매출인가만**(무상·취소 제외, 반품 음수 포함)
   ========================================================================= */
var 주소 = 'https://orttfugxziltenujdlme.supabase.co/functions/v1/deungdae-read';
var 토큰키 = 'deungdae_token';
var 연도 = 2026;

var DB = null;
var 범위 = 'HQ';                 // HQ | COMBINED
var 펼침 = {};                   // 손익 행 키 -> bool

var 매출연도 = 2026;
var 매출모드 = '금액';           // 금액 | 장비 | 노즐
var 매출펼침 = {};

var $ = function (id) { return document.getElementById(id); };
var 면 = function (id) {
  ['login', 'loading', 'error', 'app'].forEach(function (x) { $(x).hidden = (x !== id); });
};

function 부르기(몸통) {
  return fetch(주소, {
    method: 'POST',
    headers: { 'content-type': 'text/plain' },   // text/plain이면 CORS 사전요청이 없다
    body: JSON.stringify(몸통)
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw Object.assign(new Error(j['오류'] || ('HTTP ' + r.status)), { 코드: r.status });
      return j;
    });
  });
}

/* ===== 인증 ===== */
function 토큰읽기() { try { return localStorage.getItem(토큰키); } catch (e) { return null; } }
function 토큰쓰기(t) { try { t ? localStorage.setItem(토큰키, t) : localStorage.removeItem(토큰키); } catch (e) {} }

$('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('loginBtn'), msg = $('loginMsg');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '확인 중…';
  부르기({ 동작: '로그인', 비밀번호: $('pw').value })
    .then(function (d) { 토큰쓰기(d['토큰']); $('pw').value = ''; msg.textContent = ''; 불러오기(); })
    .catch(function (err) { msg.className = 'msg err'; msg.textContent = err.message; })
    .then(function () { btn.disabled = false; });
});

$('retryBtn').addEventListener('click', 불러오기);

function 불러오기() {
  var t = 토큰읽기();
  if (!t) { 면('login'); return; }
  면('loading');
  부르기({ 토큰: t, 연도: 연도 })
    .then(function (d) { DB = d; 현재탭그리기(); 면('app'); })
    .catch(function (err) {
      if (err.코드 === 401) { 토큰쓰기(null); 면('login'); return; }   // 만료·무효 → 다시 로그인
      $('errorMsg').textContent = err.message; 면('error');
    });
}

/* ===== 탭 ===== */
var 탭 = 'pl';
function 현재탭그리기() { if (탭 === 'pl') 그리기(); else 매출그리기(); }
function 탭설정(t) {
  탭 = t;
  $('tabBtnPL').setAttribute('aria-selected', t === 'pl' ? 'true' : 'false');
  $('tabBtnSales').setAttribute('aria-selected', t === 'sales' ? 'true' : 'false');
  $('tab-pl').hidden = (t !== 'pl');
  $('tab-sales').hidden = (t !== 'sales');
  if (DB) 현재탭그리기();
}
$('tabBtnPL').addEventListener('click', function () { 탭설정('pl'); });
$('tabBtnSales').addEventListener('click', function () { 탭설정('sales'); });

/* ===== 집계 ===== */
var 백만 = function (v) {
  if (v == null) return '—';
  var s = (Math.round(v * 10) / 10).toLocaleString('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  return v < 0 ? '△' + s.replace('-', '') : s;
};
var 더 = function (a, f) { return a.reduce(function (s, r) { return s + (f(r) || 0); }, 0); };

/** 마감월 = 매출이 들어온 마지막 달 */
function 마감월() {
  return (DB['손익매출'] || []).reduce(function (m, r) { return Math.max(m, +r['월']); }, 0);
}

/** 시계열에서 한 지표의 월별 맵을 꺼낸다 */
function 축(지표, 칸) {
  var o = {};
  (DB['시계열'] || []).forEach(function (r) {
    if (r['지표'] === 지표 && r[칸] != null) o[+r['월']] = Number(r[칸]);
  });
  return o;
}

/**
 * 판관비 계정 목록. **합산이면 여기서만 달라진다** — 일본향 판매수수료를 빼고
 * 일본법인 운영비를 얹는다(내부거래 제거). 매출·국가별·제품별은 범위와 무관하다.
 */
function 판관비항목() {
  var 목록 = (DB['손익비용'] || []).filter(function (r) { return r['대분류'] === '판관비'; })
    .map(function (r) { return { 월: +r['월'], 구분: r['비용구분'], 이름: r['계정명'], 값: Number(r['금액']) }; });
  if (범위 !== 'COMBINED') return 목록;

  var 수수료 = 축('sga_commission_jp', '실적'), 운영비 = 축('jp_opex', '실적');
  목록 = 목록.map(function (r) {
    return (r.이름 === '판매수수료' && 수수료[r.월])
      ? { 월: r.월, 구분: r.구분, 이름: r.이름, 값: r.값 - 수수료[r.월] } : r;
  });
  Object.keys(운영비).forEach(function (m) {
    목록.push({ 월: +m, 구분: '고정비', 이름: '일본법인 운영비', 값: 운영비[m] });
  });
  return 목록;
}

/** 화면 행 정의를 만든다. 각 행은 월별 값 함수 하나로 정의된다 */
function 행들() {
  var 매출 = DB['손익매출'] || [];
  var 비용 = DB['손익비용'] || [];
  var sga = 판관비항목();
  var 국가순 = ['국내', '일본', '해외'];
  var 제품순 = ['CUREJET', 'NOVOJET', 'NOZZLE', '기타'];

  var 매출월 = function (f) { return function (m) { return 더(매출.filter(function (r) { return +r['월'] === m && f(r); }), function (r) { return Number(r['금액']); }); }; };
  var 원가행 = 비용.filter(function (r) { return r['대분류'] === '원가'; });

  var 목표 = {}; // 지표 -> 월별 목표
  ['rev_domestic', 'rev_japan', 'rev_overseas', 'rev_total'].forEach(function (k) { 목표[k] = 축(k, '목표'); });
  var 사업부지표 = { '국내': 'rev_domestic', '일본': 'rev_japan', '해외': 'rev_overseas' };

  var out = [];
  out.push({ 키: '매출', 이름: '매출액', 급: 'total', 값: 매출월(function () { return true; }), 목표: 목표.rev_total });

  국가순.forEach(function (g) {
    out.push({
      키: '국가:' + g, 이름: g, 급: 'child', 부모: '매출', 비중: true,
      값: 매출월(function (r) { return r['사업부'] === g; }), 목표: 목표[사업부지표[g]]
    });
  });
  제품순.forEach(function (p) {
    out.push({
      키: '제품:' + p, 이름: p, 급: 'child', 부모: '매출', 비중: true,
      값: 매출월(function (r) { return r['제품구분'] === p; })
    });
  });

  out.push({
    키: '원가', 이름: '매출원가', 급: 'total', 접기: true,
    값: function (m) { return 더(원가행.filter(function (r) { return +r['월'] === m; }), function (r) { return Number(r['금액']); }); }
  });
  원가행.map(function (r) { return r['계정명']; }).filter(function (v, i, a) { return a.indexOf(v) === i; })
    .forEach(function (이름) {
      out.push({
        키: '원가/' + 이름, 이름: 이름, 급: 'leaf', 부모: '원가',
        값: function (m) { return 더(원가행.filter(function (r) { return +r['월'] === m && r['계정명'] === 이름; }), function (r) { return Number(r['금액']); }); }
      });
    });

  out.push({ 키: '판관비', 이름: '판매비와관리비', 급: 'total', 값: function (m) { return 더(sga.filter(function (r) { return r.월 === m; }), function (r) { return r.값; }); } });

  ['고정비', '변동비'].forEach(function (구분) {
    var 안 = sga.filter(function (r) { return r.구분 === 구분; });
    out.push({
      키: '판관비:' + 구분, 이름: 구분, 급: 'child', 부모: '판관비', 접기: true,
      값: function (m) { return 더(안.filter(function (r) { return r.월 === m; }), function (r) { return r.값; }); }
    });
    // 계정은 누계 큰 순서로 — 매달 순위가 바뀌어 행이 춤추지 않게 한 번만 정한다
    var 이름들 = {};
    안.forEach(function (r) { 이름들[r.이름] = (이름들[r.이름] || 0) + r.값; });
    Object.keys(이름들).sort(function (a, b) { return Math.abs(이름들[b]) - Math.abs(이름들[a]); })
      .forEach(function (이름) {
        out.push({
          키: '판관비:' + 구분 + '/' + 이름, 이름: 이름, 급: 'leaf', 부모: '판관비:' + 구분,
          값: function (m) { return 더(안.filter(function (r) { return r.월 === m && r.이름 === 이름; }), function (r) { return r.값; }); }
        });
      });
  });

  var 매출f = out[0].값, 원가f = out.filter(function (r) { return r.키 === '원가'; })[0].값,
       판관f = out.filter(function (r) { return r.키 === '판관비'; })[0].값;
  out.push({ 키: '영업손익', 이름: '영업손익', 급: 'op', 값: function (m) { return 매출f(m) - 원가f(m) - 판관f(m); } });
  return out;
}

/* ===== 손익 그리기 ===== */
function 그리기() {
  var 끝 = 마감월(), 달 = [], m;

    return '<tr class="r-' + r.급 + '">'

      + '<td class="num muted">' + (연목 == null ? '—' : 백만(연목)) + '</td>'
      + '<td class="num rate' + 등급 + '">' + (달성 == null ? '—' : 달성.toFixed(1) + '%') + '</td>'

    + '<span class="adj"></span> 표시가 붙은 달에 조정이 들어갔고, 매출원가·고정비를 펼치면 내역이 보입니다. '
    + '매출·국가별·제품별은 무상·취소를 포함한 전 건 기준이라 세 블록의 합이 매출액과 같습니다. '

/* =========================================================================
   매출 탭 (결정_매출탭_260806)
   행: 매출액 계 → 한국·일본·해외. 해외를 펼치면 국가별, 각 행을 펼치면 장비/노즐/기타.
   값: 금액(전 건) | 장비 대수 | 노즐 수량 (수량은 매출인가만 — 무상·취소 제외).
   ========================================================================= */
var 수 = function (v) {
  if (v == null || !v) return '—';
  var n = Math.round(v);
  return (n < 0 ? '△' : '') + Math.abs(n).toLocaleString('ko-KR');
};

/** 매출탭 응답을 [사업부][국가][제품][월] = {금액, 수량} 으로 접는다 */
function 매출맵(y) {
  var t = { 맵: {}, 달: [] };
  var 끝 = 0;
  (DB['매출탭'] || []).forEach(function (r) {
    if (+r['회계연도'] !== y) return;
    var m = +r['월'];
    if (m > 끝) 끝 = m;
    var 국맵 = (t.맵[r['사업부']] = t.맵[r['사업부']] || {});
    var 제맵 = (국맵[r['국가']] = 국맵[r['국가']] || {});
    var 달맵 = (제맵[r['제품']] = 제맵[r['제품']] || {});
    // 같은 (월,국가,제품) 키가 두 행일 수 있어 더한다 (예: 사업부는 같고 원천이 다른 보정)
    var c = (달맵[m] = 달맵[m] || { 금액: 0, 수량: 0 });
    c.금액 += Number(r['금액']) || 0;
    c.수량 += Number(r['수량']) || 0;
  });
  for (var m = 1; m <= 끝; m++) t.달.push(m);
  return t;
}

function 매출행들(t) {
  var 맵 = t.맵;
  var 제품순 = ['장비', '노즐', '기타'];

  /** (사업부들 × 국가들 × 제품?) 범위의 월별 값 함수. 데이터가 없으면 null */
  var 값f = function (사업부들, 국가들, 제품) {
    return function (m) {
      var s = 0, 있음 = false;
      사업부들.forEach(function (사) {
        var 국맵 = 맵[사] || {};
        (국가들 || Object.keys(국맵)).forEach(function (국) {
          var 제맵 = 국맵[국] || {};
          (제품 ? [제품] : Object.keys(제맵)).forEach(function (제) {
            if (매출모드 === '장비' && 제 !== '장비') return;
            if (매출모드 === '노즐' && 제 !== '노즐') return;
            var c = 제맵[제] && 제맵[제][m];
            if (!c) return;
            s += (매출모드 === '금액' ? c.금액 : c.수량);
            있음 = true;
          });
        });
      });
      return 있음 ? s : null;
    };
  };

  var out = [];
  out.push({ 키: '전체', 이름: '매출액 계', 급: 'total', 값: 값f(['국내', '일본', '해외'], null) });

  // 한국·일본 — 금액 모드에서만 제품 3행으로 펼친다 (수량 모드는 단일 제품이라 펼칠 게 없다)
  [['한국', '국내'], ['일본', '일본']].forEach(function (p) {
    var 이름 = p[0], 사 = p[1];
    out.push({ 키: 'b:' + 사, 이름: 이름, 급: 'child', 비중: true, 접기: 매출모드 === '금액', 값: 값f([사], null) });
    if (매출모드 === '금액') 제품순.forEach(function (제) {
      out.push({ 키: 'b:' + 사 + '/' + 제, 이름: 제, 급: 'leaf', 부모: 'b:' + 사, 값: 값f([사], null, 제) });
    });
  });

  // 해외 — 펼치면 국가별, 국가를 다시 펼치면 제품 3행
  out.push({ 키: 'b:해외', 이름: '해외', 급: 'child', 비중: true, 접기: true, 값: 값f(['해외'], null) });
  var 금액합 = {}, 수량합 = {};
  var 해외국 = Object.keys(맵['해외'] || {});
  해외국.forEach(function (국) {
    var 돈 = 0, 개 = 0;
    t.달.forEach(function (m) {
      var 제맵 = 맵['해외'][국];
      Object.keys(제맵).forEach(function (제) {
        var c = 제맵[제][m];
        if (c) { 돈 += Math.abs(c.금액); 개 += Math.abs(c.수량); }
      });
    });
    금액합[국] = 돈; 수량합[국] = 개;
  });
  해외국 = 해외국.filter(function (국) { return 금액합[국] > 0 || 수량합[국] > 0; })   // 전량 무상 0원 국가는 숨긴다
    .sort(function (a, b) {
      if (a === '미상') return 1;                    // 미상은 맨 뒤
      if (b === '미상') return -1;
      return 금액합[b] - 금액합[a];                   // 연간 금액 큰 순 — 모드와 무관하게 순서를 고정한다
    });
  해외국.forEach(function (국) {
    out.push({ 키: 'c:' + 국, 이름: 국, 급: 'leaf', 부모: 'b:해외', 접기: 매출모드 === '금액', 값: 값f(['해외'], [국]) });
    if (매출모드 === '금액') 제품순.forEach(function (제) {
      out.push({ 키: 'c:' + 국 + '/' + 제, 이름: 제, 급: 'leaf2', 부모: 'c:' + 국, 값: 값f(['해외'], [국], 제) });
    });
  });
  return out;
}

    var 비중 = (매출모드 === '금액' && r.비중 && 전체누계 && 누계 != null)
      ? '<span class="share">(' + (누계 / 전체누계 * 100).toFixed(1) + '%)</span>' : '';

  });

  $('segYear').innerHTML = [2024, 2025, 2026].map(function (y) {
    return '<button type="button" data-y="' + y + '" aria-pressed="' + (매출연도 === y ? 'true' : 'false') + '">' + y + '</button>';
