<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SalesON</title>
<meta name="theme-color" content="#0A84FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SalesON">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#F2F2F7; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; }

  /* ── 스플래시: 화이트 위에 파란 워드마크가 조여들며 선명해지는 인트로 ── */
  #load { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
          background:#FFFFFF; z-index:10; transition:opacity .5s ease; }

  .wm { position:relative; font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
        font-size:min(21vw,110px); font-weight:800; line-height:1;
        background:linear-gradient(120deg,#0A84FF 20%,#0A57C2 80%);
        -webkit-background-clip:text; background-clip:text;
        -webkit-text-fill-color:transparent; color:#0A84FF;
        animation:focusin 1.8s cubic-bezier(.16,1,.3,1) both; }

  .wm .on-dot { position:absolute; top:0; right:-26px; width:20px; height:20px; border-radius:50%;
                background:#3ED07E; opacity:0; transform:scale(0);
                animation:doton .5s cubic-bezier(.2,1.6,.4,1) 1.65s forwards,
                          breath 2.2s ease-in-out 2.3s infinite; }

  .sub { margin-top:24px; font-family:-apple-system,'Malgun Gothic',sans-serif;
         font-size:14px; font-weight:600; color:#B9B9C0; letter-spacing:.42em; text-indent:.42em;
         opacity:0; animation:subin 1.1s ease 1.2s forwards; }

  @keyframes focusin {
    0%   { opacity:0; letter-spacing:.34em; filter:blur(14px); transform:scale(1.06); }
    55%  { opacity:1; }
    100% { opacity:1; letter-spacing:-.02em; filter:blur(0); transform:scale(1); }
  }
  @keyframes doton {
    0%   { opacity:0; transform:scale(0); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes breath {
    0%,100% { box-shadow:0 0 0 0 rgba(62,208,126,.45); }
    50%     { box-shadow:0 0 0 9px rgba(62,208,126,0); }
  }
  @keyframes subin { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div id="load">
  <div class="wm">SalesON<span class="on-dot"></span></div>
  <div class="sub">BAZ BIOMEDIC</div>
</div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbwOBKGwKxNy7Wjvc_s_fDftC5KqIcVSxGHo8e_UGG6lM-lVkUENtyECThgpNABZjW0gKA/exec"
        allow="clipboard-write" onload="appReady()"></iframe>
<script>
  /* ── 기기 ID 발급소 ──
     GAS 웹앱 iframe(googleusercontent.com)의 localStorage는 iOS Safari가 서드파티
     저장소로 취급해 주기적으로 비운다 — 그래서 신뢰 기기가 자꾸 풀리고 인증번호가 반복됐다.
     이 셸(bazbio.github.io)은 홈 화면 PWA의 1차 저장소라 살아남는다.
     웹앱이 postMessage로 요청하면 여기서 만든 안정적인 ID를 넘겨준다. */
  (function () {
    /* ── 임시 진단 표시 (핸드셰이크가 실기기에서 도는지 확인용) ──
       폰에는 콘솔이 없어서 화면에 남기지 않으면 아무것도 볼 수 없다.
       원인이 잡히면 이 함수와 호출부를 지운다. */
    function 진단(msg) {
      try {
        var el = document.getElementById('diag');
        if (!el) {
          el = document.createElement('div');
          el.id = 'diag';
          el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;'
            + 'background:rgba(0,0,0,.72);color:#8f8;font:11px/1.5 ui-monospace,monospace;'
            + 'padding:6px 10px;white-space:pre-wrap;word-break:break-all;';
          document.body.appendChild(el);
          setTimeout(function () { try { el.remove(); } catch (e) {} }, 40000);
        }
        el.textContent += (el.textContent ? ' · ' : '셸: ') + msg;
      } catch (e) {}
    }

    var id = '';
    var 기기출처 = '';
    try {
      id = localStorage.getItem('saleson_device') || '';
      기기출처 = id ? '기존' : '신규';
      if (!id) {
        if (window.crypto && crypto.getRandomValues) {
          var a = new Uint8Array(16); crypto.getRandomValues(a);
          id = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
        } else {
          id = String(Date.now()) + Math.random().toString(16).slice(2);
        }
        localStorage.setItem('saleson_device', id);
      }
    } catch (e) { 기기출처 = '저장소오류'; }
    /* ── 로그인 세션(토큰) 보관소 ──
       기기 ID와 같은 이유로 여기 둔다. 예전에는 토큰이 iframe localStorage에 있어서
       iOS가 그걸 비울 때마다 로그인 화면이 다시 떴다 — 기기 신뢰는 살아 있으니
       인증번호는 안 오지만 이름+PIN은 매번 다시 쳐야 했다. "90일간 로그인 안 함"이
       지켜지지 않던 두 원인 중 하나다(다른 하나는 토큰 수명이 30일이었던 것). */
    function 토큰읽기() { try { return localStorage.getItem('saleson_token') || ''; } catch (e) { return ''; } }

    // GAS 웹앱은 *.googleusercontent.com 샌드박스에서 돈다 — 그 외 출처와는 주고받지 않는다
    // (점 경계 필수: evilgoogleusercontent.com 같은 위장 도메인을 걸러야 한다)
    function 믿을수있는출처(o) {
      return /^https:\/\/([^\/]+\.)?googleusercontent\.com$/.test(o) || o === 'https://script.google.com';
    }

    /* 회신 상대를 고르는 곳. 원래는 ev.source 하나만 썼다. 8/1 실기기에서 홈 화면 앱이
       OTP를 끝낸 뒤에도 재실행마다 로그인 화면과 인증번호를 다시 냈는데, 그 증상은
       "회신이 웹앱에 도달하지 않는다"로만 설명된다. GAS 웹앱은 프레임이 2중
       (script.google.com → googleusercontent.com)이라 중첩 프레임의 ev.source를
       못 받는 경우가 의심 1순위다 — 그러면 postMessage 호출이 예외로 죽고 조용히 끝난다.
       확정 전이므로 ev.source를 먼저 쓰되, 없으면 아는 경로로 안쪽 프레임을 직접 찾는다.
       어느 쪽으로 나갔는지는 진단 줄에 남는다. */
    function 회신상대(ev) {
      if (ev.source) return { win: ev.source, 경로: 'src' };
      try {
        var inner = document.getElementById('app').contentWindow.frames[0];
        if (inner) return { win: inner, 경로: 'frame' };
      } catch (e) {}
      return null;
    }
    function 회신(ev, payload, 이름) {
      var t = 회신상대(ev);
      if (!t) { 진단(이름 + '=회신불가'); return; }
      try { t.win.postMessage(payload, ev.origin); 진단(이름 + '=' + t.경로); }
      catch (e) { 진단(이름 + '=실패(' + (e && e.name || e) + ')'); }
    }

    진단('기기=' + 기기출처 + ' 토큰=' + (토큰읽기() ? '있음' : '없음'));

    window.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (!믿을수있는출처(ev.origin)) return;
      if (d.type === 'saleson:need-device') {
        // id가 비어도 회신은 한다 — 침묵하면 웹앱이 타임아웃만큼 흰 화면으로 기다린다
        회신(ev, { type: 'saleson:device', id: id }, '기기');
      } else if (d.type === 'saleson:need-token') {
        회신(ev, { type: 'saleson:token', token: 토큰읽기() }, '토큰');
      } else if (d.type === 'saleson:save-token') {
        try { localStorage.setItem('saleson_token', String(d.token || '')); 진단('저장'); }
        catch (e) { 진단('저장실패'); }
      } else if (d.type === 'saleson:clear-token') {
        try { localStorage.removeItem('saleson_token'); } catch (e) {}
      }
    });
  })();

  var T0 = Date.now();
  function appReady() {
    // 애니메이션이 최소 3.2초는 보이도록, 로딩이 오래 걸리면 즉시 전환
    var wait = Math.max(0, 3200 - (Date.now() - T0));
    setTimeout(function () {
      var l = document.getElementById('load');
      l.style.opacity = 0;
      setTimeout(function () { l.style.display = 'none'; }, 450);
    }, wait);
  }
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
</body>
</html>
